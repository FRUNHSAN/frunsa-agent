# Usage:
#   1. Read this index (tags + status) to find relevant chains
#   2. Load the chain YAML files that match the current task's domain
#   3. After completing a complex feature or fixing a non-trivial bug,
#      write a new chain and update this index
#
# Schema: schemas/reasoning_chain.schema.json

