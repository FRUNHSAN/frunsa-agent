# ── 7. Meta: Methodology Reflection ──────────────────────────────────────

methodology:
  checkpoint_discipline: >
    This is the third Sufficiency Report in the Phase 14→17 chain.
    Each report serves as a mandatory checkpoint between phases:
    v1 (Phase 15) identified 2 insufficient keys → v2 (Phase 16) closed them
    via chaos injection → v3 (Phase 17) validates real-engine trace equivalence
    and documents deliberate gaps. This rhythm prevents architectural drift.
  key_insight: >
    The most valuable output of v3 is not what was added, but what was
    deliberately NOT added. The identified_gaps section transforms
    "we forgot model_name" into "we considered model_name and rejected it
    for specific, documented reasons." This is architectural maturity.
