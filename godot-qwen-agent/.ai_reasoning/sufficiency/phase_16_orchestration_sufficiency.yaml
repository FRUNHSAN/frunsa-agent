# ── Multi-Agent Coexistence Observation ───────────────────────────────

multi_agent_coexistence:
  status: verified
  description: >
    Planning engine produces agent.identity = {role: "planning", ...}
    Critic engine produces agent.identity = {role: "critic", ...}

    Both identities appear in the same sink, partitioned by engine.
    Querying by engine="planning" returns planning identities.
    Querying by engine="critic" returns critic identities.
    Zero key collisions: trace_context is per-StreamItem, not global.

    This validates that the agent.identity key name is safe for multi-engine
    use. The registration model (single engine="planning") is a registry
    concern, not a runtime concern.

  observation: >
    Two agents with different identities coexist cleanly in the same
    orchestration context. No namespace conflicts, no guardrail violations,
    no schema migration needed.

  engine_count: 3
  agent_count: 2  # planning + critic (orchestration does not carry agent.identity)

# ── Technical Debt ────────────────────────────────────────────────────

technical_debt:
  - item: agent.identity multi-engine registration model
    severity: medium
    description: >
      agent.identity is registered in TRACE_KEY_REGISTRY with engine="planning"
      (Phase 15), but is produced by BOTH planning and critic engines (Phase 16).

      The current model WORKS: no runtime errors, no guardrail violations.
      TraceKeyDef.engine is a documentation field, not a runtime constraint.

      However, it is semantically inaccurate: engine="planning" implies
      exclusive ownership, but agent.identity is generic agent metadata.

      The critic_engine_contract guardrail deliberately does NOT check for
      agent.* keys — it only checks critic.* keys. This means the critic's
      agent.identity emission is not guardrail-enforced.
    deferred_to: "Phase 17+"
    required_fix: >
      Change TraceKeyDef.engine: str → engines: list[str], allowing a single
      key to be registered for multiple producing engines. Update all guardrails
      that filter by v.engine to check list membership instead of equality.
    justification_for_deferral: >
      1. Current model works correctly at runtime
      2. One key (agent.identity) doesn't justify the migration cost
      3. Phase 17+ will add agent.capability_manifest, agent.trust_level —
         at 3+ keys, the migration is clearly justified
      4. Registry schema change requires coordinated guardrail updates
    workaround: >
      critic_engine_contract checks only critic.* prefix keys. agent.identity
      is verified by planning_engine_contract + cross-engine E2E tests.

