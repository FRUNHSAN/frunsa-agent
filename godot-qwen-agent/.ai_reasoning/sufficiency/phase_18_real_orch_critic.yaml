    resolution: >
      Phase 16 verified resource_pool_key through multi-pool config injection.
      Phase 18 LLMOrchestrationEngine carries resource_pool_key from the same
      branch dispatch loop, but the ROUTE decision (branch→pool mapping) now comes
      from LLM output parsed by _parse_route_decision(). Pool keys populate from
      the same resource_pools context field. Structure unchanged, source enriched.
    status_change: null

# ── New: Critic contract assessment ───────────────────────────────────

critic_contract:
  description: >
    LLMCriticEngine is the third real engine. It produces 2 critic.* keys
    (critic.score, critic.verdict) + agent.identity on every StreamItem.
    MockCriticBackend default responses match StubCriticEngine values exactly:
    decomposition(0.85, accept), dispatch(0.72, rework), synthesis(0.90, accept).

  keys:
    critic.score:
      status: verified
      evidence: >
        Float 0.0-1.0 on every StreamItem. Three evaluation steps each produce
        a distinct score from LLM output. Error path defaults to 0.0 with
        verdict="reject". MockCriticBackend returns deterministic scores matching
        stub values exactly.
      limitation: >
        Real LLM outputs may produce scores that don't match stub values.
        This is expected — stub values are a reference baseline, not a
        correctness constraint. Guardrails validate key presence and type,
        not specific values.

    critic.verdict:
      status: verified
      evidence: >
        String in ("accept", "rework", "reject") on every StreamItem.
        Parser enforces enum membership. Error path defaults to "reject".
        Three serial evaluations: decomposition→dispatch→synthesis.
      limitation: null

  overall:
    verified_count: 2
    insufficient_count: 0
    missing_count: 0
    total_keys: 2

# ── Real-engine semantic drift observation ────────────────────────────

real_engine_semantic_drift:
  description: >
    The core question from Sufficiency Report v3: when retry_count and
    resource_pool_key carry real LLM failure values, are the 6 orchestration
    keys still sufficient?

  finding: "YES — 6 keys remain sufficient"

  evidence:
    retry_count_real: >
      LLMOrchestrationEngine uses _parse_retry_decision() to determine whether
      to retry. The retry_count value (attempts - 1) uses the same arithmetic
      as the stub. The difference: the stub always retried based on config
      injection; the LLM engine decides autonomously. The key structure
      (integer count) is identical. The semantic range is identical (0..N).

    resource_pool_key_real: >
      LLMOrchestrationEngine uses _parse_route_decision() to map branches to
      pools. The pool key value comes from context.resource_pools (same as stub).
      The difference: branch definitions come from LLM output, not hardcoded
      BranchSpec. The key structure (string) is identical.

    critic_keys_real: >
      LLMCriticEngine produces critic.score (float) and critic.verdict (string)
      — same types, same enum, same key names as StubCriticEngine. The only
      difference is the score source (LLM judgment vs hardcoded value).

    cross_engine_key_isolation: >
      Multi-agent coexistence E2E tests verify:
      - LLM critic + LLM orchestration → same sink
      - critic.* keys never appear in orchestration rows
      - orchestration.* keys never appear in critic rows
      - agent.identity correctly partitioned by engine
      Zero key collisions across 3 LLM engines + 2 stub engines.

  conclusion: >
    The 18 trace keys (5 planning + 6 orchestration + 2 retrieval + 2 critic
    + 1 agent.identity + 2 component) are SUFFICIENT for 3 real LLM engines.
    Real engine integration does not require new trace keys — the existing
    contract surface is complete.

