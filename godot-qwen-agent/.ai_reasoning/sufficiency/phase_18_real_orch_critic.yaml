# ── Phase 16 → 18 Gap Resolution ─────────────────────────────────────

gaps_resolved:
  - key: orchestration.retry_count
    phase_16_status: verified
    resolution: >
      Phase 16 verified retry_count through deterministic chaos injection (stub).
      Phase 18 LLMOrchestrationEngine carries retry_count from the same code path
      (attempts - 1), but the RETRY decision now comes from LLM output parsed by
      _parse_retry_decision() instead of FailureInjectionConfig. The key structure
      is identical — integer count on every StreamItem. Real engine adds one nuance:
      retry decisions are LLM-driven, so the engine may skip retries the stub would
      have attempted, or retry in cases the stub wouldn't. This is correct behavior
      (real engine has richer judgment), not a contract violation.
    status_change: null  # Already verified, now confirmed with real engine

  - key: orchestration.resource_pool_key
