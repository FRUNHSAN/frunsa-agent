  design_principle: |
    Adversarial validation: select the engine that is MAXIMALLY DIFFERENT
    from RAG, not the engine that is most useful or most requested. Phase 10
    is a contract stress test, not a feature delivery.

# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Selecting Tool Use as second engine. Cannot validate streaming contracts — wastes the N=2 verification window."
  - "Selecting an engine because it's 'useful to users' rather than because it stresses adapter boundaries."
  - "Implementing real LLM calls in the Planning stub. Phase 10 validates contracts, not inference quality."
  - "Adding engine_type-based branching in adapters. The adapter must remain engine-agnostic."
  - "Modifying RAG engine during Planning integration. The point is to verify RAG needs zero changes."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. When selecting future engine types for integration:
     - Prioritize orthogonality to ALL existing engines, not just RAG
     - After Planning is integrated, the next engine should differ from BOTH
       RAG (uniform I/O-bound) AND Planning (bursty CPU-bound)
     - Event-driven or streaming-ingest engines are good Phase 11+ candidates

  2. trace_context namespace convention (established here):
     - All keys MUST use dot-separated engine prefix: "planning.*", "rag.*"
     - Guardrail trace_context_namespace enforces this at WARNING level
     - Upgrade to ERROR when existing bare keys are migrated (target: Phase 11)

  3. adaptive_strategy extension model:
     - Each new engine declares its strategy via PaceConfig.adaptive_strategy
     - PaceShapingWrapper routes to strategy branch; raises NotImplementedError
       until the strategy is implemented
     - Strategy implementations live in PaceShapingWrapper, not in engines
     - This inverts control: engines declare needs, adapter provides mechanisms

  4. When engines/ grows beyond ~5 types:
     - Consider grouping by domain: engines/reasoning/ (Planning, Reflection),
       engines/retrieval/ (RAG), engines/generation/ (CodeGen)
     - This is premature for Phase 10 — document, don't implement
