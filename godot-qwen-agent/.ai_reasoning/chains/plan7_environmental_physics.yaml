# Reasoning Chain: PLAN7 — Environmental Physics
chain_id: plan7_environmental_physics
title: "PLAN7 Environmental Physics: OutputPipeline + constrained decoding paradigm"
created_at: "2026-06-04T00:00:00Z"
status: active
tags: [plan7, output_pipeline, constrained_decoding, environmental_physics, post_processing]
related_chains: [plan6_semantic_trust, plan5_contract_lifecycle, plan4_bayesian_engine]

context: |
  PLAN1-6 progressively built sensor layers (EMA, Trust, Surprise, Semantic Trust)
  and actuator layers (DynamicBlueprint, ContractEvolutionEngine, SignalInterpreter).
  But the execution model had fundamental impedance mismatch: a deterministic state
  machine (contract engine) driving a non-deterministic system (LLM). Every prompt
  constraint was a "request" the LLM could ignore.

decision: |
  Shift from "prompt-based contract enforcement" to "environmental physics."
  The contract no longer asks the LLM to comply — it controls the environment
  AROUND the LLM. OutputPipeline applies deterministic post-processing:
  sentence truncation, format sanitization, tone filtering.
  Future phases: constrained decoding (GBNF) at token level, zero-shot
  classification replacing embedding similarity.

rationale: |
  30-round live test validated: contract events went from 0 to 6, evolutions
  from 2 to 6. "拜拜" no longer triggers follow-up questions. User commands
  ("字少点") correctly modify contract. Frustration signal now reduces
  verbosity as first action (not tone/anchoring as before).
  Default verbose reduced from HIGH to MEDIUM — eliminating 200-word essays
  for simple inputs. Sentence caps: MINIMAL=2, LOW=3, MEDIUM=5, HIGH=8.

future_guidance:
  output_pipeline:
    summary: "Deterministic post-processor: sentence truncation, format sanitization, tone filtering, sycophancy detection"
    priority: critical
  three_layer_control:
    summary: "Layer1=Prompt(constraints-as-text), Layer2=OutputPipeline(code-level), Layer3=ConstrainedDecoding(token-level)"
    priority: critical
  environmental_physics:
    summary: "Contract controls the environment around the LLM, not the LLM itself. From negotiation to physical law."
    priority: high
  local_inference:
    summary: "Phase 7.3: GBNF grammar + logit bias for physical token-space constraints. Only possible with local models."
    priority: medium

anti_patterns:
  - "Using prompt constraints as primary enforcement — they are probabilistic suggestions, not physical laws"
  - "Streaming with post-processing — OutputPipeline needs complete text for sentence counting"
  - "Hardcoding enforcement rules in run_live.py — use OutputPipeline component"
  - "Setting default verbose=HIGH — leads to 200-word essays for casual inputs"
