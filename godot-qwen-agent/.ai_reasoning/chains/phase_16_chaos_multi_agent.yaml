  # ── Phase 16 Post-Implementation Findings ────────────────────────────
  # Two issues were fixed during test suite verification. Both reveal
  # patterns worth documenting for future phases.

  post_implementation_fixes:
    - issue: "Sink.query_keys() total ≠ len(TRACE_KEY_REGISTRY) — 11 tests failed with 'assert 18 == 15'"
      root_cause: >
        SQLiteSink._seed_trace_keys() seeds from BOTH TRACE_KEY_REGISTRY AND
        COMPONENT_TRACE_KEYS. My initial dynamic reference used only
        len(TRACE_KEY_REGISTRY), missing the 3 component keys. Historical
        comments in tests (e.g. "6 engine + 3 component + 6 orchestration
        + 1 agent = 16") had been encoding this dual-registry total for phases
        but I replaced them with single-registry references.
      fix: >
        Changed all sink.query_keys() total assertions to
        len(TRACE_KEY_REGISTRY) + len(COMPONENT_TRACE_KEYS).
        Added COMPONENT_TRACE_KEYS imports to 7 test files.
        For engine_keys count (component_type IS NULL filter), used
        len(TRACE_KEY_REGISTRY) alone — correct since component keys have
        component_type set.
      lesson: >
        Dynamic references are better than hardcoded counts, but the reference
        must match what's actually being counted. sink.query_keys() returns
        the UNION of two registries — the reference must reflect that.
        When converting hardcoded counts to dynamic references, verify what
        the count actually represents (single registry vs union).

    - issue: "replace_all matched only specific variable names — 2 tests still failed with 'assert 18 == 15'"
      root_cause: >
        My first replace_all used 'assert count == len(TRACE_KEY_REGISTRY)'
        as old_string. This matched tests using variable name 'count' but
        missed tests using 'len(all_keys)' and 'len(keys)'. The same semantic
        assertion had three different syntactic forms.
      fix: "Targeted each remaining occurrence individually by surrounding context."
      lesson: >
        When doing bulk replacements of hardcoded counts, grep for ALL integer
        literals matching the current total, not just one variable name pattern.
        Better: write a helper like _total_keys() that returns the correct
        sum, so all tests use one reference point.

# ── 6. Future Guidance ────────────────────────────────────────────────

future_guidance:

  # ── Chaos injection patterns ────────────────────────────────────────

  failure_injection_is_config_not_subclass:
    summary: "Fault injection belongs in constructor config, not separate subclasses"
    detail: |
      Creating a FaultyXxxEngine subclass for every variant duplicates
      engine logic. A FailureInjectionConfig parameter achieves the same
      goal with minimal code change. This pattern generalizes: any engine
      stub that needs to simulate failure modes should accept an optional
      config, not require a parallel class hierarchy.

      The config must be deterministic (explicit tuples, not random rates)
      to keep tests repeatable.
    priority: high
    phase_applicable: "All future stub engines (Phase 17+)"

  exhaust_retries_is_separate_from_fail_on_attempts:
    summary: "Permanent failure (exhaust_retries) is semantically distinct from transient failure (fail_on_attempts)"
    detail: |
      fail_on_attempts: specific (chunk_id, attempt_number) pairs that fail,
      succeeding on the next attempt. Tests retry recovery.

      exhaust_retries: chunk_ids that fail on ALL attempts, producing error
      terminal. Tests permanent failure handling.

      These are different test scenarios. Merging them into one field
      (with sentinel values like attempt=-1) is less explicit and harder
      to read. Keep them separate.
    priority: medium
    phase_applicable: "All future failure injection configs"

  deterministic_injection_over_random_failure:
    summary: "Failure injection for testing MUST be deterministic — explicit tuples, not probability"
    detail: |
      Random failure rates (e.g. "20% chance per chunk") produce non-
      deterministic tests. CI flakiness, unreproducible failures, unable
      to assert specific retry_count values. Explicit (chunk_id, attempt)
      tuples guarantee: same config → same output → same assertions.
      This is non-negotiable for conformance tests.
    priority: critical
    phase_applicable: "All test infrastructure"

  # ── Multi-agent patterns ────────────────────────────────────────────

  stub_engine_protocol_is_reusable:
    summary: "The engine protocol (identity.py + stub.py + guardrail) is validated as reusable across 3 engine types"
    detail: |
      Phase 14: Orchestration engine (6 keys, 2 parallel branches)
      Phase 15: Planning engine (4 keys + agent.identity, cross-engine consumer)
      Phase 16: Critic engine (2 keys + agent.identity, result evaluator)

      All three follow the same pattern: frozen identity dataclass, async
      stub with StreamItems, trace key registration, dual-check guardrail.
      Adding a fourth engine type should follow the same pattern without
      architectural changes.

      The pattern's reusability is now evidence-backed, not hypothetical.
    priority: medium
    phase_applicable: "Phase 17+ (new engine types)"

  two_agents_coexist_without_key_collision:
    summary: "Two agents with different agent.identity values coexist cleanly in trace_context — no global namespace conflict"
    detail: |
      Planning produces agent.identity = {role: "planning", ...}
      Critic produces agent.identity = {role: "critic", ...}

      Since trace_context is per-StreamItem (not global), there is no
      key collision. Each StreamItem carries ONE agent.identity belonging
      to the engine that produced it. The sink correctly partitions by
      engine, so querying by engine="planning" returns planning identities
      and engine="critic" returns critic identities.

      This validates that agent.identity as a shared key name is safe
      for multi-engine use. The "ownership" question (who registered it)
      is a registry concern, not a runtime concern.
    priority: medium
    phase_applicable: "Phase 17+ (multi-agent communication)"

  # ── Technical debt tracking ─────────────────────────────────────────

  agent_identity_multi_engine_registration_deferred:
    summary: "agent.identity multi-engine registration model is deferred to Phase 17+"
    detail: |
      Current state: agent.identity registered with engine="planning" in
      TRACE_KEY_REGISTRY, but produced by BOTH planning and critic engines.

      This is explicit technical debt, documented in the Phase 16
      sufficiency report's technical_debt section. The proper fix:
      change TraceKeyDef.engine: str → engines: list[str], allowing
      a single key to be registered for multiple producing engines.

      Deferred because:
      1. The current model WORKS — no runtime errors, no guardrail violations
      2. The fix requires registry schema migration + guardrail update
      3. One key (agent.identity) doesn't justify the migration cost
      4. Phase 17+ will add agent.capability_manifest, agent.trust_level —
         at 3+ keys, the migration is justified

      Do NOT add duplicate registry entries or change engine="" as a
      workaround. Both are hacks that create more problems than they solve.
    priority: high
    phase_applicable: "Phase 17+"

  # ── Cross-phase lessons ─────────────────────────────────────────────

  sufficiency_report_loop_is_now_closed:
    summary: "Phase 15→16 completes the first full sufficiency loop: identify gaps → inject chaos → re-verify → 6/6"
    detail: |
      Phase 14: 6 orchestration keys defined (hypothesis)
      Phase 15: Reverse stress test → 4/6 verified, 2 insufficient (measurement)
      Phase 16: Chaos injection → 6/6 verified (validation)

      This is the template for all future contract validation:
      1. Define keys on paper (pre-design phase)
      2. Implement stub producing those keys
      3. Build a consumer that stress-tests the contract
      4. Produce sufficiency report identifying gaps
      5. Inject the missing scenarios (chaos, multi-pool, multi-agent)
      6. Re-verify → all keys semantically validated

      The loop transforms trace keys from "structurally present" to
      "behaviorally verified." This is the difference between a key
      that EXISTS and a key that has been PROVEN to capture the right
      information under stress.
    priority: medium
    phase_applicable: "All future contract validation phases"

  # ── Post-implementation operational lessons ─────────────────────────

  dual_registry_reference_for_sink_totals:
    summary: "sink.query_keys() returns UNION of TRACE_KEY_REGISTRY + COMPONENT_TRACE_KEYS — dynamic references must reflect this"
    detail: |
      SQLiteSink._seed_trace_keys() populates the trace_keys table from
      TWO sources: TRACE_KEY_REGISTRY (engine keys) and COMPONENT_TRACE_KEYS
      (component contract keys). Therefore:

      - sink.query_keys() total = len(TRACE_KEY_REGISTRY) + len(COMPONENT_TRACE_KEYS)
      - engine-only count (component_type IS NULL) = len(TRACE_KEY_REGISTRY)
      - component_candidate count = unchanged by engine key additions

      When converting hardcoded counts to dynamic references, first verify
      WHAT is being counted. Historical comments in tests often encode this
      distinction (e.g. "6 engine + 3 component + 6 orchestration + 1 agent").
    priority: high
    phase_applicable: "All future key additions"

  critic_namespace_minimum_viable_two_keys:
    summary: "Two keys (score + verdict) is the minimum viable namespace — one key is degenerate, three is over-design"
    detail: |
      A namespace with one key needs no disambiguation (you always know
      which key "critic.*" refers to). Two keys proves the namespace
      pattern works: both share the "critic." prefix, both are owned by
      the same engine, both are validated by the same guardrail.

      Future critic.* keys (critic.rubric, critic.confidence, critic.dissent)
      can be added without architectural changes — just register in
      TRACE_KEY_REGISTRY and the guardrail auto-detects them.
    priority: low
    phase_applicable: "Phase 17+ (critic expansion)"

anti_patterns:
  - "Creating a separate FaultyOrchestrationEngine class: duplicates 100 lines. Use OrchestrationConfig constructor parameter instead."
  - "Hardcoding retry_count > 0 assertions without failure injection: the test must actually trigger a failure. Mocking retry_count without a failure path is self-deception."
  - "Registering agent.identity twice for critic engine: currently registered with engine='planning'. Phase 16 accepts this as technical debt — the key is generic, the registration is historical."
  - "Creating validate_critic_trace() peer: single-engine contracts use guardrails + conformance tests. Cross-engine contracts need validators."
  - "Random failure injection: non-deterministic tests are debugging hell. Use FailureInjectionConfig with explicit (chunk_id, attempt) tuples."
  - "Thread-based retry simulation: use asyncio.sleep() — matches existing stub patterns and asyncio.gather() concurrency model."
  - "Hardcoded key counts (18) in tests: reference len(TRACE_KEY_REGISTRY) dynamically. Phase 15 lesson confirmed by 3 missed hardcoded counts."
  - "Schema migration for critic engine: trace_keys table TEXT engine column supports any engine name. No DDL change needed."
  - "Embedding critic logic in orchestration stub: misses the multi-agent coexistence validation and engine protocol reusability proof."
  - "Merging exhaust_retries into fail_on_attempts with sentinel values: the two failure modes are semantically distinct. Separate fields are self-documenting."
  - "Adding agent.identity duplicate entry in TRACE_KEY_REGISTRY for critic: dict keys must be unique. Proper fix is engine: list[str] in Phase 17+."
  - "Using len(TRACE_KEY_REGISTRY) alone for sink.query_keys() total: the sink seeds from BOTH registries. Use len(TRACE_KEY_REGISTRY) + len(COMPONENT_TRACE_KEYS)."
  - "Assuming replace_all with one variable name catches all hardcoded counts: tests use different variable names (count, len(all_keys), len(keys)) for the same value. Grep for all integer literals matching the current total."
