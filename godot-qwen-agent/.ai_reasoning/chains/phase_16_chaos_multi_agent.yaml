# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 15 used the Planning Engine to reverse stress-test Phase 14's 6
  orchestration trace keys. Result: 4/6 verified, 2/6 insufficient.

  The two insufficient keys expose the SAME gap: the stub is too clean.

  - orchestration.retry_count is always 0 — the stub never fails
  - orchestration.resource_pool_key is always "default" — the stub has one pool

  Phase 15's sufficiency report is unambiguous:
    "These 2 gaps are inherent to stub-based testing. The stub cannot trigger
     retries or provision multiple resource pools."

  Phase 16 closes this gap by injecting "real-world chaos" into the stub:
  transient failures (retry_count 0→1), exhaust-retries (error terminal),
  multi-pool routing (cpu vs gpu). Same stub, same deterministic model —
  but with a FailureInjectionConfig parameter that makes it stumble
  realistically.

  Simultaneously, Phase 15 proved that a single Agent (planning) can carry
  structured identity (agent.identity). Phase 16 pushes one step further:
  when TWO agents with different identities coexist in the same orchestration
  context, does the system handle it cleanly?

  This is NOT a full multi-agent system. It is a FOUNDATION VALIDATION:
  - Two engines (Planning + Critic), each with agent.identity
  - Two engine-specific trace key sets (planning.* + critic.*)
  - One shared orchestration context
  - Zero cross-agent communication (that's Phase 17+)

  The Critic is the minimal third engine: 3 serial steps, 2 trace keys
  (critic.score, critic.verdict), 1 agent.identity. It evaluates planning
  output — the simplest possible multi-agent interaction.

  Success = Sufficiency Report v2 with 6/6 verified + multi-agent coexistence
  observed without key collisions or guardrail violations.

  ## Why these two thrusts together?

  Separately, each thrust is ~200 LOC. Together they share infrastructure:
  - Both touch trace_registry.py (critic.* keys + key count update)
  - Both need guardrail updates (critic_engine_contract)
  - Both feed into the same Sufficiency Report v2
  - Both are verified by the same test suite run

  Splitting them into Phase 16a + 16b would duplicate the verification
  overhead (full suite run, guardrail check, index update) for minimal
  isolation benefit.

  ## Four-axis深化

  | Axis | Phase 15 State | Phase 16 Deepening |
  |------|---------------|-------------------|
  | Engine | Planning + Orchestration (2 engines) | +Critic (3 engines), validating engine protocol reusability |
  | Orchestration | Deterministic merge, 0 retry, 1 pool | Fault injection + multi-pool routing, verifying exception-path behavior |
  | Observability | Recording "success" traces | Recording "struggle" traces — retry, failover, pool contention |
  | Component | 3 component keys (retrieval + generation) | Unchanged — Phase 16 adds no component types |

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Phase 16 delivers Chaos Injection + Multi-Agent Foundation in 10 steps:

  1. **OrchestrationConfig dataclasses (engines/orchestration/config.py, NEW)**
     — FailureInjectionConfig: frozen dataclass with `fail_on_attempts`
     (tuple of (chunk_id, attempt)) and `exhaust_retries` (tuple of chunk_ids
     that fail ALL attempts, producing error terminal). OrchestrationConfig:
     wraps optional failure_injection + resource_pools Mapping.

  2. **Enhanced stub (engines/orchestration/stub.py, MODIFY)** —
     _simulate_branch gains retry loop (max 3 attempts). Before each attempt,
     checks FailureInjectionConfig: if (chunk_id, attempt) matches → raises
     RuntimeError("injected failure"). exhaust_retries → fails on all 3
     attempts → error terminal StreamItem. retry_count = attempts - 1.
     resource_pool_key from config or "default". Backward compatible:
     no config → Phase 15 behavior unchanged.

  3. **CriticAgent identity (engines/critic/identity.py + __init__.py, NEW)**
     — Frozen dataclass: {id, role, version, capabilities}. Follows the
     6-point agent.* namespace convention from Phase 15. to_trace_value() /
     from_trace_value() pattern reused. Role="critic", capabilities include
     "result_evaluation" and "quality_scoring".

  4. **StubCriticEngine (engines/critic/stub.py, NEW)** —
     3 serial steps: receive → evaluate (produce critic.score + critic.verdict)
     → terminal. 3 StreamItems, each carrying critic.* keys + agent.identity
     (critic version). No external dependencies. Pure async generator.

  5. **Trace key registration (core/observability/trace_registry.py, MODIFY)**
     — Add critic.score (float, engine="critic") + critic.verdict (str,
     engine="critic"). Total keys: 16 → 18. No ENGINE_TO_COMPONENT_MAP change
     (critic keys are engine-internal metadata, not component capabilities).

  6. **Engine exports (MODIFY + NEW)** —
     orchestratation/__init__.py exports OrchestrationConfig, FailureInjectionConfig.
     engines/critic/__init__.py exports CriticAgent, StubCriticEngine.

  7. **Namespace + critic_engine_contract guardrail** —
     Add "critic" to _KNOWN_ENGINES in trace_context_namespace.py.
     New critic_engine_contract guardrail (dual-check ERROR):
     missing required critic.* keys, unregistered critic keys.
     Register in guardrails/rules/__init__.py + checker.py.
     Guardrails: 15 → 16.

  8. **Sufficiency Report v2 (.ai_reasoning/sufficiency/, NEW)** —
     All 6 orchestration keys re-assessed: retry_count verified (retry
     injection 0→1, exhaust_retries terminal), resource_pool_key verified
     (cpu/gpu multi-pool). Multi-agent coexistence observation: two
     agent.identity values in same sink, different engine partitions,
     zero key collisions. technical_debt section documents agent.identity
     registration model decision (engine="planning" but multi-engine output).

  9. **Tests** — Conformance: test_orchestration_chaos.py (~12 tests),
     test_critic_engine.py (~12 tests). Integration: test_critic_sink.py
     (~5 tests). E2E: test_chaos_e2e.py (~8 tests). Existing test updates
     (key counts 16→18 in 4 files).

  10. **Full suite verification** — 551+ tests, 16 guardrails, 0 failures.

  ## Three micro-decisions from plan review

  (a) exhaust_retries field: separate from fail_on_attempts because the
      semantics differ — fail_on_attempts targets specific (chunk, attempt)
      pairs, exhaust_retries targets chunk_ids that fail ALL attempts.
      Mixing them would require sentinel values (e.g. attempt=0 for "all").
      Separate tuple is cleaner.

  (b) technical_debt section in sufficiency report: documents that
      agent.identity is registered with engine="planning" but produced by
      BOTH planning and critic engines. This is deliberate — the key is
      generic agent metadata, the registration is historical. Deferred to
      Phase 17+ when agent.* namespace expands to 3+ keys.

  (c) FailureInjectionConfig uses constructor parameter, not separate class.
      StubOrchestrationEngine.__init__ accepts config: OrchestrationConfig |
      None = None. No config = Phase 15 behavior unchanged. This preserves
      backward compatibility and avoids duplicating 100 lines of stub code.

# ── 3. Rationale ──────────────────────────────────────────────────────

rationale: |
  ## Why FailureInjectionConfig is a constructor parameter, not a separate class?

  Creating a `FaultyOrchestrationEngine` subclass would duplicate ~100 lines
  of _simulate_branch logic. The only difference is "sometimes fail" — a
  boolean flag and a retry loop. A config parameter is the minimum change
  that achieves the goal: same stub, same determinism, configurable chaos.

  Determinism is critical: FailureInjectionConfig uses explicit (chunk_id,
  attempt) tuples, not random failure rates. Same config → same output.
  This makes tests repeatable and debugging tractable.

  ## Why exhaust_retries is a separate field from fail_on_attempts?

  fail_on_attempts: "chunk c003 fails on attempt 1, succeeds on attempt 2"
  exhaust_retries: "chunk c005 fails on ALL attempts (1, 2, 3)"

  These are semantically different operations. Merging them would require
  a sentinel (e.g. attempt=-1 meaning "all") which is less explicit.
  Separate fields make the config self-documenting: you can see at a glance
  which items will recover and which will exhaust.

  exhaust_retries is essential for testing the error terminal path. Without
  it, every failure eventually succeeds — we can't verify that the system
  handles permanent failure gracefully.

  ## Why a separate Critic engine, not embedded critic logic in orchestration?

  Three reasons:
  1. Engine protocol reusability: if we can add a third engine by following
     the established pattern (identity.py + stub.py + __init__.py + guardrail),
     the engine protocol is validated as reusable. Embedding critic logic in
     orchestration tests nothing about engine extensibility.
  2. Independent guardrail: critic_engine_contract follows the same dual-check
     pattern as planning_engine_contract. Each engine's contract is independently
     verifiable — no cross-engine coupling in guardrails.
  3. Clean namespace: critic.* keys are owned by the critic engine. Embedding
     them in orchestration would blur the ownership boundary.

  ## Why critic.score + critic.verdict (not more, not fewer)?

  Two keys is the minimum to establish a critic.* namespace:
  - critic.score (float): quantitative assessment
  - critic.verdict (str): qualitative decision

  One key would be a degenerate namespace (no disambiguation needed).
  Three+ keys would be over-designing before we know what the critic needs.
  Two keys prove the pattern without over-committing.

  ## Why agent.identity stays registered as engine="planning"?

  This is explicit technical debt. The key is generic agent metadata —
  any engine can produce it. But TRACE_KEY_REGISTRY requires a single
  engine value. Changing it to engine="" or engine="*" would break the
  guardrail's engine-based filtering. Adding a second registration for
  the same key name would be a duplicate key error.

  The cleanest fix (multi-engine key registration) requires a registry
  schema change: engine: str → engines: list[str]. This is worth doing
  when agent.* namespace has 3+ keys (Phase 17+), not for one key.

  Phase 16 documents this decision in the sufficiency report's
  technical_debt section so Phase 17 knows exactly what to refactor.

  ## Why ERROR severity for critic_engine_contract from day one?

  Same rationale as orchestration_trace_completeness (Phase 14) and
  planning_engine_contract (Phase 15): the critic.* keys are pre-defined,
  not discovered through exploration. There is no exploratory phase.
  Any deviation from the 2-key contract is a real error.

  ## Why retry uses asyncio.sleep() with exponential backoff?

  The stub uses asyncio.sleep() for latency simulation (Phase 14 pattern).
  Retry backoff uses the same mechanism: asyncio.sleep(0.01 * 2^(attempt-1)).
  This matches the existing concurrency model (asyncio.gather) and avoids
  introducing threading or synchronous time.sleep().

# ── 4. Alternatives ───────────────────────────────────────────────────

alternatives:
  - option: "A: Separate FaultyOrchestrationEngine class instead of config parameter"
    pros: "No change to existing StubOrchestrationEngine, zero risk of breaking Phase 14/15 tests"
    cons: "Duplicates ~100 lines of _simulate_branch logic. Two classes to maintain. Adding a third variant (e.g. timeout injection) would require a fourth class. Violates DRY."

  - option: "B: Random failure injection (e.g. 20% failure rate per chunk)"
    pros: "More 'realistic' — matches production failure patterns"
    cons: "Non-deterministic tests. CI flakiness. Cannot assert specific retry_count values. Debugging hell: 'it passed last time'. Explicit tuples are testable, random rates are not."

  - option: "C: Embed critic logic in StubOrchestrationEngine (no separate engine)"
    pros: "Fewer files, simpler dependency graph, no new engine registration"
    cons: "Doesn't validate engine protocol reusability. No independent guardrail. Critics.* keys would be orchestration-owned — semantically wrong. Misses the multi-agent coexistence validation."

  - option: "D: Full Multi-Agent System with cross-agent communication"
    pros: "Most realistic, exercises agent-to-agent protocol"
    cons: "Over-engineered for Phase 16. Cross-agent communication requires message passing, routing, capability discovery — 500+ LOC. Premature without first validating that two agents can simply coexist."

  - option: "E: Skip exhaust_retries — only test recoverable failures"
    pros: "Simpler FailureInjectionConfig (one field instead of two)"
    cons: "Cannot test the error terminal path. retry_count would always recover — we'd never verify that permanent failure produces correct error metadata. Half the retry semantics remain untested."

  - option: "F: Change agent.identity registration to engine='' or add duplicate entry"
    pros: "Accurate representation of multi-engine usage"
    cons: "Empty engine breaks guardrail filtering. Duplicate key name in registry is invalid. Both are hacks. Proper fix (engine: list[str]) requires schema migration — Phase 17 concern."

