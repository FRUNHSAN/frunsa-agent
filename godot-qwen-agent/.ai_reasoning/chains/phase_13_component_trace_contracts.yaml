# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  ## Phase 14+: ComponentTraceKeyDef expansion

  As new engines and component types are added, extend COMPONENT_TRACE_KEYS
  following this pattern:
  1. Add ComponentTraceKeyDef entries for the new keys
  2. Add ENGINE_TO_COMPONENT_MAP entries for engine-specific keys
  3. If a new component type (beyond retrieval/generation/scoring), add it
     to the component_type values — no schema change needed (TEXT column)
  4. Run component_trace_completeness guardrail to verify new engines
  5. Update analysis script to include the new engine's data

  ## Scoring component type

  scoring has 0 keys in Phase 13 because no engine currently emits scoring
  trace keys. When a scoring engine is built (Phase 14+), add scoring.*
  keys to COMPONENT_TRACE_KEYS. The registry and validation function
  already support this — no code changes needed.

  ## Guardrail upgrade path

  component_trace_completeness is WARNING in Phase 13. Upgrade to ERROR
  in Phase 14+ after one phase of real-world use proves the rule's
  false-positive rate is acceptable.

  ## component_candidate deprecation

  Once all consumers (guardrails, analysis script, sink queries) have
  migrated to the component_type column, remove the component_candidate
  flag from TraceKeyDef. Target: Phase 14+.

  ## Direct component key usage

  New engines may emit component keys directly (e.g., retrieval.chunk_id
  instead of rag.chunk_id). The extended trace_key_registration guardrail
  already recognizes these. The sink stores them with engine="" since
  component keys are engine-agnostic. This is correct — component keys
  are the canonical form.

anti_patterns:
  - "Mapping in contracts: defining ENGINE_TO_COMPONENT_MAP in core/contracts/trace_keys.py. Contracts must not know engine names like 'rag.chunk_id' — platform isolation violation."
  - "Protocol-based trace keys: using ABC or Protocol for component trace contracts. Trace keys are data, not behavior. Frozen dataclass + validator is the established pattern."
  - "Removing component_candidate flag in Phase 13: breaks 4+ consumers. Deprecate in Phase 14+ after migration to component_type column."
  - "Separate component_trace_keys table: adds JOIN complexity. Single-table with NULL component_type is cleaner."
  - "Hard-coding key names: using string literals like 'retrieval.chunk_id' in validation logic instead of referencing COMPONENT_TRACE_KEYS or ENGINE_TO_COMPONENT_MAP."
  - "Modifying TraceKeyDef structure: engine-level keys are stable. Phase 13 adds new types alongside existing ones without changing their shape."
  - "Cross-engine occurrence rate expectations: expecting per-engine keys like 'rag.chunk_id' to appear in 95% of items pooled across heterogeneous engines. Use --per-engine for within-scope analysis."
  - "Stripping engine prefix for migration: current analysis script strips key_name.split('.')[1] and prepends 'retrieval.' — wrong for planning.cumulative_tokens which maps to generation.*. Use ENGINE_TO_COMPONENT_MAP."
