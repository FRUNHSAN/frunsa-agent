anti_patterns:
  - "Computing trust as a snapshot (EMA of recent scores) — trust must be ∫σ dτ, the accumulated history"
  - "Symmetric σ bounds — human psychology has negativity bias. Penalty must be larger than reward."
  - "Same threshold for entering and exiting a contract state — causes chattering. Use hysteresis."
  - "Applying sensor-driven contract changes every round — use cooldown ≥5 rounds per key"
  - "Rejecting /new via trust gate — user reset intent must bypass all gates (audit trail preserved)"
  - "Using heuristics (time-of-day, round count) for contract decisions — P4: Signal over Schedule"

