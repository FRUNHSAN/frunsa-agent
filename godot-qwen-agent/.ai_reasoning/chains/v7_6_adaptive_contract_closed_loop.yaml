context: |
  V7.6 closes the Darwinian triad at the heart of the Agent: Variation (LLM
  generation) → Selection (user behavior as environmental pressure) → Retention
  (contract state update). The closed loop operates on three control surfaces:

  1. Selection Pressure σ: A scalar field on the interaction manifold. Four
     orthogonal components — σ_clarity (user understanding), σ_emotion (user
     emotional state), σ_competence (system physical success), σ_explicit
     (user positive engagement). Asymmetric bounds: penalty [-0.05] > reward [0.03].

  2. Trust Breathing T(t) = T(0) + ∫σ dτ: Trust is NOT a state variable.
     It is the path integral of selection pressure over interaction time.
     T ∈ [0, 1] with hard clamping. OU mean reversion is a future feature.

  3. Contract Gradient Descent c_{t+1} = c_t - η·∇V(c_t; s): The contract
     evolves along the negative gradient of a potential function V that encodes
     user satisfaction. η = f(T): frozen at T<0.10, half-speed at T<0.30,
     full-speed otherwise. Lipschitz constraint ||Δc|| ≤ 0.3 (Banach contraction).

  Three red-team cracks were discovered and patched:
  - Crack 1 (Phase Lag): Streak counters were ephemeral → persisted to profile
  - Crack 2 (Limit Cycle): THEORETICAL↔WARM oscillation → hysteresis comparator
    (enter≠exit thresholds) + cooldown (≥5 rounds between same-key sensor adapts)
  - Crack 3 (Bypass Paths): /new could be rejected by trust gate; kernel repairs
    diverged nominal from actual → force_reset_proposal + _sync_contract_state

  V7.6's place in the architecture: it is the SELECTION + RETENTION half of
  the Darwinian triad. V7.7 (sheaf observer) provides the VARIATION input
  quality. Together they close the full adaptive loop.

alternatives:
  - option: "Use RL-based policy gradient for contract updates"
    pros: "Can learn complex nonlinear policies"
    cons: "Requires reward signal definition. Sample inefficient. Black-box — no Lipschitz guarantee."
  - option: "Hardcoded rules for contract changes (if frustration → WARM)"
    pros: "Trivial implementation"
    cons: "No gradient, no trust gating, no hysteresis. Oscillates on boundary conditions."
  - option: "Always apply contract changes — skip trust gate"
    pros: "Simpler — one less parameter"
    cons: "Trust<0.10 means the system has fundamentally lost the user. Contract changes at that point are noise."

decision: |
  σ is computed per-round from four orthogonal sensors (clarity, frustration,
  dimension/score, physical_pass). HardTanh clamping with asymmetric bounds.
  T = T + σ (path integral). c' = c - η·∇V with η = f(T) and Lipschitz.
  Hysteresis + cooldown prevent limit cycles. Streaks persisted for cross-session.
  Force reset for /new bypasses trust gate but preserves audit.

rationale: |
  The Darwinian triad (Variation→Selection→Retention) is the foundational
  metaphor. σ is the selection pressure — the environment (user) selecting
  for or against the agent's behavior. T is accumulated trust — not a snapshot,
  but the history of all selection events. ∇V is the contract's response to
  sustained selection pressure in a particular direction.

  The asymmetric EMA (negativity bias) in σ reflects human psychology: trust
  erodes faster than it builds. The Lipschitz constraint on ∇V is a Banach
  fixed-point guarantee — the contract converges to a stable point in finite
  steps, cannot oscillate.

  Hysteresis (enter≠exit thresholds) is the same pattern as V5's Schmitt
  trigger for binary routing — it's the universal solution to chattering at
  decision boundaries. Cooldown (≥5 rounds) prevents sensor noise from
  driving high-frequency contract switching.

  Sarcasm weighting for σ_explicit (confidence = 1 - sarcasm) closes a
  vulnerability where "Thanks a lot..." with sarcasm=0.9 would otherwise
  give a false positive +0.02 selection boost.

