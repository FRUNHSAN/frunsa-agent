alternatives:
  - "继续迭代关键词列表 —— 被否，关键词门控是无限回归。每次新边界需要新关键词。"
  - "Path B: Planning 始终生成 3 分支，用 clarity 后截断 —— 被否，高 clarity 时白生成 2 条 DAG 路径，浪费 Planning token 和 TTFT。"
  - "Path A: 滞后一轮 —— 被否，Scene 3 R1 首轮盲区无法解决。"
  - "clarity 用 embedding 锚点做 —— 被否，clarity 是逻辑推理问题，不是语义相似度问题。锚点永远匹配不到自相矛盾的需求。"

anti_patterns:
  - "用关键词列表做意图分类 —— 无限回归，不可扩展，违反 V5 数学哲学"
  - "让同一个 LLM 调用既做裁判又做运动员 —— clarity 评估和 DAG 生成混合在一个 prompt 中，传感器和执行器耦合"
  - "Critic 也用 fused f —— 清醒压制会让 Critic 在话题切换时丧失敏感度，旧标准不适用新话题的 case 无法被宽容"
  - "串行执行 clarity + drift —— 1s LLM 阻塞主线程，用户感知到卡顿"

future_guidance: |
  V5.3 将 drift⊕clarity 双传感器融合固化为标准控制模式。
  未来任何新的 Path 2 传感器（如 assess_urgency, assess_risk）都应：
    1. 继承 SemanticTrustEngine 的统一观测器接口（单一职责）
    2. 在 compute_dual_sensor_f 中增加维度（如三传感器融合）
    3. 明确分配给 Planning/Critic/Orch 中的哪个执行器
    4. 绝不混入关键词逻辑——纯数学信号流
