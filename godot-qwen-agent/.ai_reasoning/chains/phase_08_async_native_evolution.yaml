# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Before Phase 8.1, every step's run() method was synchronous but internally
  called asyncio.run() to bridge to async adapter methods. This meant:

  1. Each step created/destroyed its own event loop — 3 steps = 3 loops
     created and torn down in a single pipeline run
  2. The engine executed steps sequentially, even when independent branches
     could run concurrently
  3. Resource lifecycles (managed connections, thread pools) were untethered
     from pipeline lifecycles — no close() guarantee
  4. Health checks had a fragile dual-path: try get_running_loop() for sync
     probe, fall back to asyncio.run() for async probe

  The old pattern violated a core principle: the engine should own the event
  loop, not individual steps. Each asyncio.run() call is a mini event-loop
  lifecycle — expensive, opaque to tracing, and impossible to coordinate.

  Phase 8.1 replaced this with a single event loop owned by PipelineRunner.run(),
  async-native step.run() methods, DAG-based concurrent execution, and
  purely synchronous health checks.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Three interconnected changes:

  1. Async-native steps: All step.run() methods changed from `def run()` to
     `async def run()`. The engine's _dispatch() detects coroutines via
     asyncio.iscoroutine() and awaits them directly. Sync components
     (ChunkerAdapter) still work — their run() returns StepOutput directly,
     and _dispatch wraps the result in asyncio.to_thread() for non-blocking
     event-loop integration.

  2. DAG-based concurrent execution: arun() builds a dependency graph from
     StepConfig.provides keys (NOT step names — a critical distinction).
     Steps with no unsatisfied dependencies execute in parallel waves via
     asyncio.gather(). Skip propagation is preserved: if a dependency was
     skipped, dependents skip too.

  3. Sync health checks: health_check() methods now use direct synchronous
     backend calls (generate/score/search) instead of the async
     get_running_loop() + asyncio.run() dual path. This eliminates 3
     asyncio.run() calls from core/steps/ and simplifies health probe logic.

  The only asyncio.run() in core/ is PipelineRunner.run() — the single
  sync entry point that owns the event loop.

# ── 3. Rationale ─────────────────────────────────────────────────────

rationale: |
  Why this order (DAG concurrency before streaming):
  - Per the user's strategic directive: "在加速前，先焊死护栏" (weld the
    guardrails before accelerating). Phase 8.0 machine-enforced invariants
    came first, then Phase 8.1 engine refactoring.
  - A single event loop is prerequisite for streaming (Phase 8.2) — you
    can't stream tokens through per-step asyncio.run() boundaries.
  - DAG concurrency is prerequisite for multi-branch pipelines (Phase 9+).

  Why provided_to_idx, not name_to_idx:
  - depends_on references provided KEYS (like "chunks"), not step names
    (like "chunk_docs"). The original DAG scheduler incorrectly used
    name_to_idx for dependency resolution, causing all steps to appear
    independent and execute concurrently — breaking pipelines where
    retriever depends on chunker output.
  - Fix: build provided_to_idx mapping {provides_key: step_index} and
    resolve dependencies through that.

  Why sync health checks:
  - health_check() is called synchronously by the engine at init and by
    external monitoring. Forcing an async probe here requires either
    get_running_loop() (fragile, context-dependent) or asyncio.run()
    (creates unnecessary event loops).
  - All backends expose sync methods (generate, score, search) — the
    health check can call them directly. The adapter's async health_probe()
    remains available for external CLI/API use, but the core step's
    health_check() is now purely sync.

# ── 4. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Keep sync step.run() with internal asyncio.run() — only refactor engine"
    pros: "Less test churn; backward compatible with all existing steps"
    cons: "Per-step event loops destroy the observability model (no shared
      tracing context); streaming is impossible across asyncio.run()
      boundaries; each asyncio.run() is ~0.5ms overhead; violates the
      architectural principle that the engine owns execution context"

  - option: "Make health_check() async too"
    pros: "Consistent with async run(); adapter health_probe() could be
      called directly with native await"
    cons: "Engine calls health_check() synchronously at init — making it
      async would require asyncio.run() in the engine or a separate
      health-check entry point; adds complexity for no performance gain
      since health probes are infrequent and lightweight"

  - option: "Use name_to_idx for DAG dependency resolution"
    pros: "Simpler — step names are already unique and known"
    cons: "WRONG: depends_on names are provided keys, not step names.
      'chunks' (a provided key) would never match 'chunk_docs' (a step
      name). This was the actual bug that caused 2 E2E test failures."

