# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Calling asyncio.run() inside a step method. The engine already runs inside asyncio.run(). Nested loops cause 'Event loop is already running' errors or degrade to sequential execution. Rule: grep for asyncio.run() in core/ must return exactly 2 matches — PipelineRunner.run() (line ~218) and PipelineRunner.run_streaming() (line ~499). These are the ONLY two sync→async entry points."
  - "Resolving DAG dependencies by step name instead of provided key. depends_on references output keys (e.g. 'chunks'), not step names (e.g. 'chunk_docs'). Using name_to_idx causes all steps to appear independent, breaking pipeline ordering. Use provided_to_idx instead."
  - "Using get_event_loop() in any core/ code. This is deprecated in Python 3.12 and can create new loops inappropriately. Phase 8.1 makes health_check entirely sync so neither get_running_loop nor get_event_loop is needed there. The engine uses iscoroutine() + await, not manual loop management."
  - "Not calling resources.close() at pipeline end. Managed resources (connections, thread pools) must be cleaned up. arun() now calls res.close() before returning. Conformance test C4 enforces this."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. When adding a new step type (tool, classifier, etc.):
     - run() MUST be `async def` — the engine expects this
     - health_check() MUST be sync — call backend methods directly
     - Do NOT import asyncio in health_check() — it's not needed
     - Use StepOutput for return values, not raw data

  2. When adding a new pipeline:
     - depends_on values are PROVIDED KEYS, not step names
     - Use input_mapping to route upstream keys to step parameter names
     - Independent branches execute concurrently — ensure thread safety
       if sharing mutable state (prefer immutable state)

  3. Streaming (Phase 8.2 — COMPLETE):
     - Phase 8.2a: Single-link streaming (Generator→User) via run_streaming()
       and arun_streaming() dual entry points. Producer-Consumer + Sentinel
       bridge with asyncio.Queue(maxsize=32) for backpressure.
     - Phase 8.2b: DAG stream merge via merge_streams() — WAIT_ALL semantics,
       N-sentinel convergence, error-carrying StreamItem for cancellation.
       InternalStream stays in async memory space; UserFacingStream crosses
       SSE boundary (generator-only). Engine auto-merges upstream streams
       when a step has multiple streaming dependencies.
     - StepOutput has two stream fields: .stream (UserFacing, generator-only)
       and .internal_stream (DAG-internal, any step).

  4. Guardrails enforcement:
     - Rule: grep -c "asyncio.run(" in core/ must equal 2
       (PipelineRunner.run() + PipelineRunner.run_streaming())
     - Rule: grep -c "get_event_loop()" in core/steps/ must equal 0
     - Machine-enforced via guardrails/rules/stream_isolation.py:
       only generator steps may set StepOutput.stream (UserFacing)
