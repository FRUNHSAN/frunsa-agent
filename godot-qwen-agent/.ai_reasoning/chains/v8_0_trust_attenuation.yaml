anti_patterns:
  - "Adding a third clarity channel — clarity already drives branch_count (hard) and FULL_DAG gate. Prompt text on top is over-damping."
  - "Repeating e(t) in multiple prompt sections — Transformer self-attention nonlinearly amplifies repeated numerical features. One channel per numerical value."
  - "Creating a 4-bin step map and calling it 'continuous' — replacing one hardcoded constant with another is pseudo-continuity."
  - "Adding code to control what the LLM can figure out internally — LLMs already understand what MINIMAL means. They need authorization, not instruction."

