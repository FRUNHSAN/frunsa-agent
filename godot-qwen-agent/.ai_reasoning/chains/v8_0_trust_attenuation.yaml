# Reasoning Chain: V8.0 — Trust Attenuation + Semantic Authorization
chain_id: v8_0_trust_attenuation
title: "V8.0 做减法 — 连续信任衰减 + 语义授权升级（消灭最后两个硬开关）"
created_at: "2026-06-11T23:00:00Z"
status: active
tags: [v8.0, trust_attenuation, output_pipeline, continuous_decay, semantic_authorization,
       planning_hint, over_damping, self_attention_trap, pseudo_continuity]
related_chains: [v7_9_planning_contract_injection, v7_8_continuous_microsurgeries,
                  v7_7_sheaf_semantic_translator]

context: |
  V7.9's topological homomorphism audit left three gaps in the quantization
  debt register: clarity's [0.35, 0.70] range had zero prompt effect,
  verbosity-to-step-count was informational only, and e(t) had no Planning-layer
  exploration modulation.

  The initial V8.0 draft proposed three patches: clarity_hint (~15 lines),
  VERBOSE_STEP_MAP (~12 lines), and e(t) branch_hint (~6 lines). Red team
  review killed all three:

  1. clarity_hint: clarity already modulates Planning through TWO channels —
     compute_dual_sensor_f→branch_count (hard) and clarity<0.20→FULL_DAG (gate).
     Adding a third prompt channel = triple over-damping. The [0.35, 0.70]
     "zero prompt effect" is a feature, not a bug.

  2. VERBOSE_STEP_MAP: {"HIGH":(3,5), "MEDIUM":(2,4), "LOW":(1,3), "MINIMAL":(1,2)}
     is a 4-bin discrete mapping — it replaces one hardcoded min_steps with
     another. Pseudo-continuity, same category error as V7.8's v_map.

  3. e(t) branch_hint: e(t) already appears in lambda_hint text. Adding it
     again in branch_hint causes the Self-Attention Amplification Trap —
     Transformer models nonlinearly amplify repeated numerical features,
     causing Planning to overreact to moderate e(t) values.

  The accepted V8.0 is radically smaller: 2 patches, ~16 lines.

alternatives:
  - option: "Original 3-patch proposal (clarity_hint + VERBOSE_STEP_MAP + e(t) branch_hint)"
    pros: "More visible code change. Each patch addresses a known gap."
    cons: "Over-damping. Self-attention amplification. Pseudo-continuity. 35 lines of garbage."
  - option: "Do nothing — accept remaining quantization gaps as engineering bounds"
    pros: "Zero risk."
    cons: "Misses two genuinely clean improvements. Trust→output length is a single-channel addition with no double-counting risk."
  - option: "Current V8.0: semantic authorization + trust attenuation (CHOSEN)"
    pros: "Clean single-channel additions. Trust attenuation is genuinely continuous. Authorization upgrade delegates to LLM's continuous latent space."
    cons: "Small visible diff (~16 lines). Verbosity still 4 discrete bins (V7.8 CONTINUUM only in Synthesis layer)."

decision: |
  Patch 1 (2 lines): PLANNING_SEMANTIC_MAP verbosity entry changed from
  informational ("仅供参考，不影响任务分解粒度") to delegative
  ("你可以适当减少规划步数或降低分解粒度"). No new thresholds, no new
  mappings. The decision is delegated to the LLM's internal continuous
  reasoning space — which is far more continuous than any external if-else.

  Patch 2 (~14 lines): OutputPipeline.set_trust_attenuation(trust) adds a
  continuous multiplicative factor to the existing char_limit_multiplier.
  trust ∈ [0,1] → attenuation ∈ [0.6, 1.0]. No thresholds, no bins.
  Composes with the spinal reflex multiplier (1.0→2.0) — both are
  independent multiplicative factors on a shared continuous scale.

rationale: |
  The philosophical shift in V8.0 is from "adding code" to "delegating
  authority." The Planning LLM already knows what "MINIMAL" means — it
  doesn't need us to hardcode (1,2) step limits. It needs permission to
  act on that knowledge. The 2-line text change is a delegation of
  semantic authority, not a new control signal.

  The trust attenuation patch is the first place where trust directly
  modulates output length at the code level (not prompt level). This is
  genuinely continuous — trust=0.11 and trust=0.54 produce different
  effective output caps (63.6% vs 81.6%). The spinal reflex still works:
  emergency expansion (2.0x) composes with crisis contraction (0.636x)
  to produce a net 1.272x — more than normal but less than full emergency.

  The 35 lines that were killed represent a qualitative engineering
  maturity milestone: the ability to identify and reject one's own
  over-engineering before it reaches production.

