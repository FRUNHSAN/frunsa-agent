anti_patterns:
  - "不要把约束式工程和启发式工程混淆——区分标准是合法性的来源（公理推导 vs 经验试错）"
  - "不要用数据来决定约束的形式——数据只标定参数，形式来自公理推导"
  - "不要在单域验证后声称约束是'通用'的——域通用度G(C)<1.0的约束不是通用约束"
  - "不要让AI单方面废弃约束——Protocol 7规定AI仅有提议权，人类有裁决权"
  - "不要物理删除废弃的约束——移入archive/deprecated/，保留完整元数据"
  - "不要用社会约束（'别人怎么看'）替代物理约束（'数学怎么要求'）——前者产生LinkedIn帖子，后者产生铁律"
