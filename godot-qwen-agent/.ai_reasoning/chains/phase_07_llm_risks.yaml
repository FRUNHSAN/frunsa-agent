# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  MANDATORY for LLM Generator implementation:
  1. Adapter MUST be async with sync fallback (run_in_executor pattern)
  2. API key MUST come from ResourceContainer, never from env vars directly
     in the adapter (resolve_env is for pipeline config, not for secrets)
  3. Every generate() call MUST produce a DependencyCallTrace with:
     - model name, prompt_tokens, completion_tokens, total_tokens
     - latency_ms, finish_reason, status (success/timeout/error)
  4. Generation output MUST pass through validate_generation_output()
     before returning to the engine — catch format errors as warnings
  5. health_probe() MUST call a lightweight endpoint (e.g., model list
     or a minimal completion) — never a full generation
  6. Tests MUST use mock HTTP backends — never call real APIs in CI

  MANDATORY for Reranker implementation:
  7. Input: List[Chunk] + query → Output: List[RetrievalResult]
  8. Output length <= input length (never add chunks)
  9. Ranks are sequential starting at 1, sorted by descending score
  10. Empty input → empty output (not an error)

  Token cost safety:
  11. Adapter MUST track cumulative token usage per pipeline run
  12. Pipeline config SHOULD support max_tokens_per_run budget
  13. When budget exceeded, return graceful degradation (empty/partial
      result) rather than crashing

anti_patterns:
  - "Hardcoding API keys or using os.environ directly in the adapter instead of ResourceContainer.get('llm_credentials')"
  - "Making synchronous HTTP calls with requests.get() instead of aiohttp/httpx async via run_in_executor — blocks event loop"
  - "Letting JSON parse errors from LLM output propagate as unhandled exceptions — use validate_generation_output() with level='warning'"
  - "Calling the real LLM API in unit/integration tests instead of using a mock HTTP backend"
  - "Storing full prompt text in TraceLog snapshots — SnapshotPolicy.SUMMARY must hash/truncate prompt content to prevent PII leaks"
  - "Returning fake 'healthy' from health_check() without actually calling the provider's status endpoint"
  - "Adding more chunks than the input in a reranker (output > input length violates contract)"
