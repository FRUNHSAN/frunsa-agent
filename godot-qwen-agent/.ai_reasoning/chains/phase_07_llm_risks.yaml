# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 7 introduces the first non-deterministic, high-cost external
  dependencies: LLM Generator and Reranker. Unlike the vector store
  (which is deterministic and cheap), these components have unique risks:

  1. Non-deterministic output: same prompt → different text each call
  2. High latency: seconds to tens of seconds per call
  3. Token cost: every call has a dollar cost attached
  4. Format fragility: structured output (JSON mode) may not parse
  5. Credential risk: API keys must never leak into logs/snapshots
  6. Rate limiting: providers enforce RPM/TPM quotas

  This chain is written BEFORE implementation begins, per the Phase 6.5
  mandate: "pre-define anti-patterns, then write code that avoids them."

# ── 2. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Synchronous blocking HTTP calls with requests library"
    pros: "Simplest implementation; familiar pattern"
    cons: "Blocks the event loop; prevents concurrent pipeline execution;
      no DependencyCallTrace; violates phase_05 pattern"

  - option: "Direct SDK integration (openai package) in the step"
    pros: "Feature-rich; official support"
    cons: "Vendor lock-in; SDK dependency leaks into core platform;
      harder to mock in tests; version conflicts over 5-year timeline"

  - option: "Async adapter wrapping HTTP calls via run_in_executor"
    pros: "Reuses phase_05 pattern; vendor-neutral; mockable; traces
      auto-injected; health_probe works identically"
    cons: "Slightly more boilerplate than direct SDK"

# ── 3. Decision ──────────────────────────────────────────────────────

decision: |
  Async adapter pattern (reusing phase_05 external I/O template) with
  vendor-neutral HTTP backend. Credentials via ResourceContainer, never
  global. Non-deterministic output validated by a lightweight parsing
  layer before returning to the pipeline.

# ── 4. Rationale ─────────────────────────────────────────────────────

rationale: |
  - Reusing the VectorStoreAdapter pattern means 80% of the tracing,
    health check, and timeout code is already designed and tested
  - Credentials via ResourceContainer.register_managed() ensures they
    are: (a) not in source code, (b) not in snapshots, (c) released
    on pipeline shutdown
  - The parsing layer (validate_generation_output) follows the same
    contract-validation pattern as validate_chunk_output — it catches
    format errors early and produces structured ValidationErrors
  - Non-deterministic output means we must NEVER assert on exact text
    in tests — only on structure (type, fields present, token counts)
  - SnapshotPolicy.SUMMARY (default) prevents accidental PII/token leak
    via trace logs — full prompt text is NEVER stored in production

