# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 14 delivered the orchestration engine: 6 orchestration.* trace keys,
  StubOrchestrationEngine with N=2 parallel branch simulation, completeness
  guardrail (ERROR), 468 tests, 14 guardrails, 0 external deps.

  The 6 orchestration keys were pre-designed in Phase 12 as documentation-only
  ("NOT FOR IMPLEMENTATION") and materialized in Phase 14. But they remain
  HYPOTHESES — untested by any real consumer. The StubOrchestrationEngine
  produces orchestration keys, but nothing consumes them meaningfully.

  Without a consumer, we cannot answer the critical question:
  "Are these 6 keys SUFFICIENT for an engine that depends on orchestration?"

  Phase 15 builds the first consumer: an enhanced Planning Engine that:
  1. Defines agent.identity — the first agent.* namespace key
  2. Decomposes goals into sub-tasks
  3. Dispatches parallel branches through StubOrchestrationEngine
  4. Merges results — exercising merge_ordinal, parallel_depth, branch_taken
  5. Produces a structured Sufficiency Report assessing each key

  This is a REVERSE STRESS TEST. The goal is not "build a Planning Engine"
  but "validate (or falsify) the Phase 14 orchestration contract by putting
  a real consumer on top of it."

  Success = sufficiency report produced, not code shipped.

  Phase 14 future_guidance entries serve as boundary conditions:
  - capability_negotiation_requires_observability_arbitration (priority: high)
  - constraints_are_prescriptive_not_descriptive (priority: high)
  - constraint_validator_must_provide_remediation_feedback (priority: critical)
  - orchestration_primitives_may_require_fourth_layer (priority: medium)

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Phase 15 delivers the Planning Engine + Agent Identity in 10 steps:

  1. **AgentIdentity data model (engines/planning/identity.py, NEW)** —
     Frozen dataclass: {id, role, version, capabilities}. Includes
     to_trace_value() / from_trace_value() for trace_context serialization.
     Module docstring establishes the 6-point agent.* namespace convention
     for future keys (agent.capability_manifest, agent.trust_level).

  2. **PlanningContext + Protocol update (engines/planning/interface.py,
     MODIFY)** — Replace bare `goal: str` parameter with `context:
     PlanningContext` wrapping goal + agent_identity + sub_tasks +
     max_parallel_branches. PlanningEngine.plan() signature changes.

  3. **Trace key registration (core/observability/trace_registry.py,
     MODIFY)** — Add "agent.identity": TraceKeyDef(type=dict,
     engine="planning", component_candidate=False). Add "agent" to
     namespace documentation. Total keys: 15 → 16. No ENGINE_TO_COMPONENT_MAP
     change (agent.identity is not a component capability).

  4. **Enhanced stub with parallel branches (engines/planning/stub.py,
     MODIFY)** — 5-step scenario: analyze → decompose → parallel dispatch
     via StubOrchestrationEngine → merge → synthesize. Every StreamItem
     carries agent.identity + planning keys. Orchestration items are
     augmented (not replaced) with planning/agent context. dag_node_id
     embeds parsable branch origin: "merge_{branch}_{idx}".

  5. **Engine exports (engines/planning/__init__.py, MODIFY)** —
     Export AgentIdentity, PlanningContext.

  6. **Namespace + planning_engine_contract guardrail** —
     Add "agent" to trace_context_namespace known prefixes.
     New planning_engine_contract guardrail (dual-check ERROR):
     missing required planning.* + agent.* keys, unregistered keys.
     Register in guardrails/rules/__init__.py + checker.py.

  7. **Sufficiency Report (.ai_reasoning/sufficiency/, NEW)** —
     Structured YAML with contract_version: "1.0.0", per-key assessment
     (verified/insufficient/missing + evidence + stress_scenario +
     recommendation). Machine-consumable by Phase 15.5 / Phase 16.

  8. **Tests** — Conformance (~20 tests), integration (~6 tests),
     E2E (~5 tests), negative (~4 tests including PartialKeyMissing),
     existing test updates (key counts 15→16).

  9. **Full suite verification** — 498+ tests, 15 guardrails (14 + 1).

  Key design: agent.identity is ENGINE METADATA (component_candidate=False),
  not a component capability. It goes in TRACE_KEY_REGISTRY alongside
  existing engine keys. The agent.* namespace convention is documented
  for future extensibility.

  Planning Engine complexity: Option C (多步含并行分支). This is the
  minimum scenario that exercises merge_ordinal across branch boundaries.
  Options A/B don't; Option D is Phase 16+ territory.

  Agent Identity structure: Option B (结构化 JSON with capabilities field).
  Plain string would require migration when capability negotiation arrives
  (Phase 16+). UUID reference is premature.

  Sufficiency Report format: Option B (结构化 YAML checklist).
  Machine-consumable, directly feeds Phase 15.5 / Phase 16 Decision Gate.

  Three micro-adjustments from plan review:
  (a) Sufficiency report includes contract_version: "1.0.0" for Phase 16
      version matching before consuming the report.
  (b) dag_node_id uses "merge_{branch}_{idx}" naming convention to provide
      precise branch-anchoring for Phase 16 retry injection.
  (c) Negative tests include PartialKeyMissing scenario: planning.* keys
      present but agent.identity missing — validates dual-check precision.

# ── 3. Rationale ──────────────────────────────────────────────────────

rationale: |
  ## Why a reverse stress test, not just feature development?

  Phase 14's 6 orchestration keys were pre-designed on paper (Phase 12).
  A stub that produces keys is not the same as a consumer that NEEDS them.
  The sufficiency of these keys — whether they capture everything a consumer
  needs to know about orchestration decisions — is an empirical question.

  Phase 15 answers it by putting a real consumer (enhanced Planning Engine)
  on top of the orchestration stub. The Planning Engine's merge phase is
  the critical test point: it consumes orchestration output and must make
  decisions based on dag_node_id, branch_taken, merge_ordinal, etc.

  If any orchestration key is missing or semantically wrong, the Planning
  Engine's merge logic will fail — and the Sufficiency Report will document
  the gap. This is falsification-driven design.

  ## Why agent.identity goes in TRACE_KEY_REGISTRY, not COMPONENT_TRACE_KEYS?

  Agent identity describes WHO is running (engine metadata), not WHAT
  capability is being provided. COMPONENT_TRACE_KEYS is for cross-engine
  capability contracts (retrieval, generation, scoring). agent.identity
  is owned by the planning engine — it's engine-internal metadata that
  happens to be visible on the trace for downstream consumers.

  component_candidate=False — it would pollute component candidate analysis.

  ## Why PlanningContext replaces bare goal: str?

  The parallel branch scenario requires richer context than a single string:
  - agent_identity: which agent is planning (identity injection)
  - sub_tasks: what to dispatch in parallel (determines branch count)
  - max_parallel_branches: concurrency limit (resource constraint)

  Wrapping these in PlanningContext is cleaner than adding 4 parameters
  to plan(). The Protocol change is backward-compatible: the single
  implementor (stub) is updated in the same step.

  ## Why merge_ordinal is the most interesting key to validate?

  4 of 6 orchestration keys are straightforward:
  - dag_node_id: identity — always present if you have nodes
  - parallel_depth: static — determined by DAG topology
  - branch_taken: label — determined by decision logic
  - resource_pool_key: label — determined by resource config

  merge_ordinal is different. It's a DYNAMIC, CROSS-BRANCH property:
  0-based sequential numbering that must be continuous across items
  from DIFFERENT parallel branches merged into a single output stream.
  If merge_ordinal breaks (gaps, duplicates, non-zero start), the
  consumer cannot reconstruct deterministic ordering.

  retry_count is the second-most-interesting: it represents state
  CHANGES (increments on retry). But the stub can't trigger retries,
  so it's expected to be "insufficient" after Phase 15.

  ## Why dag_node_id embeds branch origin ("merge_{branch}_{idx}")?

  Currently branch_taken labels distinguish branches (fast_path vs
  full_rerank). But if branch count becomes dynamic (Phase 16+),
  semantic labels alone are fragile. Embedding the branch identifier
  in dag_node_id provides a structured, parsable anchor that a retry
  injection mechanism can target precisely: "retry merge_fast_path_2"
  is unambiguous.

  This is a naming convention, not a new key — zero LOC change.

  ## Why PartialKeyMissing negative test?

  The dual-check guardrail detects two error types:
  1. Missing required keys (incomplete emission)
  2. Unregistered keys (pollution)

  Full-missing ("no keys at all") is the degenerate case. Partial-missing
  ("has planning keys but missing agent.identity") is the PRECISE case —
  it validates that the guardrail's error message names the specific
  missing key, not a generic "something is wrong." This is the core
  value of the dual-check pattern.

  ## Why contract_version in Sufficiency Report?

  Phase 16 reads the sufficiency report to decide what needs fixing.
  If Phase 14's orchestration contract gets a hotfix between Phase 15
  and Phase 16, the report's assessment may be based on stale assumptions.
  Version matching ("does contract_version == current contract version?")
  prevents consuming an outdated report.

  ## Why ERROR severity for planning_engine_contract from day one?

  Same rationale as orchestration_trace_completeness (Phase 14): the
  4 planning keys + agent.identity were pre-defined, not discovered
  through exploration. There is no exploratory phase. Any deviation
  from the 5-key contract is a real error.

# ── 4. Alternatives ───────────────────────────────────────────────────

alternatives:
  - option: "A: Single-step planning engine (only validate agent.identity injection)"
    pros: "Minimal LOC, fastest to implement, zero risk of over-engineering"
    cons: "Cannot validate merge_ordinal (no parallel branches), cannot validate branch_taken, cannot validate parallel_depth. 3 of 6 orchestration keys go completely untested. Fails the 'reverse stress test' mission."

  - option: "B: Linear multi-step without parallel branches (2-3 serial steps)"
    pros: "Validates all planning keys + agent.identity, moderate complexity"
    cons: "No merge_ordinal testing at all. The most interesting orchestration key (the only dynamic, cross-branch property) remains unvalidated. Insufficient as a stress test."

  - option: "C: Plain string agent.identity ('planner-v1')"
    pros: "Simplest possible identity, zero serialization complexity"
    cons: "Non-extensible. Phase 16 capability negotiation requires structured capabilities manifest. Would require migration (string→dict) or a second agent.* key. Violates future_guidance #1."

  - option: "D: Dynamic planning engine (adjusts based on intermediate results)"
    pros: "Most realistic, exercises retry scenarios naturally"
    cons: "Over-engineered for Phase 15. Dynamic planning introduces decision logic that is hard to verify deterministically. The stub's value is deterministic output for contract testing — dynamic planning undermines this. Phase 16+ concern."

  - option: "E: Skip agent_identity — add it when capability negotiation arrives"
    pros: "One fewer namespace, one fewer key, one fewer test file"
    cons: "Misses the opportunity to define agent.* namespace convention NOW, when there's only one key to get right. Adding it later risks inconsistency. agent.identity is the simplest agent.* key — getting the convention right with one key is easier than with five."

