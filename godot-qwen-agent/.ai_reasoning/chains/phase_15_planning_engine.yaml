  # ── Phase 15 Post-Implementation Bug Fix Analysis ────────────────────
  # Five fixes were required after the initial implementation. Each reveals
  # an architectural pattern worth documenting for future phases.

  post_implementation_fixes:
    - issue: "_ast_utils.py filtered files with 'test' in full path → Guardrail missed all files in pytest tmp_path"
      root_cause: "collect_trace_keys_from_engine() checked str(py_file).lower() which includes tmp_path directory names like 'test_unregistered_key_flagged'"
      fix: "Changed to check py_file.name only — semantic: exclude test FILES, not test DIRECTORIES"
      lesson: "Guardrail path filters must be filename-scoped, not path-scoped. CI/CD environments (pytest, CI runners) use 'test' in directory names. A path-level 'test' filter is a false-negative machine."

    - issue: "reasoning_chain.schema.json rejected structured future_guidance objects"
      root_cause: "Schema defined future_guidance as type: string, but Phase 14+ chains use structured {summary, detail, priority, phase_applicable} objects"
      fix: "Changed to oneOf: [string (legacy), object with patternProperties (structured)]"
      lesson: "Schema evolution must be additive (oneOf), not replacement. Old chains use string format, new chains use structured format. Both must validate."

    - issue: "3 test files had hardcoded key count 15 instead of 16"
      root_cause: "Phase 15 added agent.identity → total keys 15→16, but counts weren't updated everywhere"
      fix: "Updated test_sqlite_sink.py, test_orchestration_e2e.py, test_component_trace_sink.py, test_orchestration_sink.py"
      lesson: "Hardcoded counts are anti-pattern confirmed. Tests should reference len(TRACE_KEY_REGISTRY) dynamically. The 3 missed counts were in tests using different variable names (keys vs all_keys vs engine_keys)."

    - issue: "test_registry_covers_all_stub_outputs missed component keys"
      root_cause: "Planning stub now passes through orchestration output including retrieval.* component keys, but test only checked TRACE_KEY_REGISTRY"
      fix: "Added COMPONENT_TRACE_KEYS to the registered set: registered = set(TRACE_KEY_REGISTRY.keys()) | set(COMPONENT_TRACE_KEYS.keys())"
      lesson: "Cross-engine passthrough changes the completeness check: a stub's output is now the UNION of its own keys + consumed engine's keys + component keys. Single-registry checks are insufficient."

    - issue: "test_engine_keys_still_present needed 12→13 (6 engine + 6 orchestration + 1 agent)"
      root_cause: "agent.identity is engine='planning' but prefix='agent' — it's an engine key with a non-engine prefix, a new pattern"
      fix: "Updated test_component_trace_sink.py assertion"
      lesson: "The prefix ≠ engine pattern (agent.* keys owned by planning engine) is architecturally valid but breaks the mental model of 'prefix == engine'. Tests that assume this 1:1 mapping need explicit special-casing."

# ── 6. Future Guidance ────────────────────────────────────────────────
#
#  Architecture-level guidance (Phase 15.5+ boundary conditions):
#  Entries marked "priority: critical/high" are inputs to Phase 15.5 design.
#  Entries marked "priority: medium" are tension points — record, don't act yet.

future_guidance:

  # ── Inherited from Phase 14 (still active) ──────────────────────────

  capability_negotiation_requires_observability_arbitration:
    summary: "能力协商需观测层作为运行时仲裁者 (inherited from Phase 14)"
    detail: |
      agent.identity.capabilities field is Phase 15's pre-positioning for this.
      When ENGINE_TO_COMPONENT_MAP evolves from static dict to runtime discovery,
      engine-self-declared capabilities must be backed by trace evidence
      (N most recent successful invocations) to be trusted.
      CapabilityDeclaration + TraceEvidence = trusted capability discovery.
    priority: high
    phase_applicable: "Phase 16+"

  constraints_are_prescriptive_not_descriptive:
    summary: "约束是规定性的，需独立于 trace key 的类型系统与校验时机 (inherited from Phase 14)"
    detail: |
      Phase 15 does NOT implement constraints. The Sufficiency Report's
      per-key `recommendation` field is the precursor to constraint
      remediation feedback — it demonstrates the "navigation" pattern
      (here's what's wrong + here's how to fix it) that constraint
      validators must provide.
    priority: high
    phase_applicable: "Phase 15.5"

  constraint_validator_must_provide_remediation_feedback:
    summary: "约束违反时必须返回结构化修正建议 (inherited from Phase 14, critical)"
    detail: |
      Sufficiency Report's per-key structure (status + evidence + recommendation)
      is the template for ConstraintViolation's three-part feedback:
      - why (human-readable explanation, maps to evidence)
      - remediation (list of {parameter, current_value, suggested_range, rationale},
        maps to recommendation)
      - fallback (degradation path if constraint cannot be satisfied)

      This is the fundamental API difference between guardrails (gatekeeper:
      "stop") and constraints (navigator: "here's the path").
    priority: critical
    phase_applicable: "Phase 15.5"

  orchestration_primitives_may_require_fourth_layer:
    summary: "编排原语组件化可能触发三层分层不变量的受控违反 (inherited from Phase 14)"
    detail: |
      Phase 15's Planning-Engine-calling-Orchestration-Engine is the first
      cross-engine consumer pattern. If this pattern generalizes (multiple
      engines consuming multiple other engines), the three-layer model
      (contracts → pipeline → adapters) may need a fourth orchestration layer.
      Phase 15 is the first empirical data point.
    priority: medium
    phase_applicable: "Phase 17+"

  # ── Operational (Phase 15.5 immediate) ───────────────────────────────

  retry_count_needs_real_retry_scenario:
    summary: "retry_count=0 throughout stub — cannot verify increment semantics"
    detail: |
      Phase 15's Sufficiency Report marks orchestration.retry_count as
      "insufficient" because the stub never triggers retries. Phase 16+
      must inject transient failures to verify:
      - retry_count increments correctly per attempt
      - reset semantics (does it reset between runs?)
      - retry limit enforcement (does it cap?)
      Until then, retry_count is structurally present but semantically unverified.
    priority: high
    phase_applicable: "Phase 16"

  resource_pool_key_needs_multi_pool_scenario:
    summary: "resource_pool_key='default' throughout — multi-pool routing untested"
    detail: |
      Phase 15's Sufficiency Report marks orchestration.resource_pool_key as
      "insufficient" because the stub uses only the default pool. Phase 16+
      should add a second resource pool (e.g., 'gpu' vs 'cpu') and verify:
      - pool key correctly labels each item
      - pool-aware scheduling decisions are traceable
      - pool exhaustion is distinguishable from other errors
    priority: medium
    phase_applicable: "Phase 16+"

  agent_namespace_convention_is_reusable:
    summary: "agent.* namespace 6-point convention applies to all future agent keys"
    detail: |
      The 6-point convention documented in engines/planning/identity.py:
      1. Frozen dataclass for data model
      2. to_trace_value() -> dict for serialization
      3. Register in TRACE_KEY_REGISTRY with engine=<owning-engine>
      4. Key name: "agent.<concept>"
      5. Value type: dict (JSON-serializable)
      6. component_candidate=False

      Future keys (agent.capability_manifest, agent.trust_level, agent.role_graph)
      must follow this convention. Phase 16 should add an agent_namespace_convention
      guardrail that AST-verifies compliance.
    priority: medium
    phase_applicable: "Phase 16+"

  merge_ordinal_non_deterministic_ordering_untested:
    summary: "Phase 15 validates deterministic merge only — non-deterministic timing untested"
    detail: |
      The stub is deterministic: fast_path always completes in 5ms,
      full_rerank in 15ms. In a real system, branch completion order is
      non-deterministic. merge_ordinal must be assignment-order, not
      branch-prediction-order. This cannot be tested with a stub —
      requires real async timing variance (Phase 16+).
    priority: medium
    phase_applicable: "Phase 16+"

  # ── Post-implementation lessons (Phase 15 bug fix analysis) ─────────

  guardrail_path_filters_must_be_filename_scoped:
    summary: "Guardrail AST scanners must filter by filename, not full path"
    detail: |
      collect_trace_keys_from_engine() was filtering files with "test" in
      str(py_file).lower(), which matched pytest tmp_path directory names
      like "test_unregistered_key_flagged". This caused ALL files to be
      silently excluded in pytest context, producing 0 violations for
      negative tests.

      The fix: check py_file.name instead of str(py_file). Semantic:
      exclude test FILES (test_*.py), not test DIRECTORIES.

      This is a general rule for all guardrail AST scanners: path-level
      filters create false negatives in CI/CD environments where "test"
      appears in directory names (pytest, tox, CI runners).
    priority: high
    phase_applicable: "All future guardrails"

  schema_evolution_must_be_additive:
    summary: "Schema changes must use oneOf to support both legacy and new formats"
    detail: |
      reasoning_chain.schema.json defined future_guidance as type: string,
      but Phase 14+ chains use structured {summary, detail, priority,
      phase_applicable} objects. Changing the type from string to object
      broke validation for all legacy chains.

      The fix: oneOf: [string (legacy), object (structured)]. Schema
      evolution is additive — new formats coexist with old, never replace.
      This applies to all schema files in .ai_reasoning/schemas/.
    priority: medium
    phase_applicable: "All future schema changes"

  eliminate_hardcoded_key_counts:
    summary: "Eliminate ALL hardcoded key counts from tests — use len(TRACE_KEY_REGISTRY) dynamically"
    detail: |
      Phase 15 added one key (agent.identity), changing total from 15→16.
      Despite the anti_patterns section already warning against hardcoded
      counts, 3 test locations were missed because they used different
      variable names (keys, all_keys, engine_keys).

      The lesson: grep for ALL integer literals that match the current
      key count before adding a new key. Better: convert all tests to
      dynamically reference len(TRACE_KEY_REGISTRY) so no grep is needed.
      Phase 16 should add a guardrail that flags hardcoded key counts in
      test assertions.
    priority: high
    phase_applicable: "Phase 16 (guardrail), all future key additions"

  cross_registry_coverage_for_stub_outputs:
    summary: "Stub output completeness checks must span ALL registries (engine + component)"
    detail: |
      When a stub (or any engine) does passthrough of another engine's
      output, its trace_context keys come from multiple sources:
      - Its own engine keys (in TRACE_KEY_REGISTRY)
      - Consumed engine's keys (in TRACE_KEY_REGISTRY)
      - Component keys (in COMPONENT_TRACE_KEYS)

      A completeness test that only checks TRACE_KEY_REGISTRY will false-
      positive on component keys. The fix: registered = set(TRACE_KEY_REGISTRY)
      | set(COMPONENT_TRACE_KEYS). Future engines with deeper passthrough
      chains may need additional registries.
    priority: medium
    phase_applicable: "Phase 16+ (multi-engine passthrough chains)"

  prefix_does_not_equal_engine:
    summary: "agent.* keys have prefix='agent' but engine='planning' — prefix ≠ engine is valid"
    detail: |
      agent.identity breaks the 1:1 prefix-to-engine mapping that tests
      like test_all_registry_keys_are_members assumed. The agent namespace
      is owned by the planning engine, but the prefix is "agent" not
      "planning".

      This is architecturally valid: namespaces can be owned by engines
      other than the one matching the prefix. Future agent.* keys
      (agent.capability_manifest, agent.trust_level) will follow this
      pattern. Tests and guardrails that assume prefix == engine must
      explicitly special-case this.
    priority: medium
    phase_applicable: "Phase 16+ (all agent.* keys)"

  sufficiency_report_feeds_decision_gate:
    summary: "Sufficiency Report is Phase 16 Decision Gate input — keep it current"
    detail: |
      Phase 16 reads .ai_reasoning/sufficiency/phase_15_orchestration_sufficiency.yaml
      before making any orchestration contract changes. The report's
      contract_version field enables version matching: if the orchestration
      contract has been hotfixed since Phase 15, Phase 16's reader detects
      the mismatch and refuses to consume stale assessments.

      Any Phase 15.5 constraint prototype that changes orchestration behavior
      MUST update the sufficiency report or produce an addendum.
    priority: high
    phase_applicable: "Phase 15.5+"

anti_patterns:
  - "Registering agent.identity in COMPONENT_TRACE_KEYS: agent identity is engine metadata, not a component capability. Goes in TRACE_KEY_REGISTRY with component_candidate=False."
  - "Creating validate_planning_trace() peer to validate_component_trace(): single-engine contracts are enforced by guardrails + conformance tests. Cross-engine contracts need validators."
  - "Hardcoding key count (16) in tests: reference len(TRACE_KEY_REGISTRY) dynamically. One registry change updates all tests. Phase 15 had 3 missed hardcoded counts across 4 files."
  - "agent.identity as plain string: would require migration when capability negotiation arrives (Phase 16+). Structured JSON with capabilities field is future-proof."
  - "Thread-based parallelism in enhanced stub: threading.Thread cannot yield StreamItems. Use asyncio.gather() — matches PipelineRunner and orchestration stub."
  - "Schema migration for agent namespace: trace_keys table TEXT engine column already supports any engine name. No DDL change needed."
  - "Generating Sufficiency Report as free-text document: structured YAML with status/evidence/recommendation per key is machine-consumable by Phase 16 Decision Gate."
