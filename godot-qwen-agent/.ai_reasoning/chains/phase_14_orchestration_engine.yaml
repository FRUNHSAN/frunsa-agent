future_guidance:

  # ── Operational (Phase 15 immediate) ─────────────────────────────────

  real_orchestration_engine_replaces_stub:
    summary: "Real orchestration engine MUST emit all 6 orchestration.* keys on every StreamItem"
    detail: |
      Same contract as the stub. Replace hardcoded branch simulation with
      dynamic DAG-based dispatch via PipelineRunner. Internal DAG state
      becomes richer but trace_context stays simple (str, int values only).
      Consider orchestration-specific query methods on SQLiteTraceSink
      (e.g., query_merge_ordinals_by_run). component_trace_completeness
      already scans orchestration/ directory — no guardrail change needed.
    priority: high
    phase_applicable: "Phase 15"

  component_trace_completeness_upgrade_to_error:
    summary: "Upgrade component_trace_completeness from WARNING to ERROR"
    detail: |
      After one phase of real-world use (Phase 14), following the pattern
      established by orchestration_trace_completeness (ERROR from day one
      because the 6-key contract was pre-defined).
    priority: low
    phase_applicable: "Phase 15+"

  insert_rows_for_bulk_writes:
    summary: "Phase 15+ could add bulk_write() calling _insert_rows() once per transaction"
    detail: |
      Useful when write() and write_streaming() are called together.
      The extracted _insert_rows() makes this possible without refactoring.
    priority: low
    phase_applicable: "Phase 15+"

  scoring_component_trace_keys:
    summary: "When scoring engine is built, add scoring.* keys to COMPONENT_TRACE_KEYS"
    detail: |
      validate_component_trace() and component_trace_completeness guardrail
      already support scoring (recognized type with 0 required keys since
      Phase 13) — no code changes needed.
    priority: low
    phase_applicable: "Phase 14+"

  # ── Architecture-level (Phase 15+ boundary conditions) ───────────────

  capability_negotiation_requires_observability_arbitration:
    summary: "能力协商需观测层作为运行时仲裁者"
    detail: |
      ENGINE_TO_COMPONENT_MAP 从静态字典演进为运行时能力发现服务时，
      引擎自声明的能力必须附带 trace 证据（最近 N 次成功调用记录）才可信。
      无证据的能力声明 → 降级或熔断，不应被编排引擎信任。

      这标志着观测轴与组件轴在运行时首次深度耦合，而非仅设计时静态关联。
      CapabilityDeclaration + TraceEvidence 构成可信能力发现的双要素。
    priority: high
    phase_applicable: "Phase 16+"

  constraints_are_prescriptive_not_descriptive:
    summary: "约束是规定性的，需独立于 trace key 的类型系统与校验时机"
    detail: |
      Trace key 描述"做了什么"（注册表 + commit-time guardrail）。
      Constraint 规定"不能做什么"（独立类型系统 + DAG-build-time validator）。

      技术实现上可复用 Phase 14 AST 扫描 + 注册表对比模式，但校验时机
      从 commit-time 变为 DAG-build-time，语义完全不同。

      需新建 core/contracts/constraints.py，定义 Constraint 类型、
      ConstraintRegistry，以及 ConstraintValidator（DAG-build-time 执行）。
      不应将 constraint 混入 trace_keys.py —— 它们是不同品类的概念。
    priority: high
    phase_applicable: "Phase 15.5"

  constraint_validator_must_provide_remediation_feedback:
    summary: "约束违反时必须返回结构化修正建议，而非仅报错 — 这是与 guardrail 的本质 API 差异"
    detail: |
      Guardrail 违反 = 报错消息（门卫模式：拦住你）。
      Constraint 违反 = 告知编排引擎"为什么不可构建 + 如何修改才能满足"
      （导航员模式：告诉你路在哪）。

      这要求 ConstraintViolation 的结构化程度远超 Violation：
      - violation.why: 为什么违反（人类可读）
      - violation.remediation: 修正建议列表，每条包含 {parameter, current_value, suggested_range, rationale}
      - violation.fallback: 如果约束无法满足，是否有降级路径

      若缺失此反馈回路，约束系统将退化为"高级版 lint"，丧失对编排引擎
      的引导能力。这是 constraint validator 与 guardrail 之间最本质的
      API 差异，也是 Constraint 系统从"静态检查工具"升维为"编排协作者"
      的分水岭。
    priority: critical
    phase_applicable: "Phase 15.5"

  orchestration_primitives_may_require_fourth_layer:
    summary: "编排原语组件化可能触发三层分层不变量的受控违反"
    detail: |
      RRF/rerank 等编排原语下沉为组件时，core/pipeline/ 需导入
      core/contracts/，违反 Phase 01 架构不变量 #1（三层严格分层）。

      这不是 bug，是 feature：说明三层模型在编排原语场景下已不够用。

      预留方案（二选一，暂不实现）：
      (a) 引入 core/orchestration/ 第四层，仅依赖 core/contracts/，
          编排原语在此层实现，不与 core/pipeline/ 耦合
      (b) 定义 OrchestrationPrimitive Protocol，与普通 Component 类型隔离，
          允许 core/pipeline/ 导入此 Protocol 但不导入具体组件类型

      当前不做任何代码变更，仅标记此张力点。待编排原语组件化实际需求
      成熟时，基于当时的架构上下文重新评估。
    priority: medium
    phase_applicable: "Phase 17+"

anti_patterns:
  - "Registering orchestration keys in COMPONENT_TRACE_KEYS: orchestration is an engine capability, not a component capability. Keys go in TRACE_KEY_REGISTRY with engine='orchestration', component_candidate=False."
  - "Creating validate_orchestration_trace() peer: single-engine contracts are enforced by guardrails + conformance tests. Cross-engine contracts need validator functions. Don't duplicate the 97-line pattern."
  - "Calling commit() inside _insert_rows(): transaction boundaries belong to callers. _insert_rows() does one thing — insert rows. The caller controls commit timing."
  - "Thread-based parallel simulation in stub: threading.Thread cannot yield StreamItems from within a thread. Use asyncio.gather() — matches PipelineRunner._arun_impl()."
  - "Hardcoding 6 in guardrail logic: reference _load_orchestration_keys() which derives the set from TRACE_KEY_REGISTRY. One registry change = guardrail automatically updated."
  - "Schema migration for orchestration keys: the trace_keys table already supports engine='orchestration' via TEXT column. No ALTER TABLE needed — just INSERT."
  - "Marking orchestration keys as component_candidate=True: orchestration keys describe engine behavior, not component capabilities. They would pollute component candidate analysis."
  - "AST scanner assumes dynamic keys: only static string literals in trace_context dicts are detected. This is an accepted limitation — same constraint as component_trace_completeness."
