# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 13 completed the component platform: 3 PROMOTE keys migrated to
  core/contracts/trace_keys.py, ENGINE_TO_COMPONENT_MAP established,
  schema v2 deployed. 428 tests, 14 guardrails, 0 external deps.

  Phase 12 pre-designed 6 projected orchestration.* trace_context keys
  as documentation-only — explicitly marked "NOT FOR IMPLEMENTATION."
  Phase 14 materializes them: the orchestration engine stub, formal
  registration of all 6 keys in TRACE_KEY_REGISTRY, an orchestration
  trace completeness guardrail, and the deferred _insert_rows() extraction
  from Phase 12/13 health checks.

  The orchestration engine is the first engine to BRIDGE TWO TRACE LAYERS
  in a single StreamItem: it consumes component trace keys (retrieval.*)
  to make orchestration decisions, and produces orchestration trace keys
  (orchestration.*) describing those decisions. This validates the
  cross-validation finding that 3 of 6 orchestration keys depend on
  component trace as input.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Phase 14 delivers the orchestration engine in 8 code changes:

  1. **_insert_rows() extraction (sqlite_sink.py)** — Extract the
     duplicated INSERT pattern (6 lines, 2 call sites) into a helper
     method. Does NOT call commit() internally — callers control
     transaction boundaries. This is a pre-feature refactor: extract
     before adding orchestration seeding to avoid touching the same
     pattern twice.

  2. **6 TraceKeyDef entries (trace_registry.py)** — Register all 6
     projected orchestration.* keys with engine="orchestration",
     component_candidate=False. Follows Phase 12 pre-design exactly.

  3. **Seed orchestration keys (sqlite_sink.py)** — _seed_trace_keys()
     inserts 6 orchestration rows. Zero schema migration — the TEXT
     engine column already supports "orchestration". Version stays at 2.

  4. **Orchestration engine stub (engines/orchestration/)** — Stub
     simulating N=2 parallel retrieval branches → merge. Uses
     asyncio.gather() (matching PipelineRunner._arun_impl()), emits
     both component keys (consumed) and orchestration keys (produced)
     in every StreamItem.trace_context.

  5. **Shared AST utility + orchestration_trace_completeness guardrail** —
     Extract _collect_trace_keys_from_engine() from
     component_trace_completeness.py to guardrails/rules/_ast_utils.py.
     New orchestration_trace_completeness rule: dual check (missing
     required keys ERROR + unregistered orchestration keys ERROR).

  6. **Namespace + exports** — Add "orchestration" to
     trace_context_namespace known prefixes. Export new types.

  7. **Tests** — Conformance (18 tests, acceptance gate), E2E (6 tests),
     integration (5 tests), existing test updates (2 files).

  8. **Full suite verification** — 428+ tests, 15 guardrails (14 + 1).

  Key design: orchestration is an ENGINE (engines/orchestration/), not
  a component. Its keys go in TRACE_KEY_REGISTRY, not COMPONENT_TRACE_KEYS.
  No validate_orchestration_trace() peer — single-engine contracts are
  enforced by guardrails + conformance tests, not cross-engine validators.

# ── 3. Rationale ──────────────────────────────────────────────────────

rationale: |
  ## Why orchestration is an engine, not a component?

  Orchestration keys describe the orchestration engine's own behavior
  (DAG node, parallel depth, merge ordinal, branch decision, retry count,
  resource pool). These are engine-internal concerns, not component
  capabilities. The Phase 12 pre-design explicitly stated:
  "No key is marked component_candidate." Components define WHAT
  (retrieval, generation, scoring); engines define HOW.

  ## Why no validate_orchestration_trace() peer?

  validate_component_trace() exists because component contracts are
  CROSS-ENGINE — any engine claiming retrieval capability must satisfy
  retrieval.chunk_id + retrieval.latency_ms. A validator function is
  the right tool for cross-engine contracts.

  Orchestration is a SINGLE ENGINE. Its contract ("the orchestration
  stub emits these 6 keys") is enforced by:
  1. trace_key_registration guardrail (ERROR) — already covers
     unregistered keys via union of both registries
  2. orchestration_trace_completeness guardrail (ERROR) — verifies
     all 6 keys present in stub source code
  3. Conformance tests — verify runtime output correctness

  Adding a 97-line validator for a single-engine contract would
  duplicate the pattern without adding enforcement value.

  ## Why _insert_rows() without commit()?

  Transaction boundaries belong to callers. write() may want to batch
  multiple INSERTs in a single transaction. _insert_per_item_records()
  may be called in a loop. If _insert_rows() committed internally,
  callers would lose the ability to batch.

  Future benefit: Phase 15+ could add a bulk_write() method that calls
  _insert_rows() once for summary + per-item rows in a single transaction.

  ## Why asyncio.gather() in stub?

  PipelineRunner._arun_impl() uses asyncio.gather() for concurrent DAG
  branch execution. Using the same concurrency primitive in the stub
  validates that the real orchestration engine can drop in directly.
  threading.Thread cannot yield StreamItems from within a thread.
  Sync for-loop doesn't validate the concurrency model.

  ## Why dual check in orchestration_trace_completeness?

  Single "missing keys" check only detects incompleteness. Adding
  "unregistered keys" check detects pollution — if the orchestration
  engine accidentally emits a typo'd key (e.g., "orchestration.retry_cnt"
  instead of "orchestration.retry_count"), the guardrail catches it
  BEFORE it becomes a data quality issue in production trace archives.

  ## Why orchestration_trace_completeness is ERROR (not WARNING)?

  component_trace_completeness started at WARNING because the component
  platform was brand new in Phase 13 — real-world use was needed to
  validate the rule's false-positive rate.

  Orchestration has no exploratory phase. The 6 keys were pre-defined
  in Phase 12 with full rationale. The stub is the sole producer.
  Any deviation from the 6-key contract is a real error — either a
  missing key (incomplete) or an extra key (pollution).

# ── 4. Alternatives ───────────────────────────────────────────────────

alternatives:
  - option: "A: Skip _insert_rows() extraction — leave duplication"
    pros: "Zero risk of transaction boundary bugs, one fewer file touched"
    cons: "Duplicated INSERT pattern persists. sqlite_sink.py already touched for orchestration seeding — this is the right time to extract"

  - option: "B: validate_orchestration_trace() peer to validate_component_trace()"
    pros: "Symmetric API, familiar pattern for developers"
    cons: "~97 LOC for a single-engine contract. Guardrails + conformance tests already provide two enforcement layers. Duplicates the validator pattern without adding enforcement value"

  - option: "C: Orchestration keys in COMPONENT_TRACE_KEYS with component_type='orchestration'"
    pros: "All trace keys in one registry"
    cons: "Violates the architectural definition: orchestration is not a component capability. Phase 12 pre-design explicitly stated 'No key is marked component_candidate.' Would require modifying validate_component_trace() to handle engine-level keys"

  - option: "D: New component_trace_keys table for orchestration"
    pros: "Would avoid NULL component_type semantics for orchestration keys"
    cons: "Schema migration needed. Orchestration keys are engine keys — the existing trace_keys table already supports them. Single-table approach is a Phase 13 design decision"

  - option: "E: orchestration_trace_completeness at WARNING"
    pros: "Safer — doesn't block commits if the rule has false positives"
    cons: "The 6-key contract is a Phase 12 pre-design, not an exploratory discovery. Any deviation is a real error. WARNING would allow broken orchestration stubs to be committed"

