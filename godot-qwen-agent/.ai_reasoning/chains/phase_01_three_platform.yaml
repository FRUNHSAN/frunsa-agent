# ── 1. Context ───────────────────────────────────────────────────────

context: |
  The project started from a competition-era codebase where components,
  data models, and execution logic were tightly coupled. The goal was
  to build a 5-year-scale agent platform where:

  - The component contracts platform (core/contracts/) evolves independently
  - The pipeline engine platform (core/pipeline/) evolves independently
  - A thin translation layer (core/adapters/) connects them

  Without this separation, every new component type (chunker, retriever,
  LLM generator) would force changes in the engine, and every engine
  upgrade would break existing components.

  Core insight: "高度分化 + 转译层连通" — maximum specialization of each
  platform, connected only by a minimal translation layer.

# ── 2. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Monolithic engine with built-in component types"
    pros: "Simpler initial implementation; fewer files"
    cons: "Adding a new component type requires engine changes; engine
      becomes a god object; impossible to swap backends independently"

  - option: "Microservices with gRPC between every component"
    pros: "Maximum isolation; independent scaling"
    cons: "Massive latency overhead for local pipelines; operational
      complexity disproportionate to a single-process agent"

  - option: "Plugin system with setuptools entry_points"
    pros: "Dynamic discovery; ecosystem-friendly"
    cons: "Implicit contracts; silent breakage on version mismatch;
      difficult to enforce data model invariants"

# ── 3. Decision ──────────────────────────────────────────────────────

decision: |
  Three independent platforms (contracts, pipeline, adapters) with
  explicit Protocol-based boundaries and a unified ComponentRegistry.

# ── 4. Rationale ─────────────────────────────────────────────────────

rationale: |
  - Each platform can be versioned, tested, and released independently
  - The engine knows ONLY the PipelineStep Protocol — it has zero imports
    from core/contracts (no coupling to Chunk, ContentBlock, etc.)
  - The adapters layer is the ONLY place that imports from both platforms
  - Adding a new component type (e.g., Reranker) requires: (a) a new
    Protocol in contracts/, (b) an adapter in adapters/, (c) zero changes
    to the engine
  - This is the architectural expression of the Dependency Inversion
    Principle at the platform level

# ── 5. Evidence ──────────────────────────────────────────────────────

evidence:
  test_files:
    - tests/conformance/test_contracts.py
    - tests/integration/test_e2e_pipeline.py
  test_cases:
    - "test_identity_chunker_end_to_end (adapter bridges contracts → engine)"
    - "test_wrong_type_raises_adapter_error (strict translation enforced)"

# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  MANDATORY for all future component types:
  1. Define the domain Protocol in core/contracts/ (NEVER in core/pipeline/)
  2. Create the adapter in core/adapters/ — it must validate types strictly,
     raise AdapterTypeError on mismatch, and NEVER silently coerce data
  3. The engine must never import from core/contracts directly
  4. Use register_component() for strategy discovery

  VIOLATION INDICATORS (if you see these, the architecture is degrading):
  - core/pipeline/ files importing Chunk, ContentBlock, or RetrievalResult
  - core/contracts/ files importing PipelineRunner or StepConfig
  - Any isinstance() check against a concrete type (not a Protocol) in the engine

anti_patterns:
  - "Importing Chunk/ContentBlock in engine.py to 'save time'"
  - "Adding a 'type' field to StepOutput instead of using the registry"
  - "Bypassing the adapter and calling a strategy directly from the engine"
