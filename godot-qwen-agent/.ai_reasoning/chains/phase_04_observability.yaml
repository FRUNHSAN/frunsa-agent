# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  MANDATORY for all new external I/O steps:
  1. health_check() MUST return a HealthStatus with at least one
     DependencyHealth entry for each external dependency
  2. Every external call (HTTP, gRPC, DB query) MUST produce a
     DependencyCallTrace and attach it to the StepTrace
  3. SnapshotPolicy.SUMMARY is the default — only use FULL in dev/test

  When adding a new TraceWriter:
  4. Implement the TraceWriter Protocol (write(tracelogs: List[TraceLog]))
  5. Register it via the engine's trace_writer parameter
  6. Add serialization round-trip tests

  When adding a new error severity level:
  7. It must be a Literal type — no arbitrary strings
  8. All existing catch blocks must be audited for the new level

anti_patterns:
  - "Writing to stdout/stderr directly instead of using TraceWriter"
  - "Health check returns hardcoded 'healthy' without probing the dep"
  - "Using SnapshotPolicy.FULL in production (PII leak vector)"
  - "Adding a dependency without a corresponding DependencyHealth entry"
