related_chains: [v7_4_identity_manifold, phase_23_kernel_service]

context: |
  V7.4 gave the Agent cross-session memory (knowing "who I am"). But it remains
  passive: while True: input() — only external input breaks equilibrium. A true
  agent needs an INTERNAL TENSION SENSOR: the ability to detect "something isn't
  finished" and proactively inject a low-priority PlanningContext.

  Mathematical: S_int is a scalar field on State × Identity space. The threshold
  θ_active defines a sublevel set filtration. When S_int > θ_active, the system
  enters the "concerned" region and injects a Soft Interrupt through the normal
  Planning pipeline.

  Information-theoretic: H_residual = Σ I(T_i; G) · 1_{step_i not converged}.
  Unconverged DAG steps = information the Agent "owes" the user. The entropy
  monitor measures this residual Shannon entropy and triggers repayment.

alternatives:
  - option: "Use a timer-based approach (check every N minutes)"
    pros: "Simple to implement"
    cons: "Violates P4 (Signal over Schedule). Timer doesn't know if there's anything to worry about."
  - option: "Always interrupt at session start"
    pros: "Never misses anything"
    cons: "Annoying. Violates user trust. No calibration to relationship depth."
  - option: "Make it a fifth engine"
    pros: "Uniform architecture"
    cons: "Same category error as v7.4 — EntropyMonitor doesn't produce StreamItem or call LLM"

decision: |
  Single module `core/watcher/entropy_monitor.py` (~130 lines). Same family
  as WassersteinProxy and IdentityManifoldStore. Pure math, zero LLM calls.
  REPL samples at session start only (cross-session concern — in-session
  real-time monitoring is v8).

rationale: |
  S_int uses v7.4's StreamingPercentile for component normalization — zero
  hardcoded thresholds. θ_active uses continuous sigmoid (no piecewise jumps).
  Temporal decay prevents infinite accumulation of old concerns. Three-state
  cold start prevents abrupt first→second-session transition.

