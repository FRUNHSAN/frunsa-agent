# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Designing component-level trace contracts (tool.*, memory.*, skill.*) before the component platform exists. The registry contains ONLY keys produced by N=2 engine stubs."
  - "Premature OTel/Jaeger integration before understanding your own trace data shape through JSON Lines samples."
  - "Adding speculative trace keys to the registry. Every key MUST have a producing code path in an existing stub or step."
  - "Making trace_key_registration ERROR instead of WARNING. WARNING nudges without blocking evolution. Upgrade to ERROR in Phase 13+."
  - "Treating engine-level trace keys as permanent when they belong to components. Use component_candidate=True to flag migration targets."
  - "Hardcoding engine names in prefix inference. Use registry-derived cache. New engines auto-register."
  - "Writing JSON Lines one syscall per line. Batch into a single write for atomicity."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. For Phase 12 (Multi-Engine Orchestration):
     - JSON Lines output from Phase 11 IS the design input for the
       SQLite/lightweight sink schema
     - _registered_keys vs _unregistered_keys split reveals which trace
       data has known semantics and which is uncharted
     - Per-item streaming trace: the last-item limitation documented
       here should inform a StreamingTraceRecord abstraction

  2. For Phase 13+ (Component Platform):
     - component_candidate=True keys (cumulative_tokens, chunk_id,
       retrieval_latency_ms) should migrate to component-level trace
       contracts: retrieval.*, generation.*, scoring.*
     - The 3 engine-internal keys stay at engine level permanently
     - Upgrade trace_key_registration from WARNING to ERROR after
       registry coverage reaches maturity

  3. For trace_key_serializability:
     - Monitor REVIEW_REQUIRED warnings from ast.Name patterns
     - If false positives are rare, keep split severity
     - If too many false positives, consider adding type annotation
       inspection (PEP 526) to resolve ast.Name references

  4. When engines/ directory grows beyond ~5 types:
     - Each engine's interface.py should call _register_trace_keys()
       to self-register its trace keys into the central registry
     - The registry stays physically in core/observability/ (single
       source of truth) but is logically owned by each engine

  5. For sample_rate:
     - Phase 11: always 1.0 (verification mode)
     - Phase 12+: production configurable. Start at 0.1 for Planning
       engines that produce hundreds of steps per run.
     - The exporter should emit a stats line (every N writes) with
       dropped_count / written_count for monitoring.
