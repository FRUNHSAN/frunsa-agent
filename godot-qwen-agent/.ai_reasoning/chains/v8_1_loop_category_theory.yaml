anti_patterns:
  - "Calling a function a 'functor' when the domain has no categorical structure"
  - "Calling a decision rule a 'Kan extension' when no diagram or functor K exists"
  - "Claiming Pontryagin optimality without defining a cost functional"
  - "Trying to 'continuous-ify' bang-bang control — the switches ARE the optimal solution. The problem is the switch TRIGGER conditions, not the switches themselves"
  - "Assuming Loops' 35% homomorphism score means the system is broken — binary routing is SUPPOSED to be discrete"

