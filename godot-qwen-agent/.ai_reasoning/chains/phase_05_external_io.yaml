    - "test_health_check_reports_vector_db_dependency_name"
    - "test_sync_context_health_check (no event loop → still works)"
    - "test_empty_backend_is_reachable_but_empty (degraded, not unavailable)"

# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  MANDATORY for ALL future external I/O adapters (LLM, Reranker, Web Search):
  1. Adapter.search()/call()/generate() MUST catch external exceptions
     internally and return graceful defaults (empty list, None, etc.)
  2. Adapter MUST set self._last_trace with the error status and message
  3. health_probe() MUST inspect last_trace.status before interpreting
     empty results as "no data found"
  4. The step's health_check() MUST handle both sync and async contexts:
     use get_running_loop() + asyncio.run() fallback pattern
  5. Every new I/O adapter MUST have negative tests covering:
     - Backend crash (exception during call)
     - Timeout (call exceeds deadline)
     - Empty result (backend reachable but no data)
     - Health check in sync context (no running event loop)

  Template for a new I/O adapter health_probe():
    1. Call self.call(...)  (which catches exceptions internally)
    2. Check self.last_trace.status
    3. If "error" → unavailable (with error message)
    4. If results present → healthy
    5. If no results → degraded (reachable but empty)

anti_patterns:
  - "Letting external exceptions propagate out of the adapter (bypasses graceful degradation)"
  - "Health probe that doesn't check last_trace.status (blind to swallowed errors)"
  - "Using get_event_loop() instead of get_running_loop() (crashes in sync contexts)"
  - "Calling asyncio.run() from inside a running event loop (nested loop error)"
  - "Health probe that returns 'healthy' without actually probing the backend"
  - "Using a module-level global variable for connection pools instead of ResourceContainer.register_managed()"
