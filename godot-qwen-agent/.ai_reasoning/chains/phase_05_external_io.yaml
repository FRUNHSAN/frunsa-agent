# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 5 introduced the first external I/O component: RetrieverStep
  wrapping a vector store backend (FAISS, Qdrant, etc.). This was the
  first real test of the three-platform architecture against an external
  dependency.

  Two critical bugs were discovered during Phase 5.3 negative testing:

  Bug 1 — Event loop crash in sync context:
    health_check() called asyncio.get_event_loop() which raises
    RuntimeError in Python 3.10+ when no loop is running. This crashed
    health checks in pytest (sync) and would crash in any non-async
    deployment.

  Bug 2 — Swallowed exceptions in health probe:
    VectorStoreAdapter.search() gracefully catches backend exceptions
    and returns [] (so the pipeline doesn't crash). But health_probe()
    only checked `if results:` — seeing [] from a backend crash, it
    reported "degraded" (empty index) instead of "unavailable" (crash).
    The exception was silently swallowed by the adapter's defensive
    error handling.

# ── 2. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Let backend exceptions propagate through adapter"
    pros: "health_probe naturally sees them; simpler code"
    cons: "Pipeline crashes on transient backend errors; every caller
      must wrap in try/except; violates graceful degradation contract"

  - option: "Add a separate probe() method that bypasses the adapter"
    pros: "Clean separation of concerns"
    cons: "Duplicates search logic; backend-specific probe code leaks
      into the step; two code paths to maintain and test"

  - option: "Inspect last_trace.status after adapter.search()"
    pros: "Reuses existing TraceLog infrastructure; single code path;
      adapter stays defensive while probe stays accurate"
    cons: "Adds a requirement that search() always sets last_trace"

# ── 3. Decision ──────────────────────────────────────────────────────

decision: |
  Two-part fix:
  1. health_check() uses get_running_loop() (not get_event_loop()) and
     falls back to asyncio.run() when no loop is running
  2. health_probe() inspects self.last_trace.status after search() —
     if status=="error", report "unavailable" with the trace's error
     message; otherwise use results to decide healthy vs degraded

# ── 4. Rationale ─────────────────────────────────────────────────────

rationale: |
  - get_running_loop() is the correct API for Python 3.10+; it raises
    RuntimeError when no loop runs (not when no loop EXISTS), letting us
    fall back to asyncio.run() which creates a fresh loop
  - asyncio.run() is safe for one-shot health probes; it creates and
    cleans up its own loop each time
  - Reading last_trace.status turns the adapter's defensive error handling
    from a liability (information loss) into an asset (structured error
    metadata) — the trace was there all along, we just weren't reading it
  - This pattern is reusable: any future adapter that catches exceptions
    internally MUST expose them via last_trace for health probe inspection

  This incident validated Phase 4.5's approach: "负面测试左移" (shift-left
  on negative testing). The bugs were caught before a single real vector
  database was connected, purely through contract-level negative tests.

# ── 5. Evidence ──────────────────────────────────────────────────────

evidence:
