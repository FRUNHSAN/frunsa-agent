# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Hardcoding engine_type-based branches in PaceShapingWrapper. Strategy routing uses PaceConfig.adaptive_strategy — the engine declares its need, the adapter provides the mechanism. No if engine_type == 'planning' checks."
  - "Using time.monotonic() for operation-level deadlines. Use time.perf_counter() for sub-ms resolution. monotonic() has ~15ms granularity on Windows."
  - "Adding engine-specific fields to StreamItem. Use the opaque trace_context Dict — each engine owns its key namespace."
  - "Implementing jitter strategy from Planning stub data alone. Wait for real Planning workload profiles before choosing pacing algorithm parameters."
  - "Making trace_context keys without '.' separator. Always use engine prefix: 'planning.*', 'rag.*'. Guardrail trace-context-001 enforces this."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. For Phase 11 (Observability):
     - trace_context is now proven to carry engine-specific tracing data
       through the adapter. The Observability layer should read trace_context
       keys by engine prefix to build per-engine trace views without
       parsing engine-specific semantics.
     - last_trace on AsyncDataStreamAdapter already records timeout/error/success
       status. Phase 11 should add trace_context propagation to DependencyCallTrace
       so cross-engine call chains are traceable.
     - The deadline timeout path (status="timeout") is tested and working.
       Phase 11 should add metrics aggregation for timeout rates per engine type.

  2. For future engine integrations (Phase 11+):
     - Follow the Planning pattern: define interface.py (Protocol + data model),
       write TDD tests against adapter contracts, implement minimal stub.
     - Each new engine should use a UNIQUE trace_context key prefix.
     - adaptive_strategy values should be registered in PaceShapingWrapper's
       strategy dispatch table before the engine stub is written.
     - The next engine should differ from BOTH RAG (I/O-bound) AND Planning
       (CPU-bound bursty) — consider Event-driven or streaming-ingest engines
       to maximize contract coverage.

  3. For jitter strategy implementation:
     - Deferred to Phase 11+. Requires real Planning engine latency data.
     - The strategy should control inter-item timing variance (max jitter
       in milliseconds between consecutive yields), not throughput.
     - Implementation belongs in PaceShapingWrapper._throttled_iter(),
       replacing the current NotImplementedError with actual pacing logic.

  4. For trace_context_namespace upgrade:
     - Currently WARNING. After existing bare keys are migrated (target: Phase 11),
       upgrade to ERROR to prevent new bare keys from entering the codebase.
     - Migration plan: audit all trace_context usages, add engine prefixes,
       remove the WARNING→ERROR upgrade in guardrails/checker.py.

  5. When engines/ directory grows beyond ~5 types:
     - Consider grouping by domain: engines/reasoning/ (Planning, Reflection),
       engines/retrieval/ (RAG), engines/generation/ (CodeGen).
     - Each sub-package should have its own interface.py and stub.py.
     - This is premature for Phase 10 — document only.
