# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 10 selected Planning as the second engine type to validate
  Phase 9/9.1 adapter contracts. The goal was to use Planning's orthogonal
  behavior (bursty CPU-bound reasoning vs. uniform I/O-bound retrieval)
  as an adversarial test of the adapter's abstraction boundaries.

  Three extension points were tested:
  1. trace_context: opaque Dict with engine-specific key namespaces
  2. adaptive_strategy="jitter": PaceConfig routing to engine-specific pacing
  3. send_with_deadline: operation-level timeout distinct from transport timeout

  This chain documents what was learned during the integration — what
  worked without changes, what required adjustment, and what should
  inform Phase 11 (Observability) design.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  The Phase 9/9.1 adapter contracts passed N=2 validation with minimal
  friction. Planning engine integration required:
  - Zero changes to RAG engine code (verified invariant)
  - 3 lines added to PaceShapingWrapper for jitter strategy routing
  - 1 clock resolution fix in stub (time.monotonic() → time.perf_counter())
  - 2 new guardrails rules to enforce multi-engine hygiene

  The opaque Dict design of trace_context proved correct: Planning's
  hierarchical keys (planning.step_index, planning.reasoning_depth,
  planning.parent_step_id) and RAG's flat keys (rag.chunk_id,
  rag.retrieval_latency_ms) coexist without adapter changes.

# ── 3. Rationale ─────────────────────────────────────────────────────

rationale: |
  Key findings from the integration process:

  1. trace_context opaque Dict = correct design:
     The adapter serializes/deserializes trace_context without inspecting
     keys. JsonRpc20Serializer round-trips all key namespaces intact.
     Planning.* and rag.* keys coexist in a single StreamItem without
     collision. The design choice of Dict[str, Any] over structured fields
     was validated — any structured schema would have leaked RAG or
     Planning assumptions into the contract.

  2. adaptive_strategy routing mechanism works:
     PaceConfig.adaptive_strategy is read by PaceShapingWrapper and
     routed to the correct strategy branch. The jitter branch raises
     NotImplementedError — proving routing without premature implementation.
     The check is positioned BEFORE the backpressure_signal check, so
     jitter strategy does not require a backpressure signal (correct:
     jitter is about timing variance, not queue depth).

  3. Operation-level deadline semantics validated:
     Planning stub checks elapsed time (perf_counter, not monotonic)
     before each step yield. When deadline=0.0, the first iteration
     catches it and raises asyncio.TimeoutError. The adapter's send_stream
     catches this in its asyncio.TimeoutError handler and records
     status="timeout" in last_trace. The layered timeout contract
     (transport-level vs. operation-level) is proven.

  4. Clock resolution matters for sub-ms deadlines:
     time.monotonic() has ~15ms resolution on Windows — insufficient
     for deadline enforcement in fast stubs. time.perf_counter() provides
     microsecond resolution and is the correct clock for operation-level
     deadlines. Production Planning engines with real LLM calls (>100ms
     per step) would not hit this, but the stub exposed it.

  5. Guardrails: 2 new rules for multi-engine hygiene:
     - engine_interface_purity: AST-enforced zero-implementation in
       engines/*/interface.py (Ellipsis-only bodies)
     - trace_context_namespace: WARNING-level enforcement of dot-separated
       engine prefixes in trace_context keys

# ── 4. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Implement jitter strategy in Phase 10"
    pros: "End-to-end pacing validation for Planning engine"
    cons: "Premature implementation without real Planning workload data.
      The NotImplementedError routing is sufficient to prove the extension
      point works. Implementation deferred to Phase 11+ when real Planning
      latency data is available."

  - option: "Make trace_context_namespace ERROR instead of WARNING"
    pros: "Stronger enforcement from day one"
    cons: "Existing test code uses bare keys in some places; migration
      should be gradual. Upgrading to ERROR in Phase 11 after tech-debt
      cleanup is the safer path."

  - option: "Merge PlanningStep into StreamItem (no separate engine model)"
    pros: "Fewer types; simpler adapter path"
    cons: "Violates the engines-as-consumers principle. Each engine needs
      its own internal model optimized for its domain. PlanningStep →
      StreamItem conversion is the engine's responsibility, not the
      adapter's."

