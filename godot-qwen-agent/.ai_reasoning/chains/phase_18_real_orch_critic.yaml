# ── Future Guidance ─────────────────────────────────────────────────────────

future_guidance:

  factory_assembly_contract:
    summary: "Use factory callables (not instances) for engine-level DI. This centralizes assembly decisions at one point and makes stub→LLM swaps one-line changes."
    detail: "Planning engines receive orch_factory: Callable[[], OrchestrationEngine] | None = None. Default factory creates stub. Callers who want LLM pass lambda: LLMOrchestrationEngine(adapter). This pattern generalizes to all engine-to-engine dependencies (future: critic_factory, memory_factory, etc.)."
    priority: critical

  metadata_extension_slot:
    summary: "Always include metadata: Mapping[str, Any] field in Context dataclasses. It is the pressure-release valve for engine developers who need to add debug information without expanding the trace key surface."
    detail: "metadata is NOT a trace key, NOT guardrail-enforced, NOT strongly typed. It is opaque to callers — planning engines pass it through without inspection. It IS recorded in trace_context_json via StreamingTraceRecord, providing post-hoc auditability without contract bloat."
    priority: high

  guardrail_prefix_filtering:
    summary: "When a key is registered to multiple engines (e.g., agent.identity), guardrails that verify engine-specific keys MUST filter by prefix (k.startswith('orchestration.')) rather than by engine registration (v.engines)."
    detail: "after agent.identity → engines=['planning', 'critic', 'orchestration'], the orchestration trace completeness guardrail loaded 7 keys (6 orchestration.* + 1 agent.identity) but only found 6 orchestration.* prefixed keys in source. The fix: filter registered keys by prefix, not by engine membership. This is a general pattern — multi-engine keys belong to multiple engines but are not 'owned' by any single one for completeness checks."
    priority: high

  sqlite_seed_check_all_keys:
    summary: "When seeding trace_keys for a new engine, check ALL existing keys (SELECT key_name FROM trace_keys) not just keys for that engine (WHERE engine = ?)."
    detail: "agent.identity is seeded in the planning block. When orchestration seeding checked WHERE engine = 'orchestration', it didn't find agent.identity (seeded with engine='planning') and tried to INSERT — causing UNIQUE constraint violation. The fix: check all existing key_names, not just those registered to the current engine. This applies to any future engine seeding blocks."
    priority: medium

  streaming_trace_record_conversion:
    summary: "Sink write_streaming() expects StreamingTraceRecord, not StreamItem. All test helpers that feed engine output into sinks must convert."
    detail: "StreamItem is the engine output type. StreamingTraceRecord is the sink storage type. They have different fields (StreamItem has model/finish_reason/error; StreamingTraceRecord has pipeline_run_id/step_name/dependency_name/ts_iso/engine). The conversion pattern from test_chaos_e2e.py is canonical."
    priority: medium

  deterministic_mock_pattern_confirmed:
    summary: "The Phase 7 MockLLMBackend pattern (frozen dataclass + round-robin + object.__setattr__ mutation) is now validated across 3 independent engines. It is the canonical pattern for all future real engines."
    detail: "LLMPlanningEngine (Phase 17), LLMOrchestrationEngine, and LLMCriticEngine (Phase 18) all use the same MockBackend pattern. Each engine defines its OWN MockBackend class — no shared base class. The pattern: frozen dataclass with responses tuple + _call_count field (repr=False) + generate() using idx = _call_count % len(responses) + count_tokens() for token estimation."
    priority: high

  async_for_in_sync_test:
    summary: "Python cannot have 'async for' directly in sync test functions. Wrap in inner async function and call via asyncio.run()."
    detail: "This is a recurring bug across all E2E test files. The pattern: define an inner async def _collect() that does the async for loop, then call asyncio.run(_collect()). Never put async for directly in a def test_* function body."
    priority: medium

# ── Anti-Patterns ───────────────────────────────────────────────────────────

anti_patterns:
  - "Hardcoding StubOrchestrationEngine() in planning engines — violates Principle 1 (Factory Assembly Contract). Use orch_factory lambda."
  - "Sharing MockBackend between engines — each engine defines its own for isolation."
  - "Writing 'async for' directly in sync test functions — always wrap in inner async def."
  - "Passing StreamItem to sink.write_streaming() — must convert to StreamingTraceRecord first."
  - "Adding new trace keys before Sufficiency Report confirms need — 18 keys are sufficient."
  - "Filtering guardrail keys by engine registration instead of by prefix — multi-engine keys (agent.identity) break this."
  - "Checking WHERE engine = ? in SQLite seed blocks instead of checking all existing keys — causes UNIQUE violations for multi-engine keys."
  - "Modifying stub engines when adding LLM counterparts — stubs are canonical reference implementations, both coexist."

