# ── Context ────────────────────────────────────────────────────────────────

context: |
  Phase 17 delivered the first real LLM engine (LLMPlanningEngine) and proved
  the GenerationAdapter reuse pattern works. But two structural gaps remained:

  1. Orchestration and Critic engines had no formal Protocol (interface.py)
  2. Planning engines directly instantiated StubOrchestrationEngine() — hardcoded
     dependency preventing engine swaps
  3. Two stub engines remained without LLM counterparts

  Phase 18 addresses all three through three serial tasks, governed by six
  engine-layer properties (高效, 全透明, 安全隔离, 冗余性, 可审计, 可更新)
  and three design principles derived from 可更新性 (Updatability).

  The three design principles are:
  - Principle 1: Factory Assembly Contract — engines accept factory callables,
    not instances. Swap stub→LLM via one lambda change.
  - Principle 2: Contract Locking via Guardrails — Protocol signature + Trace
    Key set enforced at AST level. Internal implementation is free.
  - Principle 3: metadata Extension Slot — metadata: Mapping[str, Any] field
    in all Context dataclasses. Not a trace key, not guardrail-enforced.

# ── Decision ────────────────────────────────────────────────────────────────

decision: |
  Three sequential tasks, each with distinct architectural decisions:

  Task 1 — Protocol Infrastructure:
  1. Formal Protocols for orchestration and critic engines (matching planning)
  2. Factory-based DI: Planning engines receive orch_factory, not instance
  3. metadata slot in all Context dataclasses
  4. Stubs add optional params for backward compat

  Task 2 — LLMOrchestrationEngine:
  1. Reuses GenerationAdapter for LLM calls (same pattern as LLMPlanningEngine)
  2. MockOrchBackend for deterministic CI (frozen dataclass + round-robin)
  3. 3-step LLM flow: ROUTE → asyncio.gather dispatch → MERGE + per-item RETRY
  4. All 6 orchestration.* keys + retrieval pass-through + agent.identity
  5. Default responses: 2 branches (fast_path cpu 3, full_rerank gpu 2)

  Task 3 — LLMCriticEngine:
  1. Reuses GenerationAdapter for LLM calls
  2. MockCriticBackend for deterministic CI
  3. 3-step serial flow: decomposition → dispatch → synthesis
  4. Default scores match stub values: (0.85 accept, 0.72 rework, 0.90 accept)
  5. 2 critic.* keys + agent.identity on every StreamItem

rationale: |
  Task 1 rationale:
  - Formal Protocols were missing for orchestration and critic — they existed
    only as stub classes with no contract surface. This made engine swapping
    impossible and guardrail enforcement incomplete.
  - Factory-based DI was chosen over optional constructor params because it
    makes the assembly point explicit. Switching from stub to LLM is one line
    of config, not scattered code changes.
  - metadata extension slot: without it, engine developers have no legitimate
    way to add debug information. They'd either add ad-hoc trace keys (violating
    the contract) or go without observability. metadata is the pressure-release
    valve — structured enough for sink storage, unstructured enough for flexibility.

  Task 2 rationale:
  - LLM-based routing/merge/retry decisions replace hardcoded stub logic.
    The route parser extracts branch definitions from LLM output; the retry
    parser determines whether to retry; the merge parser selects ordering.
    All three use the same GenerationAdapter pattern proven in Phase 17.
  - Default mock responses (2 branches, sequential merge, retry=true) provide
    enough structure for CI testing without over-specifying LLM behavior.

  Task 3 rationale:
  - LLM-based quality evaluation replaces hardcoded scores. Three serial
    evaluations (decomposition, dispatch, synthesis) mirror the planning
    engine's 5-step flow — each step is an independent LLM call with its
    own prompt template and parsing.
  - Default mock responses match stub values exactly (0.85, 0.72, 0.90).
    This is intentional: it proves the Protocol contract holds regardless
    of implementation. Stub values are the canonical reference.

# ── Alternatives ────────────────────────────────────────────────────────────

alternatives:
  - option: "Keep orchestration/critic as stub-only, defer LLM engines to Phase 19+"
    pros: "Less code, faster completion"
    cons: "Leaves the system in an asymmetric state (planning=LLM, orchestration=stub, critic=stub). The Sufficiency Report's core question — 'are 6 orchestration keys sufficient with real LLM values?' — remains unanswered. Phase 19 would carry both the implementation risk AND the sufficiency validation risk simultaneously."

  - option: "Shared MockBackend base class instead of per-engine MockBackend"
    pros: "DRY — one MockBackend for all engines"
    cons: "Creates cross-engine coupling. Each engine's mock responses are semantically different (route vs score vs plan). A shared base would need generic response typing, losing the type safety of engine-specific backends. Engine isolation anti-pattern (per CLAUDE.md)."

  - option: "Inherit StubOrchestrationEngine in LLMOrchestrationEngine instead of independent implementation"
    pros: "Code reuse for branch simulation, merge logic"
    cons: "Inheritance couples the LLM engine to stub internals. Changing stub behavior would silently affect LLM behavior. Protocol-based coexistence (both implement the same Protocol independently) is cleaner and matches the Phase 17 pattern."

  - option: "Skip the factory pattern, use optional orch_engine parameter"
    pros: "Simpler constructor signature, no lambda indirection"
    cons: "Assembly logic scattered across call sites. Switching from stub to LLM requires changes at every place that constructs a planning engine. Factory centralizes the assembly decision — Principle 1 (Updatability) requires this."

