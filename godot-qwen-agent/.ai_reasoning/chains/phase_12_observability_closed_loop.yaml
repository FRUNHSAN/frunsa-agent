# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 11 proved trace_context passes through the adapter pipe losslessly
  and built the first "at-rest" consumer (FileTraceExporter writing JSON Lines
  + declarative TRACE_KEY_REGISTRY). 350 tests, 0 failures, 11 guardrails.

  Critical limitation: DependencyCallTrace.trace_context captures only the
  LAST StreamItem's trace_context — not per-item. A RAG call with 50 chunks
  and a Planning call with 3 steps both produce exactly 1 trace record.
  This is insufficient for per-item latency analysis, streaming completeness
  verification, and component-level trace key empirical analysis.

  Phase 12 is 观测闭环 (observability closed loop), NOT 编排开启
  (orchestration kickoff). The goal: make Phase 11's data actually usable,
  before adding any new system complexity.

  Strategic constraint: zero external dependencies. SQLite is in Python
  stdlib (sqlite3). Pure B-tree indexes — NO FTS5 (compile-time optional,
  not needed for structured WHERE queries).

  Guiding principle: 观测先行 — every new capability layer must first be
  covered by the observability layer above it. Phase 11 proved engine-layer
  trace is transmittable → Phase 12 proves sink can consume it → Phase 13
  can build component platform on top.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Phase 12 delivers 4 components (~1,000 LOC, zero new dependencies):

  1. **Per-item Streaming Trace abstraction** — StreamingTraceRecord (frozen)
     captures trace_context from EVERY StreamItem. StreamingTraceWriter
     Protocol enforces max_items_per_call as structural cost boundary
     (-1=unlimited, 0=count-only, N>0=cap). Adapter blindly collects all
     records; sink enforces truncation — single responsibility.

  2. **SQLiteTraceSink** — at-rest archival implementing both TraceWriter
     (summary) and StreamingTraceWriter (per-item) protocols. Schema generated
     from declarative ColumnDef/IndexDef in sink_schema.py. Pure B-tree,
     no FTS5. Schema validated by sink_schema_consistency guardrail.

  3. **Component Candidate empirical analysis** — runs N=2 engine stubs,
     computes per-key statistics with hardcoded classification thresholds
     (95% occurrence, 100% type match, bounded cardinality). Produces
     human-readable report + structured JSON for Phase 13 interface design.

  4. **Orchestration trace pre-design** — 6 projected orchestration.* keys
     documented in a separate reasoning chain (phase_12_orchestration_trace_pre_design).
     NOT FOR IMPLEMENTATION. Exists so sink schema doesn't need disruptive
     migration when orchestration arrives (Phase 14+).

# ── 3. Rationale ─────────────────────────────────────────────────────

rationale: |
  ## Why Option B (parallel write path)?

  StreamingTraceWriter Protocol lives alongside TraceWriter — no existing
  types modified. FileTraceExporter continues to consume TraceLog for summary
  records. SQLiteTraceSink consumes StreamingTraceRecord for per-item records.
  350 existing tests continue to pass without modification.

  Alternative A (unified write path) would require changing TraceWriter's
  signature, breaking FileTraceExporter and all existing test cases.
  Alternative C (adapter-side truncation) would duplicate cost boundary logic
  across every future adapter implementation.

  ## Why SQLite pure B-tree (not FTS5)?

  FTS5 is compile-time optional in SQLite — not guaranteed to be available.
  Phase 12's query patterns (WHERE engine=? AND status=? GROUP BY key)
  are structured, not free-text. B-tree indexes are sufficient. FTS5 can
  be added later with CREATE VIRTUAL TABLE ... USING fts5(...) if needed.

  ## Why cost boundary in protocol, not adapter?

  max_items_per_call is a property on StreamingTraceWriter — a structural
  requirement, not an optimization. Without it, a RAG call with 50 chunks
  produces 50 records vs Planning's 3 = 16x storage asymmetry with no
  upper bound.

  Enforcing in the sink (not adapter) means a single implementation
  handles truncation for all future adapters. The adapter blindly collects
  all StreamingTraceRecords — no duplicate truncation logic.

  ## Why schema-first?

  sink_schema.py is written before any SQL. It's a TypedDict-based
  declarative definition of all tables, columns, and indexes. The
  sink_schema_consistency guardrail validates that runtime SQL matches
  the declaration. This is the most important deliverable — it's a
  schema design problem, not a retrieval performance problem.

  ## Why 95%/100%/bounded classification thresholds?

  95% occurrence: tolerates engine stub edge cases while requiring
  near-universal presence. 100% type match: TraceKeyDef.type is a contract
  — runtime deviation is unambiguous. Bounded cardinality: free-text values
  (user-generated content) are not component-level signals.

# ── 4. Alternatives ───────────────────────────────────────────────────

alternatives:
  - option: "A: Unified write path — extend TraceWriter to handle per-item"
    pros: "Single protocol, less code"
    cons: "Breaks FileTraceExporter contract, requires all existing tests to change, couples summary and per-item concerns"

  - option: "B: Parallel write path — StreamingTraceWriter alongside TraceWriter"
    pros: "No existing types modified, 350 tests unchanged, clean separation of concerns"
    cons: "Two protocols to implement, slight duplication in SQLiteTraceSink (implements both)"

  - option: "C: Adapter-side truncation"
    pros: "Sink stays simple"
    cons: "Duplicate truncation logic across N adapter implementations, violates single responsibility"

  - option: "D: FTS5 full-text search in SQLite"
    pros: "Full-text query support"
    cons: "Compile-time optional — not guaranteed, not needed for structured WHERE queries, adds complexity"

  - option: "E: Kafka / PostgreSQL / external DB for sink"
    pros: "Production-grade, concurrent writers"
    cons: "External dependency, violates zero-dependency constraint, overkill for Phase 12 archival needs"

