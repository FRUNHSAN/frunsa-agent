# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  ## Phase 13: Component platform trace keys

  The 3 component_candidate=True keys that meet confirmed_component
  thresholds should migrate to component-level trace contracts in
  core/contracts/trace_keys.py. The analysis script
  (scripts/analyze_component_candidates.py) provides stable, reproducible
  justification for each migration decision.

  ## max_items_per_call tuning

  Default cap of 100 items/dependency call is intentionally conservative.
  Tune per-environment based on observed item counts. RAG calls typically
  produce 5-50 chunks; Planning calls produce 3-10 steps. The guardrail
  validation ensures the cap is declared, not what value it should be.

  ## Sink schema migration

  To add new tables or columns:
  1. Update sink_schema.py declarations first
  2. Increment CURRENT_SCHEMA_VERSION
  3. Update SQLiteTraceSink._create_schema() migration logic
  4. Run sink_schema_consistency guardrail to validate
  5. The schema_version table records migration history

  ## Per-item trace as Phase 13+ input

  StreamingTraceRecord data in SQLite enables:
  - Per-item latency analysis (ts_iso deltas between consecutive items)
  - Streaming completeness verification (item_index gaps)
  - Component-level trace key empirical analysis (aggregate across N engines)
  - Engine identification from trace_context keys (for unregistered engines)

  ## Guardrail upgrade path

  sink_schema_consistency is WARNING in Phase 12. Upgrade to ERROR in
  Phase 14+ after schema has proven stable through 2+ phases of use.

anti_patterns:
  - "Adapter-side truncation: putting max_items_per_call logic in stream_adapter.py instead of the sink. One implementation in the sink vs N in every adapter."
  - "FTS5 for structured queries: using CREATE VIRTUAL TABLE ... USING fts5 for exact-match and GROUP BY queries. B-tree indexes are sufficient and guaranteed available."
  - "Last-item-only trace_context: using DependencyCallTrace.trace_context (last-item semantics) for per-item analysis. Use StreamingTraceRecord for per-item needs."
  - "Schema without guardrail: adding tables or columns to SQLiteTraceSink without updating sink_schema.py declarations. The sink_schema_consistency guardrail enforces schema-first."
  - "Cost boundary as afterthought: treating max_items_per_call as optional optimization rather than a structural protocol requirement. Without it, per-item trace is unbounded storage."
  - "Component candidate keys without empirical validation: promoting component_candidate keys to core/contracts/ without running the analysis script. Classification thresholds provide stable justification."
  - "Orchestration implementation before Phase 14: implementing orchestration keys or engine before the component platform exists. The pre-design chain explicitly marks these as NOT FOR IMPLEMENTATION."
  - "Mixed engine occurrence rate expectations: expecting a per-engine key like 'rag.chunk_id' to appear in 95% of ALL items across heterogeneous engines. Per-engine keys should be analyzed within their engine scope."
