# ── Context ────────────────────────────────────────────────────────────────

context: |
  Phase 14-16 closed the orchestration contract loop (6/6 FULLY SUFFICIENT).
  Phase 17 executes two independent tasks serially:

  Task 1 — Resolve agent.identity multi-engine registration technical debt.
  TraceKeyDef.engine: str → engines: list[str] with backward-compatible
  @property alias. agent.identity becomes engines=["planning", "critic"].
  All guardrail filters updated from v.engine == "X" → "X" in v.engines.
  critic_engine_contract now enforces agent.identity for critic engine.

  Task 2 — Introduce LLMPlanningEngine, the first real LLM-backed
  Planning Engine. Reuses GenerationAdapter rather than calling LLM SDK
  directly. Includes MockLLMBackend for deterministic CI testing.
  StubPlanningEngine untouched — both coexist as Protocol implementations.

  Task boundary is explicit: Task 1 runs first, full suite verified,
  then Task 2 proceeds. This isolates variables — if something breaks
  after Task 2, we know it's the LLM API, not the refactor.

# ── Decision ────────────────────────────────────────────────────────────────

decision: |
  Two architectural decisions, one for each task:

  1. TraceKeyDef field evolution:
     engine: str → engines: list[str] + @property engine → engines[0].
     This is the minimal-change approach. Zero breakage — all existing
     .engine access continues to work via the property alias. Future
     multi-engine keys just add to the list. No new dataclass, no
     registry split, no engine="*" sentinel.

  2. Real Planning Engine integration:
     LLMPlanningEngine reuses GenerationAdapter (existing) rather than
     calling OpenAI/Anthropic SDK directly. The adapter already provides
     DependencyCallTrace injection, timeout enforcement, credential
     isolation via ResourceContainer, and token tracking. Direct SDK
     calls would duplicate all of these — violating DRY and observability
     invariants (Phase 5, Phase 7).

rationale: |
  Task 1 rationale:
  - agent.identity is the only multi-engine key today, but more will come.
    Fixing the data model now (rather than waiting for 3+ agent.* keys)
    means the pattern is proven before it's load-bearing.
  - The @property alias pattern is a well-known API evolution technique.
    Zero breakage, zero migration, immediate benefits.
  - critic_engine_contract was intentionally incomplete (Phase 16 documented
    this as technical debt). With engines=["planning", "critic"], the
    guardrail can now properly enforce agent.identity for critic.

  Task 2 rationale:
  - GenerationAdapter encapsulates 4 architectural invariants
    (tracing, timeout, credentials, tokens). Reusing it is DRY.
  - MockLLMBackend follows the Phase 7 pattern: frozen dataclass with
    round-robin responses. Deterministic, CI-stable.
  - StubPlanningEngine remains untouched — fast reference implementation
    for tests that don't need LLM calls.
  - No new trace keys. The 18 existing keys are sufficient for the first
    real engine. Semantic gaps are documented in Sufficiency Report v3.

# ── Alternatives ────────────────────────────────────────────────────────────

alternatives:
  - option: "Separate MultiEngineKeyDef class for multi-engine keys"
    pros: "Clear type distinction between single and multi-engine keys"
    cons: "Over-engineering for 1 key. Creates two code paths for guardrail filters. Adding a third engine to agent.identity would still touch the same single line. Minimal-change approach is simpler."

  - option: "engine: Optional[str] or empty string sentinel for multi-engine"
    pros: "Avoids list type entirely, minimal field change"
    cons: "Breaks all guardrail filters that check v.engine == 'X'. Empty string means 'no engine'. Optional means every consumer must handle None. Loses engine provenance entirely."

  - option: "Direct OpenAI/Anthropic SDK calls in LLMPlanningEngine"
    pros: "Simpler import graph, no adapter dependency"
    cons: "Duplicates DependencyCallTrace injection (violating Phase 4 invariant). Duplicates timeout handling (Phase 5). Duplicates credential isolation (Phase 5). Duplicates token tracking. Every future real engine would duplicate the same logic."

  - option: "New LLMPlanningAdapter class parallel to GenerationAdapter"
    pros: "Planning-specific interface could be cleaner"
    cons: "Creates parallel adapter hierarchy. Every new engine type would need its own adapter. Violates DRY — GenerationAdapter already handles all LLM backends."

