# ── Future Guidance ─────────────────────────────────────────────────────────

future_guidance:

  api_evolution_backward_compat_property:
    summary: "When evolving core registry fields (str → list), use @property aliases to maintain zero-breakage backward compatibility during transition."
    detail: "TraceKeyDef.engine: str → engines: list[str] added a @property engine returning engines[0]. All existing .engine access continues to work. This pattern generalizes to any frozen dataclass field type evolution. The key insight: add the new field alongside a read-only property mapping the old field name to the new one. Zero test changes needed at call sites."
    priority: high

  real_engine_adapter_reuse:
    summary: "Real LLM engines MUST reuse GenerationAdapter rather than calling SDKs directly."
    detail: "GenerationAdapter already provides DependencyCallTrace injection, timeout enforcement, credential isolation via ResourceContainer, and cumulative_tokens tracking. Direct SDK calls would duplicate 4 architectural invariants and violate Phase 5 (External I/O) and Phase 7 (LLM Risks) patterns. The adapter is the canonical LLM interface for ALL engines."
    priority: critical

  deterministic_mock_backend:
    summary: "Non-deterministic LLM outputs break CI. Use frozen dataclass MockLLMBackend with round-robin responses for deterministic testing."
    detail: "MockLLMBackend implements GenerationBackend Protocol with pre-canned responses cycled via _call_count % len(responses). Frozen dataclass with _call_count mutation via object.__setattr__ (Phase 7 pattern). This guarantees CI stability while testing the full Protocol→Adapter→Engine→Sink chain."
    priority: high

  stub_as_canonical_reference:
    summary: "StubPlanningEngine remains the fast, deterministic reference implementation. LLMPlanningEngine is an independent peer, not a replacement."
    detail: "Both engines implement PlanningEngine Protocol and produce identical trace_context keys. Stub is for fast CI testing and contract validation. LLM engine is for production use. This pattern — stub as canonical reference, real engine as independent peer — should be followed for all future engines (orchestration, critic)."
    priority: medium

  no_new_trace_keys_for_real_engine:
    summary: "First real engine must operate within existing 18 trace keys."
    detail: "Before adding new trace keys for real-engine behavior (e.g. llm.model_name, llm.temperature), the existing 18 keys must be proven sufficient via production trace data. Semantic gaps are documented in Sufficiency Report v3, not immediately added. This prevents speculative key proliferation — keys must earn their place through observed need, not anticipated need."
    priority: high

  serial_execution_isolation:
    summary: "Complete all internal refactors before introducing external dependencies."
    detail: "When a phase has both internal refactoring and external dependency work, do the internal part first and verify the full suite. This isolates variables — if something breaks after introducing the external dependency, you know with certainty it's the integration, not the refactor. Parallel execution of independent internal+external tasks loses this diagnostic clarity."
    priority: medium

# ── Anti-Patterns ───────────────────────────────────────────────────────────

anti_patterns:
  - "Creating a separate FaultyOrchestrationEngine class instead of using config injection — duplicates code, creates parallel maintenance burden."
  - "Hardcoding API keys in engine constructors — credentials come from ResourceContainer via GenerationAdapter (Phase 5 pattern)."
  - "Using synchronous requests.post() in an async engine — all LLM calls go through GenerationAdapter.generate() which uses run_in_executor (Phase 7 pattern)."
  - "Modifying StubPlanningEngine when adding LLMPlanningEngine — stub is the fast deterministic reference, both coexist as independent Protocol implementations."
  - "Creating two dict entries for agent.identity (one per engine) — dict keys must be unique. Use engines: list[str] instead, with the @property backward-compat pattern."
  - "Adding new trace keys before validating semantic gaps via Sufficiency Report — first real engine operates within existing 18 keys. Keys must earn their place through observed need."

