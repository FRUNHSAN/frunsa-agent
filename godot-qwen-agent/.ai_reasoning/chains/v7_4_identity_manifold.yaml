related_chains: [phase_23_kernel_service, plan5_contract_lifecycle]

context: |
  V7.3 solved the SPATIAL dimension (filtration tower S₁⊃S₂⊃S₃⊃S₄,
  Track A/B/C routing, Phi functor, resistance sheaf R). But TIME and SELF
  were absent — every /new reset all accumulated state. The Agent had zero
  identity continuity.

  The mathematical insight: memory ≠ storage of raw data. Memory = deformation
  of prior distributions. Agent doesn't "recall" — Agent starts with different
  initial conditions shaped by past interactions.

  V7.4 introduces the Identity Manifold M_id ⊂ ℝ¹² — a 12-dimensional
  submanifold where each point represents the Agent's "behavioral posture"
  toward a specific user. Cross-session evolution = Ornstein-Uhlenbeck
  process on M_id with session push vectors and Betti-based topological
  phase change detection.

alternatives:
  - option: "Store raw chat history in SQLite and reload on /new"
    pros: "Simple, familiar pattern"
    cons: "Token-expensive, doesn't change Agent behavior — just adds context"
  - option: "Only persist trust_watermark as single scalar"
    pros: "Minimal storage"
    cons: "Violates Fisher-Neyman sufficiency (8-dim needed minimum)"
  - option: "Upgrade to fifth engine (IdentityEngine)"
    pros: "Uniform interface with existing engines"
    cons: "Category error: Identity doesn't produce StreamItem, doesn't call LLM, isn't async"

decision: |
  Single module `core/memory/identity_manifold.py` (~550 lines). Same family as
  WassersteinProxy, MetaAdaptTrigger, SemanticTrustEngine. Pure math, zero LLM
  calls, zero engine imports. REPL calls at session boundaries only.

rationale: |
  Mathematical depth ≠ architectural rank. WassersteinProxy runs KR duality
  without being called "CalibrationEngine". IdentityManifoldStore stores ~500
  bytes/user as JSON — sufficient statistic only, never raw text.

