anti_patterns:
  - "Storing raw chat logs as 'memory' instead of computing sufficient statistics"
  - "Using absolute thresholds (0.7, 0.3) in physical prior instead of user percentile"
  - "Calling IdentityManifoldStore from inside an engine (must only be called by REPL)"
  - "Setting physical_fail_rate=0.0 as initial value (use None for unobserved)"
  - "Upgrading to engine — category error, violates engine protocol contract"
  - "Using standard deviation for volatility (bimodal distributions need IQR)"

