# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  MANDATORY when adding a new LLM provider (OpenAI, Anthropic, local model):

  1. The new backend implements the GenerationBackend Protocol:
     generate(prompt, context, **params) -> GenerationResult
     count_tokens(text) -> int
     The Protocol is the contract — the adapter doesn't care what's behind it.

  2. Budget enforcement pattern (copy from GeneratorStep):
     - Adapter tracks cumulative_tokens (incremented after each generate() call)
     - Step checks self._adapter.cumulative_tokens >= self._max_tokens_per_run
       BEFORE calling the adapter
     - On budget exceeded: return GenerationResult with finish_reason="error"
       and model="budget_exceeded" — never raise

  3. Mock backend for testing:
     - Must be deterministic (same input → same output every time)
     - Must support latency_ms parameter for timeout testing
     - Must produce enough metadata (model, tokens, finish_reason) for
       trace completeness tests

  4. Re-ranking contract enforcement (copy from ScoringAdapter.score()):
     - After backend.score() returns results, the adapter MUST:
       a. Sort by score descending
       b. Re-assign sequential ranks (1, 2, 3...)
       c. Ensure len(results) <= len(input_chunks)
       d. Handle the case where backend returned more results than input
     - ALL of these use NEW RetrievalResult instances — never mutate

  5. Safe empty values per component type (add as new types are created):
     - Generator: GenerationResult(text="", model="error", finish_reason="error")
     - Reranker: [] (empty list)
     - Retriever: [] (empty list)
     - Chunker: [] (empty list)
     Rule: return a valid instance of the expected type, empty but structurally
     sound, so downstream code doesn't crash on type errors.

  6. Natural language normalization assumptions:
     - Non-list context → [] (empty list, not error)
     - Missing query → first chunk text as fallback
     - Empty string query → still call backend (may return empty results)
     These are deliberately lenient — the pipeline config is the primary
     source of correctness, not runtime coercion.

anti_patterns:
  - "Using object.__setattr__ to mutate frozen dataclass fields — the frozen guard exists for a reason; create new instances instead"
  - "Raising exceptions from adapter.generate() or adapter.score() — catch and return safe empty values; the trace log carries the error"
  - "Putting budget enforcement logic inside the adapter — adapter is translation layer, business logic belongs in the step"
  - "Returning None from a failed adapter call — every component type has a safe empty value; use it"
  - "Skipping the post-backend contract enforcement in ScoringAdapter (sort, re-rank, truncate) — the backend may violate the contract"
  - "Writing mock backends that are non-deterministic — tests must be reproducible; use fixed seeds or deterministic algorithms"
