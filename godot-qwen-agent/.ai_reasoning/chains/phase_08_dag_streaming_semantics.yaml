# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 8.2a established single-link streaming (Generator→User) with a
  Producer-Consumer + Sentinel bridge pattern. The engine now has exactly
  2 asyncio.run() entry points, a dedicated ThreadPoolExecutor, and
  try/finally resource cleanup.

  Phase 8.2b extends streaming to multi-branch DAG pipelines. The core
  challenge: when N upstream steps produce internal streams, a downstream
  step must merge them with well-defined semantics. Without explicit
  merge contracts, the engine would need to make implicit decisions
  about ordering, backpressure, and error handling — exactly the kind
  of ambiguity that leads to production incidents.

  TDD strategy: test_dag_stream_merge.py defines 4 contract scenarios
  before any engine code changes. All tests start with @pytest.mark.xfail.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Four interconnected decisions for Phase 8.2b:

  1. WAIT_ALL merge only (FIRST_N deferred to 8.2c):
     All N upstream producers must complete before the downstream consumer
     receives the merged terminal signal. N sentinels are counted; consumer
     exits only after the N-th sentinel. This is the simplest correct
     semantics and covers the common RAG pattern (Retriever→Reranker→Generator).

  2. N-Sentinel convergence model:
     Each upstream producer sends data StreamItems followed by exactly one
     terminal StreamItem (is_terminal=True). The shared asyncio.Queue
     accumulates items from all producers. The merge consumer counts
     terminal items and yields a single merged terminal when count == N.

  3. Error-carrying StreamItem replaces bare Sentinel:
     Instead of a bare sentinel object, an error is signaled via
     StreamItem(delta="", finish_reason="error", is_terminal=True, error="...").
     This keeps the protocol uniform — everything is a StreamItem.
     On receiving an error terminal, the merge consumer:
       a) Yields the error terminal immediately
       b) Cancels all remaining producer tasks via asyncio.Task.cancel()
       c) Exits the merge loop

  4. UserFacingStream vs InternalStream:
     StepOutput gains internal_stream: Optional[AsyncIterator] (Phase 8.2a
     already changed stream to AsyncIterator for UserFacing). Only
     component_type="generator" steps expose UserFacingStream; all other
     steps route through internal_stream. The engine guarantees that
     internal_stream data never reaches SSE/UserFacing serialization.

# ── 3. Rationale ─────────────────────────────────────────────────────

rationale: |
  Why WAIT_ALL first:
  - It's the safest merge semantic — no partial results, no ordering
    ambiguity, no deadlock risk from producers that haven't started.
  - FIRST_N adds complexity: "which N results?" requires scoring and
    partial ordering, which leaks into reranker territory. Better to
    implement FIRST_N as a dedicated MergeStrategy component in 8.2c.

  Why N-sentinel counting:
  - A single sentinel can't distinguish "all done" from "one done, others
    still running." Counting sentinels from known N producers gives
    deterministic termination.
  - The producer count N is known at DAG-build time from the step's
    depends_on list.

  Why error-carrying StreamItem over bare sentinel:
  - Keeps the protocol uniform (no isinstance checks for sentinel vs item).
  - Frozen StreamItem with is_terminal=True + error=str is self-describing.
  - No need for a separate error channel — the stream IS the error channel.

  Why separate internal_stream field:
  - UserFacingStream crosses asyncio.run() boundaries (SSE serialization).
  - InternalStream stays purely in async memory space.
  - Static analysis can verify that only generator steps touch UserFacing.

# ── 4. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Merge at the DAG scheduler level (engine.arun() handles merge)"
    pros: "No new API; transparent to step authors"
    cons: "Makes the engine aware of stream semantics — violates the
      business-agnostic principle from Phase 8.1. The engine should
      orchestrate steps, not interpret their data."

  - option: "Use a single merged queue with priority (asyncio.PriorityQueue)"
    pros: "Allows reranker to order results by score as they arrive"
    cons: "Premature optimization; requires scoring to happen in-stream;
      breaks the step boundary between retriever and reranker"

  - option: "Make all steps UserFacing (no internal_stream distinction)"
    pros: "Simpler API — one stream field"
    cons: "No static guarantee that chunker output won't leak to SSE;
      harder to reason about memory behavior for large intermediate results"

