# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Using a bare sentinel object instead of StreamItem(is_terminal=True). This forces isinstance() checks and breaks protocol uniformity."
  - "Merging streams inside a step's run() method. Merge logic belongs in the engine or a dedicated merge helper — steps consume a single merged stream, not N raw streams."
  - "Forgetting to cancel remaining producer tasks on error. This leaks coroutines and can cause 'Task was destroyed but it is pending' warnings."
  - "Hardcoding producer count N. The merge function must receive N as a parameter derived from the step's depends_on list."
  - "Having internal_stream data cross into UserFacing serialization. Guardrails must statically verify this boundary."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. When adding a new merge strategy (FIRST_N, INCREMENTAL):
     - Define it as a MergeStrategy Protocol in core/contracts/
     - Register via @register_component("merge", "first_n")
     - The engine selects strategy based on StepConfig.merge_strategy field

  2. When adding a new step that produces internal_stream:
     - run() should set StepOutput.internal_stream = <async_iterator>
     - Do NOT set StepOutput.stream — that's UserFacing only
     - Guardrails rule will flag any non-generator step that sets .stream

  3. When extending StreamItem:
     - All new fields must have backward-compatible defaults
     - Frozen dataclass integrity must be preserved
     - Every new field needs a corresponding validate_stream_output() check

  4. Streaming DAG tests must verify:
     - N-sentinel convergence (correct termination count)
     - Error propagation (cancellation of siblings)
     - Backpressure (Queue maxsize honored)
     - Internal/UserFacing isolation (generator-only UserFacing)
