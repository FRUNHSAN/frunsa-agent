# 推理链: V4.2 Phase 9 — 协商式契约演化
chain_id: v4.2_phase9_negotiation
title: "V4.2 Phase 9 协商式契约演化 — 小修静默/大修协商/提案保留"
created_at: "2026-06-07T00:00:00Z"
status: active
tags: [v4, phase9, negotiation, consent_gate, collaborative_autonomy]
related_chains: [v4.2_phase8_recovery, v4.2_phase7_self_repair]

context: |
  Phase 7/8 实现了降级↔恢复的自治闭环, 但所有权限变更都是静默执行的。
  Agent 自己降权、自己升权, 用户只能事后通过 X-Ray 看到。
  真正的协作者应该在重大权限变更前征求对方意见。

decision: |
  分层门控:
  - 小修 (lock_tools, trust_recalibration) → 自动静默执行
  - 大修 (lower_autonomy, raise_autonomy) → 提案征求用户同意
  - 提案保留: 用户说别的不等于拒绝, 保持挂起直到明确回复
  - 三态响应: 同意/拒绝/其他 (不丢提案)

  55 行, 1 文件 (core/repl.py)。不改 Container。

rationale: |
  "控制权本身成为可协商的变量"。
  小修是创可贴 (不应该打扰用户); 大修是手术 (必须获得授权)。
  提案保留是对人类节奏的尊重——用户可能在想, 可能想先处理别的事。
  没有过度设计多轮谈判, 但覆盖了所有真实场景。

anti_patterns:
  - "大修也静默执行 → 用户完全不知道权限被改了"
  - "用户说了其他话就丢弃提案 → 把人类当成状态机"
  - "提案和正常对话混在一起 → 用户困惑"

future_guidance:
  negotiated_evolution:
    summary: "分层门控: 小修自动/大修协商。提案保留机制。55 行/1 文件"
    priority: critical
  consent_detection:
    summary: "同意: 可以/好/行/同意/好的/ok。拒绝: 不用/不行/别/不了/不要/no。其他→保留"
    priority: high
