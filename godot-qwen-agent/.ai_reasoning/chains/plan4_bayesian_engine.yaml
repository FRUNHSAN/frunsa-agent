context: |
  PLAN3 proved seeds work. PLAN4 makes the engine Bayesian — tracking not just
  state but uncertainty. Behavioral signals catch what keyword detectors miss.
  Smart Decay prevents PTSD. Stage Directions translate variance into LLM
  micro-expressions (Show-Don't-Tell).

alternatives:
  - option: "Pure keyword detection (no behavioral signals)"
    pros: "Simple, no false positives from length fluctuations"
    cons: "Misses behavioral mutations; confirmation bias at low variance"
  - option: "Full neural tensor engine (PyTorch)"
    pros: "Maximum expressiveness"
    cons: "Over-engineered for 5 dimensions, 1 user; no training data"

decision: |
  Bayesian EMA with mean+variance per dimension. Surprise Detector injects
  behavioral anomaly signals (length_ratio, exclamation_density) to prevent
  confirmation bias. Smart Decay (gamma=0.85) breathes variance down when calm.
  Stage Directions: 4-band performance guidance from variance.

rationale: |
  T11 replay proved Surprise Detector works: variance rebounded 0.148->0.166
  instead of shrinking to 0.133. Trust variance was dead (stuck at 0.01) until
  surprise injection fix. Smart Decay shortened recovery 10->6 rounds. Chaos
  test: 15 rounds, 0 sustained deadlocks. LLM Judge: 8.3/10 empathy, 94%
  variance accuracy. A/B blind test: B (Stage Directions) outperforms A (bare).

