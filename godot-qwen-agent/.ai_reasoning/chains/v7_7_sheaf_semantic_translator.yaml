anti_patterns:
  - "Using a single __null__ anchor center as the 7th Voronoi cell — this forces every embedding into SOME cell. The null region must be the topological complement of all domains."
  - "Using cos_sim for domain boundary decisions — float resolution in [0.99, 1.0] is ~1e-7. Domain boundaries need angular (arccos) distance for stable comparison."
  - "Hardcoding MIN_RADIUS without noise calibration — in 384-dim space, random text can have angular similarity up to 0.85. Must compute noise ceiling dynamically."
  - "Normalizing joint scores without preserving raw activation — single-candidate normalization makes normalized≡1.0 always. Dual-channel output (raw + normalized) is mandatory."
  - "Classifying low-similarity inputs as 'ambiguous' — max_sim < noise_ceiling must force exterior-type ⊥. Ambiguity requires proximity to domain boundaries."
  - "Loading MiniLM twice — SemanticTrustEngine already holds the model. Command classification reuses it via self._sem.model."

