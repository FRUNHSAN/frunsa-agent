context: |
  The old _classify_command() performed a 7-cell Voronoi partition on R³⁸⁴: 6 command
  anchors + 1 __null__ anchor. Voronoi covers the entire space — every embedding e
  MUST fall into some cell. "你好呀" fell into PROACTIVE not because it was a command,
  but because Voronoi does not recognize empty sets.

  The old architecture had TWO separate MiniLM instances (~240MB each):
  - SemanticTrustEngine for emotion detection (fatigue, gratitude, frustration, curiosity)
  - _get_command_model() for command classification (6 blueprint field targets)
  These two observers never shared information — emotion and command were computed
  independently, losing the conditional structure P(c,em|e) ≠ P(c|e)×P(em|e).

  V7.7 replaces the Voronoi partition with a SHEAF of local sections on the embedding
  manifold E ≅ S³⁸³ (the MiniLM output hypersphere). Each command dimension defines an
  OPEN SET U_i ⊂ E (a geodesic ball). The ⊥ (null) region is E \ ∪U_i — the complement
  of all command domains, NOT an 8th Voronoi cell. When e ∈ ⊥, no section is defined
  and the system legitimately says "I didn't understand."

  V7.7 completes the three-pole autonomic nervous system of the Agent:
  - Adaptive Loops: execution strategy (state machine + feedback)
  - Adaptive Contract: interaction style (gradient flow + Lipschitz) [V7.6]
  - Adaptive Semantic Translation: intent recognition (sheaf sections + product fiber) [V7.7]

alternatives:
  - option: "Keep the __null__ Voronoi cell + improve anchor quality"
    pros: "Minimal code change to existing _classify_command()"
    cons: "Still a Voronoi partition — null is a cell, not an open set. No joint distribution. Two model instances."
  - option: "Use a separate ML classifier (logistic regression / small NN) on MiniLM embeddings"
    pros: "Can learn joint P(c,em|e) from labeled data"
    cons: "Requires labeled training data. New dependency. Training pipeline. Overkill for 6-class problem."
  - option: "Switch to a larger embedding model (BGE-M3, GTE-Qwen2)"
    pros: "Directly raises the information ceiling I(L;R³⁸⁴)"
    cons: "Inference cost ↑, latency ↑. DPI iron law: structure must be optimal first, then raise ceiling."

decision: |
  Extend SemanticTrustEngine (not a new class) with command detection capabilities.
  Single MiniLM instance serves both emotion and command classification.
  Key architectural decisions:

  1. ⊥ = E \ ∪U_i — null region is the topological complement, not a classification label.
     The __null__ anchor is DELETED. No null center — null is geometric consequence.

  2. Local sections σ_i defined on geodesic balls U_i = {e: angular_similarity(e, center_i) > r_i}.
     Radii r_i = μ_i - k·σ_i (mean minus k std-dev of anchor embeddings) — injectivity radius estimation.

  3. DYNAMIC_MIN_RADIUS from NOISE_ANCHORS — prevents "curse of dimensionality" where
     384-dim random vectors have angular similarity baselines up to 0.85, erasing ⊥.

  4. Product fiber F = F_emotion × F_command with joint distribution via cross-coefficients.
     Coeff(c,em) = P(c|em)/P(c) — Bayesian likelihood ratio, Radon-Nikodym derivative.
     Dual-channel output: raw_joint_score (threshold gating) + normalized_prob (margin confidence).

  5. ⊥ decomposed into gap-type (boundary — germ extension possible) vs exterior-type
     (exterior — section completely undefined). Absolute height gate prevents "ambiguity
     hallucination" on low-similarity inputs.

  6. Angular (geodesic) distance on S³⁸³ replaces cos_sim. arccos gives 33× better
     float resolution in the [0.99, 1.0] regime where domain boundaries live.

rationale: |
  The Voronoi→Sheaf transition is not an incremental improvement — it's a category change.
  Voronoi partitions are a topological error for intent classification because they force
  every point into exactly one cell. Sheaf theory admits that some regions of embedding
  space are genuinely undecidable, and that's a feature, not a bug.

  The product fiber structure recovers the conditional dependence that the old dual-track
  architecture lost. curiosity ⊗ HIGH ≠ frustration ⊗ HIGH — the joint distribution
  captures this, where independent marginals could not.

  The DYNAMIC_MIN_RADIUS from noise anchors is essential: 384-dimensional hypersphere
  geometry guarantees that random vectors concentrate near similarity ~0.80-0.85.
  Without the noise ceiling, ⊥ would vanish numerically even though it exists topologically.

  V7.6's protections (hysteresis, cooldown, Lipschitz) already guard against single-round
  misclassification. V7.7 adds the topological foundation: contract evolution now only
  occurs on the domain of definition of local sections. Every σ gradient step, every
  explicit command application, every contract_adapt trigger — requires a topological license.

