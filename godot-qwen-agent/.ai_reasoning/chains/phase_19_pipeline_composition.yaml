# ── 6. Future Guidance ───────────────────────────────────────────────

future_guidance:
  grammar_engine_location:
    summary: "Grammar engines live in core/adapters/ alongside component adapters"
    detail: "The adapters/ directory is a physical container, not a logical role.
      Any engine that must consume domain types (from contracts) AND produce
      pipeline steps MUST live here. This is the only layer with cross-platform
      import permissions."
    priority: critical
    phase_applicable: "Phase 19+"

  usb_discovery:
    summary: "Engines discover components via COMPONENT_REGISTRY.get(), never direct import"
    detail: "from .chunkers.x import XAdapter is a VIOLATION. Engine code must
      not change when new components are added. The four USB prohibitions are
      machine-enforceable via AST guardrails."
    priority: critical
    phase_applicable: "Phase 19+"

  validate_params_pattern:
    summary: "Components SHOULD provide validate_params(params) -> list[str] classmethod"
    detail: "Tier 1 validation captures semantic constraints (chunk_overlap < chunk_size)
      that inspect.signature cannot express. This classmethod maps directly to
      a Rust trait method. Fallback: COMPONENT_REGISTRY.validate_params() reads
      cached signatures from @register time."
    priority: high
    phase_applicable: "Phase 19+"

  anti_winreg_firewalls:
    summary: "Four firewalls prevent Registry from becoming Windows Registry"
    detail: "1. freeze() after bootstrap; 2. explicit discover(), no magic import;
      3. typed keys (Protocol, not Any); 4. test isolation fixture. All four
      must be in place from Day 1. Missing any one = Registry degradation risk."
    priority: high
    phase_applicable: "Phase 19+"

  contract_paradigm_boundary:
    summary: "Phase 19 implements grammar INFRASTRUCTURE, not relationship BEHAVIOR"
    detail: "SourceRouter does NOT ask users which chunker to use. PipelineAssembler
      does NOT renegotiate params. CompositionEvent does NOT compute trust scores.
      These are Phase 25+ capabilities. Phase 19's job: make the substrate so
      clean that relationship logic can grow without kernel redesign. The boundary
      is explicitly documented in the plan to prevent cognitive dissonance."
    priority: high
    phase_applicable: "Phase 19"

  rust_migration_path:
    summary: "Python is the contract prototype, not the final product"
    detail: "Five iron laws ensure today's Python code is tomorrow's Rust asset:
      1. Contract/implementation physical separation; 2. Tests as specs;
      3. Blueprint Schema is the invariant; 4. Adapter FFI exits pre-built;
      5. Docstrings as human-readable contracts. The Python→Rust mapping table
      in the plan identifies every risk point and its Phase 19 mitigation."
    priority: medium
    phase_applicable: "Phase 19-50"

  kernel_value_audit:
    summary: "Every Phase must pass the kernel value audit checklist"
    detail: "Six questions including: 'Without this kernel, would using existing
      frameworks take more or less time?' and 'Does the interface signature assume
      all information is complete at call time?' Audit failures = stop and reassess.
      YAGNI is STRICTER in the kernel than in application code."
    priority: medium
    phase_applicable: "Phase 19+"

  contract_violation_detection:
    summary: "PipelineAssembler MUST classify failures into contract violation categories"
    detail: "Phase 19.5 introduced _classify_violation() that maps technical error_types
      to contract violation categories: unknown_chunker_strategy, invalid_chunk_params,
      routing_contract_breach, output_contract_violation. Execution failures return None
      (technical, not contractual). AssemblyDiagnostic.contract_violation and
      CompositionEvent.context['contract_violation'] are both populated.
      This is the first 'nerve' — downstream consumers can now distinguish
      'something broke' from 'a contract was breached'."
    priority: critical
    phase_applicable: "Phase 19.5+"

  structured_event_sink:
    summary: "ContractAwareEventSink provides queryable, thread-safe event storage"
    detail: "ContractAwareEventSink implements Callable[[CompositionEvent], None]
      (drop-in for any event_sink parameter) plus query methods: by_correlation(),
      by_type(), violations, violations_by_type(), summary. Uses threading.Lock
      for future async safety. WARNING: implement __len__ on a Callable sink
      breaks the 'event_sink or lambda' truthiness pattern — use explicit
      'if event_sink is not None' instead."
    priority: high
    phase_applicable: "Phase 19.5+"

  contract_violation_field_populated:
    summary: "AssemblyDiagnostic.contract_violation is now populated at runtime"
    detail: "Previously the field existed but was always None (per Phase 19 boundary).
      Phase 19.5 begins populating it for instantiation, routing, and validation
      failures. Execution failures remain None (may be transient bugs, not contract
      breaches). This distinction is the foundation for Phase 25+ graceful degradation
      (repair vs renegotiate vs abandon)."
    priority: high
    phase_applicable: "Phase 19.5-25"

  bugs_discovered_and_fixed:
    summary: "Two bugs found during Phase 19.5 implementation, both instructive"
    detail: "1. threading.Lock deadlock: summary property held _lock then called
      violations_by_type() which re-acquired same non-reentrant lock. Fix: compute
      inline within single lock acquisition. Lesson: public methods on locked
      objects must never call sibling public methods that also acquire the lock.
      2. Python __len__ truthiness trap: event_sink or lambda evaluated sink's
      __len__ (0), treated it as falsy, silently replaced with no-op. Tests never
      caught this because list.append (a bound method) is always truthy. Fix:
      use explicit 'if X is not None' instead of 'X or default' for callable
      parameters that may implement __len__."
    priority: medium
    phase_applicable: "Phase 19.5 (lessons permanent)"

  contract_health_evaluation:
    summary: "ContractHealthEvaluator is a pure function that converts sink events → health report"
    detail: "ContractHealthEvaluator.evaluate(sink, previous=None) produces a
      ContractHealthReport with compliance_rate, severity (healthy/degraded/critical),
      dominant_violation_type, and trend (improving/stable/deteriorating). Severity
      is computed via injectable SeverityMapping rules (YAML-able in future).
      Trend is stateless — caller provides previous report, evaluator compares.
      This is Phase 25+'s trigger: severity=critical + trend=deteriorating →
      initiate renegotiate."
    priority: high
    phase_applicable: "Phase 20+"

  contract_violation_strenum:
    summary: "ContractViolation is a StrEnum — drop-in compatible, IDE-safe, typo-proof"
    detail: "The 4 contract violation strings are now ContractViolation StrEnum members.
      str subclass → backward compatible with all existing string comparisons.
      Enum → mypy exhaustiveness, IDE autocomplete, no silent typo failures.
      _classify_violation() returns ContractViolation | None instead of str | None."
    priority: high
    phase_applicable: "Phase 20+"

  contract_lifecycle:
    summary: "ContractLifecycle StrEnum gives Blueprints a time dimension — DRAFT/ACTIVE/DEPRECATED"
    detail: "Phase 21 introduces ContractLifecycle (draft/active/deprecated) and
      integrates it into CompositionBlueprint, SourceRouter, PipelineAssembler,
      and ContractHealthEvaluator. Key behaviors: (1) default is ACTIVE for
      backward compatibility — old YAML without 'lifecycle' key works unchanged;
      (2) SourceRouter.resolve() rejects DEPRECATED blueprints with AssemblyError
      for new routing requests — already-running pipelines are unaffected;
      (3) ContractHealthEvaluator applies lifecycle weights when computing severity:
      ACTIVE=1.0x, DRAFT=0.5x, DEPRECATED=0.3x — violations from deprecated
      contracts are heavily down-weighted, meaning '10 deprecated routing misses'
      may be less severe than '1 active unknown_strategy'; (4) ContractHealthReport
      includes lifecycle_distribution for visibility into where violations originate."
    priority: high
    phase_applicable: "Phase 21+"

  lifecycle_weighting_in_evaluator:
    summary: "HealthEvaluator uses lifecycle-weighted counts, not raw violation counts"
    detail: "The evaluator's _compute_weighted_violations() iterates violation events,
      reads blueprint_lifecycle from event context, and multiplies each violation
      by the lifecycle weight before checking SeverityMapping thresholds. This
      means a SeverityRule with count_threshold=1 is only triggered by 1 ACTIVE
      violation, but requires 2 DRAFT or 4 DEPRECATED violations of the same type.
      The lifecycle weights are class-level constants (injectable in future Phase).
      Events without blueprint_lifecycle in context default to 'active' (full weight)."
    priority: high
    phase_applicable: "Phase 21+"

  deprecated_rejection_scope:
    summary: "DEPRECATED rejection only blocks new routing, never interrupts running pipelines"
    detail: "SourceRouter.resolve() checks self._blueprint.lifecycle at the start
      of each resolve() call. If DEPRECATED, it raises AssemblyError. This means:
      (1) PipelineComposer instances created BEFORE the Blueprint was deprecated
      continue to function — their router was initialized with the active blueprint;
      (2) Only NEW PipelineComposer.from_yaml() calls against a deprecated config
      will fail at resolve() time; (3) The gate is at routing time, not construction
      time — a composer CAN be created with a deprecated blueprint, but any
      resolve() call will raise. This is 'graceful rejection.'"
    priority: medium
    phase_applicable: "Phase 21+"

  tool_contract_adapter:
    summary: "ToolAdapter translates LLM function_call → ToolCall → ToolResult with blueprint validation"
    detail: "Phase 22a introduces ToolProtocol, ToolCall, and ToolResult as first-class
      contract types. ToolAdapter (adapters/tool_adapter.py) is a component adapter
      in the same paradigm as ChunkerAdapter: 1:1 translation, stateless, with
      an additional _validate_against_blueprint() step that checks tool existence
      in COMPONENT_REGISTRY and parameter compatibility against the tool's declared
      schema. Two new ContractViolation types: TOOL_NOT_FOUND (critical, threshold=1)
      and TOOL_PARAM_MISMATCH (degraded, threshold=1). Tool discovery follows the
      USB model: COMPONENT_REGISTRY.get('tool', name), never direct import."
    priority: high
    phase_applicable: "Phase 22a+"

  self_repair_engine:
    summary: "SelfRepairEngine consumes ContractHealthReport → produces RepairAction decisions"
    detail: "Phase 22b closes the cognition→action loop. SelfRepairEngine
      (adapters/repair_engine.py) is a grammar engine co-located with HealthEvaluator.
      It maps each ContractViolation type to a RepairStrategy (RETRY_WITH_DEFAULT,
      REPLACE_COMPONENT, ESCALATE_TO_HUMAN, GIVE_UP). RepairBudget limits attempts
      per violation type to prevent infinite loops. When budget is exhausted,
      repair_budget_exhausted event flows into EventSink — 'admitting inability'
      is a first-class contract signal. repair_attempted events record each
      repair for audit trail."
    priority: high
    phase_applicable: "Phase 22b+"

  relationship_memory:
    summary: "RelationshipMemoryStore persists health transitions as deltas, not snapshots"
    detail: "Phase 22c stores transitions (compliance_delta, severity_before→after)
      in SQLite, indexed by (blueprint_fingerprint, timestamp, lifecycle). This
      captures the 'evolution trajectory' of a relationship. Contrast with
      ContractAwareEventSink (working memory — current session) vs MemoryStore
      (long-term memory — cross-session history). Queries: get_history(fingerprint,
      days=7), get_latest(), get_deterioration_count(). Uses persistent single
      connection to survive :memory: lifetime. Thread-safe via threading.Lock."
    priority: high
    phase_applicable: "Phase 22c+"

  muscle_attachment_point:
    summary: "All Phase 22 muscles attach to adapters/ — the only full-permission hub"
    detail: "ToolAdapter, SelfRepairEngine, and RelationshipMemoryStore all live in
      core/adapters/. This is not by convention but by physical necessity: only
      adapters/ can import from contracts (ToolProtocol, ContractViolation,
      ContractHealthReport) AND pipeline (HealthStatus, PipelineStep) AND other
      adapters (event_sink, health_evaluator, composer). Placing these capabilities
      anywhere else would either violate import boundaries or require awkward
      abstraction layers. The pipeline boundary violation (PaceShapingWrapper) was
      fixed before Phase 22 started, moving pace_stream from pipeline/ to adapters/."
    priority: critical
    phase_applicable: "Phase 22+"

  repair_budget_as_contract_signal:
    summary: "Budget exhaustion is NOT a failure — it's 'I cannot fix this' entering the contract system"
    detail: "When RepairBudget is exhausted, SelfRepairEngine emits a
      repair_budget_exhausted CompositionEvent. This flows into EventSink and is
      visible to HealthEvaluator. The system doesn't crash, infinite-loop, or
      silently give up — it formally declares its inability and continues degraded.
      This is the engineering realization of 'admitting inability builds trust
      more than infinite retrying.' Future Phase 25+ will escalate to human
      when this event appears with trend=deteriorating."
    priority: medium
    phase_applicable: "Phase 22b+"

  battle_script_as_integration_test:
    summary: "demo_battle.py is BOTH a demo AND an integration test — deterministic closed-loop verification"
    detail: "The battle script uses simulated tools with class-level fail counters
      to deterministically verify the full contract-adaptive loop without LLM
      randomness. Key insight: LLM hallucinations (calling nonexistent tools)
      trigger TOOL_NOT_FOUND → SelfRepairEngine REPLACE_COMPONENT → compliance
      recovery — this is a MORE realistic test than rate-limit simulation because
      LLM hallucination is a genuine, frequent failure mode. The script doubles
      as an integration test: every step has assertions, and exit code 1 means
      the self-repair loop is broken. This ensures the muscle layer never
      atrophies during future kernel changes."
    priority: high
    phase_applicable: "Phase 22+"

  tool_instance_recreation:
    summary: "ToolAdapter creates new tool instances per call — use class-level state for shared counters"
    detail: "ToolAdapter.execute() calls tool_cls() to create a fresh tool instance
      for each invocation. This is correct for stateless tools but means
      per-instance state (like fail counters) resets on every call. For
      simulated/failure-injection tools, use class-level ClassVar counters
      that survive instance recreation. This is the same pattern used for
      VERSION declarations across all registered components."
    priority: medium
    phase_applicable: "Phase 22+"

  kernel_service_plug:
    summary: "KernelService Protocol is the single injection point for Application Layer -> Kernel"
    detail: "Phase 23a defines KernelService as the standard plug between upper layers
      and the contract-adaptive kernel. Application Layer never imports from
      core/adapters/ directly."
    priority: critical
    phase_applicable: "Phase 23+"

  contract_aware_decorator:
    summary: "ContractAware* wrappers use decorator pattern, zero changes to wrapped engines"
    detail: "Phase 23b/23c/23d wrap Planning, Orchestration, and Critic engines
      with identical contract-aware decorators."
    priority: high
    phase_applicable: "Phase 23+"

  three_engines_one_plug:
    summary: "All three engines share identical KernelService injection pattern"
    detail: "The ContractAware engines differ only in which engine they wrap
      and the correlation_id prefix. Everything else is identical."
    priority: medium
    phase_applicable: "Phase 23+"

  hitl_gateway:
    summary: "HITLGateway bridges contract-adaptive kernel with human decision-makers"
    detail: "Phase 24 implements Human-in-the-Loop via a parasitic EventSink consumer.
      HITLGateway scans for repair_budget_exhausted events, creates HumanTickets
      with frozen health reports, persists them via RelationshipMemoryStore, and
      emits human_intervention_required for external consumers. submit_decision()
      resolves tickets and emits ticket_resolved. Zero new dependencies, zero
      polling — the gateway reads events the sink has already captured. This
      turns ESCALATE_TO_HUMAN from a dead enum value into a working bidirectional
      channel."
    priority: high
    phase_applicable: "Phase 24+"

  human_ticket_pattern:
    summary: "HumanTicket is a frozen snapshot of contract failure, not a mutable workflow state"
    detail: "HumanTicket uses the same frozen dataclass pattern as all other contracts:
      @dataclass(frozen=True) with ticket_id, blueprint_fingerprint, report_json,
      created_at, and status (PENDING/RESOLVED/IGNORED). The ticket is a RECORD
      of a human decision point, not a living state machine. Resolution creates
      a ticket_resolved event; the caller (future Phase 25 ContractRenegotiator)
      decides what to do with the resolution."
    priority: medium
    phase_applicable: "Phase 24+"

  contract_renegotiator:
    summary: "ContractRenegotiator turns chronic violations into renegotiation proposals"
    detail: "Phase 25 adds Memory Inspector (get_chronic_violators) and
      RenegotiationProposal as a non-blocking counterpart to HumanTicket.
      Critical design: proposals use a SEPARATE proposals table and emit
      renegotiation_proposed (not human_intervention_required). This prevents
      semantic contamination — HumanTicket = blocking emergency ('I am stuck'),
      RenegotiationProposal = non-blocking suggestion ('consider changing X').
      The HITLGateway now has two clean paths: request_intervention (blocking)
      and submit_proposal (non-blocking). Both share the same EventSink
      infrastructure but are semantically isolated."
    priority: high
    phase_applicable: "Phase 25+"

  semantic_separation:
    summary: "Blocking emergencies and non-blocking proposals must use separate data paths"
    detail: "The temptation to 'whitewash' proposals as HumanTickets (reusing
      the same table with a type field) must be resisted. Boolean blindness
      results: human reviewers can't distinguish urgent interventions from
      optimization suggestions. The fix: separate SQLite tables (human_tickets
      vs proposals), separate event types (human_intervention_required vs
      renegotiation_proposed), separate gateway methods (submit_decision vs
      resolve_proposal). Same infrastructure, clean semantics."
    priority: critical
    phase_applicable: "Phase 25+"

  anti_corruption_layer:
    summary: "Three Protocols decouple kernel from infrastructure: EventSink, InteractionRepository, ToolFormatAdapter"
    detail: "Phase 25 P0 refactoring extracted three anti-corruption layers: (1) EventSink
      Protocol isolates event emission from concrete implementations — swap in-memory
      to Redis/Kafka by writing one adapter; (2) InteractionRepository Protocol isolates
      persistence from SQLite — swap to Postgres by writing one adapter; (3) ToolFormatAdapter
      Protocol with bidirectional conversion + ToolFormatRegistry eliminates the if/elif
      provider switch — new LLM = new adapter + register, zero ToolAdapter changes.
      Together these form a hexagonal architecture: the kernel depends on Protocols,
      never on concrete infrastructure classes."
    priority: critical
    phase_applicable: "Phase 25+"

  mcp_adapter:
    summary: "MCP Adapter bridges external tool ecosystem into USB Registry via dynamic subclasses"
    detail: "Phase 22d implements MCPToolDiscovery (async stdio), MCPToolWrapper
      (ToolProtocol-compatible, dynamic subclasses prevent config collision between
      tools from the same server), and register_mcp_server() for one-shot discovery.
      MCP tools are indistinguishable from built-in tools to ToolAdapter and
      SelfRepairEngine — REPLACE_COMPONENT can now find real alternatives.
      Each MCP tool gets its own dynamic subclass of MCPToolWrapper to avoid
      class-level config overwrites."
    priority: high
    phase_applicable: "Phase 22d+"

  intentional_violation:
    summary: "INTENTIONAL_VIOLATION is PLAN2's first commit — Agent chooses to violate for higher value"
    detail: "PLAN2 redefines contract-adaptive from 'immune system' to 'relational OS'.
      The INTENTIONAL_VIOLATION ContractViolation category marks the transition:
      PLAN1 treated all violations as bugs to fix; PLAN2 distinguishes passive
      violations (repair) from active violations (trust). Key behaviors: (1) excluded
      from SeverityMapping — does NOT reduce compliance; (2) SelfRepairEngine.decide()
      skips INTENTIONAL_VIOLATION entirely; (3) record_trust_accumulation() emits
      trust_accumulated event with impact_score; (4) ToolResult.is_intentional_override
      and higher_value_reason carry the moral intuition. This is the engineering
      realization of Axiom 2: 'Contract > Instruction, Co-creation > Obedience.'"
    priority: critical
    phase_applicable: "Phase 26+ (PLAN2)"

  embodied_reflex:
    summary: "EmbodiedReflex is the translation membrane between machine reality and human perception"
    detail: "Phase 28 implements PLAN2 Axiom 1 (Tech Recesses, Relation Emerges) via
      Scheme B: intercept ToolResult at the presentation layer, not the call layer.
      LLM function calling runs normally (stable, auditable); user sees natural-language
      intuition instead of tool invocations. _summarize() uses heuristics per tool
      type (web_search, weather, calendar); Phase 32+ replaces with small-model
      semantic summarizer. Intentional violation integration: when Agent chooses
      INTENTIONAL_VIOLATION, intuition reflects it ('Sensing your fatigue...').
      Failure intuition: errors become 'intuition gaps', never raw error messages."
    priority: high
    phase_applicable: "Phase 28+ (PLAN2)"

  renegotiation_watcher:
    summary: "RenegotiationWatcher crystallizes accumulated trust into contract evolution proposals"
    detail: "Phase 29 completes PLAN2 Axiom 2: background scanner watches for
      INTENTIONAL_VIOLATION events, groups by tool/contract, identifies dominant
      reasons. When count >= threshold (3) AND trust_watermark >= 0.7, crystallizes
      into RenegotiationProposal via HITLGateway.submit_proposal() (Phase 25 channel).
      Trust-gated: won't propose if trust is low (Agent stays silent). This closes
      the loop: Phase 26 (decide) -> Phase 27 (sense) -> Phase 28 (embody) ->
      Phase 29 (evolve). The Agent doesn't just follow contracts — it co-evolves them."
    priority: critical
    phase_applicable: "Phase 29+ (PLAN2 complete)"

  relational_state_aggregator:
    summary: "RelationalStateAggregator unifies three data sources into one RelationalContext"
    detail: "PLAN3 introduces RelationalStateAggregator that reads RelationalField,
      ContractHealthReport, and InteractionRepository to produce a single
      RelationalContext (energy, urgency, trust, rhythm, resonance, suggested_tone).
      This is the input to PromptGenerator.grow() — the seed that grows into
      dynamic System Instructions. Also integrates RelationalHistory for
      EMA smoothing and inertia."
    priority: high
    phase_applicable: "PLAN3+"

  prompt_generator:
    summary: "PromptGenerator grows ~50-word relational seeds from RelationalContext"
    detail: "PLAN3's PromptGenerator.grow(ctx) transforms RelationalContext into
      a natural-language 'seed' (~50 words). The seed describes relational state
      implicitly — LLM feels the temperature without being commanded. Vibe Test
      (LLM-as-Judge) confirmed seeds are effective: fatigued seed produced 24-char
      response, energetic seed produced 841-char response (35x difference).
      Judge confirmed distinct styles. This proves the 50-word seed genuinely
      changes LLM behavior in the intended direction."
    priority: critical
    phase_applicable: "PLAN3+"

  relational_inertia:
    summary: "RelationalInertia prevents context oscillation with EMA, confirm windows, and tone damping"
    detail: "PLAN3/4 introduces RelationalHistory with sliding window deque and
      InertiaConfig. EMA trust smoothing (alpha=0.3, calibrated from blind test).
      Energy requires 2 consecutive readings before transition (prevents false
      fatigue snap). Urgency instant-on but gradual decay (3 rounds). Tone
      damping prevents brief<->detailed flipping. Integrated into Aggregator
      via aggregate(history=...). This is the PLAN4 precursor — EMA is the
      simplest form of momentum that a tensor engine would generalize."
    priority: high
    phase_applicable: "PLAN3/4+"

  vibe_test:
    summary: "Vibe Test uses LLM-as-Judge to validate relational seeds actually work"
    detail: "Before building inertia on top of PromptGenerator, the Vibe Test
      validated that seeds genuinely change LLM behavior. Two extreme contexts
      (fatigued vs energetic), same neutral query, judge LLM evaluates output.
      Result: 4/4 passed — fatigued=24chars, energetic=841chars, distinct styles
      confirmed. This is NOT a unit test; it uses real LLM API calls and serves
      as the gate before any time-dimension work (inertia, momentum)."
    priority: critical
    phase_applicable: "PLAN3+ (gate before inertia)"

  plan4_tensor:
    summary: "PLAN4 treats Human-Agent Interaction as Online Representation Learning"
    detail: "PLAN4.md defines the Relational Tensor vision: a [Window_Size, 5]
      matrix with Latent Dimensions (Cognitive Load, Emotional Valence, Epistemic
      Trust, Relational Intimacy, Goal Alignment). Forward Pass: TemporalAttention
      -> Collapse -> Decode -> Seed. Backward Pass: Implicit Proxy Loss from user
      behavior (no labels needed). Momentum & Friction: trust inertia, emotional
      momentum, urgency snap. Current state: EMA + sliding window (PLAN3)
      implemented; full tensor engine deferred to PLAN4+."
    priority: medium
    phase_applicable: "PLAN4+ (vision)"

anti_patterns:
  - "Putting resolve() or any matching algorithm on CompositionBlueprint (data model)"
  - "SourceRouter producing I/O, network calls, or state mutation (must be pure)"
  - "PipelineAssembler importing logging or print() directly (use event_sink)"
  - "Caller bypassing PipelineComposer to use Router/Assembler directly (except tests)"
  - "AssemblyDiagnostic as Dict[str, Any] instead of frozen dataclass"
  - "Chunk metadata missing rule_id or blueprint_version (broken lineage)"
  - "audit_manifest missing blueprint_fingerprint (unreproducible incidents)"
  - "Composer constructor accepting file path instead of CompositionBlueprint"
  - "from .chunkers.x import XAdapter in any grammar engine"
  - "if rule.chunker == 'semantic': branch in any grammar engine"
  - "Blueprint YAML chunker name coupled to file path or class name"
  - "Component adapter importing from composer.py or any grammar engine"
  - "Registry.register() after freeze() — must raise RuntimeError"
  - "health_check() using live inspect.signature instead of cached data"
  - "CompositionEvent missing correlation_id"
  - "AssemblyDiagnostic missing contract_violation field"
  - "Using 'event_sink or lambda' with a sink that implements __len__ (truthiness trap)"
  - "Calling public locked methods from within another locked method (non-reentrant deadlock)"
  - "Treating execution failures as contract violations (they may be transient bugs)"
  - "Populating contract_violation with free-text instead of enum categories"
  - "Sink.query() returning live references to internal list instead of copies"
  - "Evaluator storing previous report internally instead of accepting it as parameter"
  - "Hardcoding severity thresholds instead of injecting SeverityMapping"
  - "Using bare strings for contract_violation instead of ContractViolation enum"
  - "Evaluator modifying sink state during evaluation (must be read-only)"
  - "Computing trend from same report object (need previous snapshot for comparison)"
  - "Using str() on a StrEnum member — produces 'ClassName.MEMBER' not the value. Use the member directly or .value"
  - "CompositionBlueprint.lifecycle defaulting to None or any non-ACTIVE value — breaks backward compatibility with all existing YAML"
  - "SourceRouter allowing routing through DEPRECATED blueprints — violates the lifecycle contract"
  - "Deprecated rejection at construction time instead of resolve() time — would kill already-running pipelines"
  - "HealthEvaluator ignoring blueprint_lifecycle in event context — makes lifecycle weighting a dead letter"
  - "Hardcoding lifecycle weights inside _compute_severity instead of as injectable class-level constants"
  - "Adding lifecycle field to CompositionBlueprint without updating fingerprint — makes different-lifecycle blueprints collide"
  - "Allowing invalid lifecycle strings to pass silently instead of raising ValueError"
  - "ToolAdapter importing a concrete tool class directly instead of using COMPONENT_REGISTRY.get('tool', name)"
  - "Tool execution failures being classified as contract violations (they are technical, like chunker execution failures)"
  - "ToolResult missing contract_violation field — tools are first-class contract participants"
  - "SelfRepairEngine retrying infinitely without a RepairBudget — leads to deadlock or resource exhaustion"
  - "RepairBudget being mutable (shared state) instead of returning a new frozen instance on consume()"
  - "SelfRepairEngine storing budget as mutable instance variable instead of replacing on each consume()"
  - "repair_budget_exhausted event NOT flowing into EventSink — makes 'admitting inability' invisible to HealthEvaluator"
  - "RelationshipMemoryStore using per-operation connect/close with :memory: — tables are per-connection, data is lost"
  - "Storing full health snapshots instead of transitions (deltas) — misses the 'evolution trajectory' semantic"
  - "MemoryStore queries bypassing the threading.Lock — same deadlock risk as early event_sink"
  - "Placing tool/repair/memory logic in contracts/ or pipeline/ instead of adapters/ — violates import boundary physics"
  - "Using instance-level counters for simulated tools — ToolAdapter creates new instances, counters reset. Use ClassVar"
  - "Battle script relying on LLM randomness for verification — use deterministic mock tools + explicit assertions"
  - "_find_replacement returning the same tool that just failed — must extract failing tool name from sink violations"
  - "Expecting post-repair severity to return to 'healthy' immediately — historical violations persist in sink; trend+compliance are the real signals"
  - "Simulated tools without VERSION: ClassVar[SemVer] — COMPONENT_REGISTRY.register() requires it for all component types"
  - "Application Layer importing from core/adapters/ directly instead of depending on KernelService Protocol"
  - "ContractAware wrapper modifying the wrapped engine's internal logic instead of decorating its public interface"
  - "Each ContractAware engine implementing its own health/report logic instead of sharing KernelService"
  - "Skipping event_sink emission in the success path — success is also a contract signal"
  - "HITLGateway polling or using an external message queue for MVP — sink already has the events, just scan it"
  - "HumanTicket as a mutable state machine instead of a frozen snapshot — tickets are records, not living objects"
  - "Forgetting to emit ticket_resolved after human decision — breaks the audit trail"
  - "Whitewashing proposals as HumanTickets with a 'type' field — semantic contamination. Use separate table + event type"
  - "Blocking execution while waiting for proposal approval — proposals are non-blocking suggestions, not emergency interventions"
  - "Skipping chronic violator scan before generating proposal — proposals must be data-driven, not arbitrary"
  - "Business logic importing concrete infrastructure classes (ContractAwareEventSink, sqlite3) instead of depending on Protocols"
  - "Adding a new LLM provider by modifying tool_adapter.py if/elif chain — register a ToolFormatAdapter instead"
  - "Putting read/query methods on EventSink Protocol — EventSink should be write-only (emit); reads belong to InteractionRepository"
  - "Sharing a single MCPToolWrapper class for multiple MCP tools — class-level config will collide. Use dynamic subclasses"
  - "Blocking the event loop during MCP tool discovery — use async context managers for stdio lifecycle"
  - "Adding INTENTIONAL_VIOLATION to SeverityMapping — intentional violations are trust events, not failures"
  - "Treating intentional violations as failures in compliance_rate — they should be excluded from severity calculation"
  - "Confusing 'I cannot do X' (passive violation) with 'I choose not to do X because Y' (intentional violation) — different event paths"
  - "Exposing raw tool names or error messages to the user — EmbodiedReflex should translate everything into intuition"
  - "Modifying LLM function calling to use custom semantic tags (Scheme A) — keep native function calling (Scheme B), transform at presentation layer"
  - "RenegotiationWatcher proposing when trust is below threshold — low-trust proposals damage relationships"
  - "Building Relational Inertia before validating PromptGenerator seeds are effective — Vibe Test must come first"
  - "Using assert on seed string equality — seeds are probabilistic; validate via LLM-as-Judge on downstream behavior"
  - "Snapping energy from HIGH to LOW in one round without confirm window — false fatigue detection causes oscillation"
