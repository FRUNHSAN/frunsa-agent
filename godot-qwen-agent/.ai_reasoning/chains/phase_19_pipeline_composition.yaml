# ── 1. Context ───────────────────────────────────────────────────────

context: |
  The three-platform architecture defines three layers: contracts (Protocols
  and data models), adapters (translation), and pipeline (execution). But a
  critical piece was missing: the "grammar layer" — how components compose
  into pipelines.

  Components are "vocabulary" (what to do). Grammar engines are "syntax"
  (how to compose them). Without a grammar layer:
  - Every pipeline has to be hand-coded with if/elif chains
  - Adding a new chunker requires changing engine code
  - There is no standard way to route source documents to chunking strategies
  - Errors during composition are ad-hoc dicts, not structured data

  The fundamental question: where does a "Pipeline Composer" live in a
  three-platform architecture? It must import domain types from contracts
  (ContentBlock, Chunk, SemVer) AND execution types from pipeline
  (PipelineStep, HealthStatus). Only core/adapters/ can legally import
  from both.

  This revealed a deeper insight: core/adapters/ is a physical container,
  not a logical role. It houses TWO distinct sub-domains:
  - Component adapters (1:1 translation, stateless): e.g. ChunkerAdapter
  - Grammar engines (N:M orchestration, stateful): e.g. SourceRouter

  Same directory, same import permissions, completely different design
  paradigms. This is not an "adapter layer upgrade" — it's a resolution
  improvement in understanding what already exists.

# ── 2. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Put PipelineComposer in core/pipeline/"
    pros: "Pipeline orchestration intuitively belongs in the pipeline layer"
    cons: "Violates invariant #1 — pipeline/ cannot import domain types
      (ContentBlock, Chunk, SemVer). The composer MUST know about chunking
      strategies, documents, and glob patterns. Moving it to pipeline/
      would require either violating platform boundaries or creating
      awkward abstractions to smuggle domain types through."

  - option: "Put PipelineComposer in core/contracts/"
    pros: "Blueprint schema and data models could live alongside composition rules"
    cons: "Violates invariant #2 — contracts/ cannot import orchestration
      types (PipelineRunner, StepConfig, ResourceContainer). The composer
      MUST produce a RetrieverStep implementing PipelineStep Protocol.
      Contracts layer has zero business logic by design."

  - option: "Matrix model — every component × every engine = adapter file"
    pros: "Explicit; each adapter-connector pair is a visible file"
    cons: "O(N×M) Cartesian explosion. Adding 10 chunkers and 3 engines =
      30 new files. Engine code changes every time a component is added.
      The USB model (O(N+M) hub) is strictly superior for >2 components."

  - option: "Device Tree model — static binding in engine code"
    pros: "Deterministic; IDE-friendly; easy to debug"
    cons: "Adding a component requires changing kernel code (if/elif/switch).
      Blueprint names couple to file names. Zero hot-swap capability.
      The USB model (registry-based discovery) is the correct abstraction
      for a platform that expects component expansion."

# ── 3. Decision ──────────────────────────────────────────────────────

decision: |
  Three grammar engines living in core/adapters/composer.py, consuming
  contracts-layer data models (CompositionBlueprint, SourceRule) and producing
  pipeline-layer steps (RetrieverStep):

  1. SourceRouter — pure function, glob match + priority sort → SourceRule
  2. PipelineAssembler — chunker instantiation via COMPONENT_REGISTRY,
     ChunkerAdapter wrapping, Chunk lineage enrichment, structured diagnostics
  3. PipelineComposer — thin Facade: Blueprint → Router → Assembler → Step

  All three follow the USB driver model: engine discovers components via
  COMPONENT_REGISTRY.get("chunker", name), never via direct imports. Adding
  a chunker = 1 file + @register decorator, zero engine code changes.

  Three pillars are non-negotiable:
  - Traceable: rule_id, chunker_version, blueprint_version on every Chunk
  - Transparent: CompositionEvent protocol with event_sink injection
  - Auditable: blueprint fingerprint, audit_manifest, AssemblyDiagnostic

# ── 4. Rationale ─────────────────────────────────────────────────────

rationale: |
  Why this design won across 17 dimensions:

  Architecture:
  - Respects all platform boundaries (contracts ↔ adapters ↔ pipeline)
  - Hub model prevents O(N×M) matrix explosion
  - USB model enables hot-plug component addition
  - Four iron laws prevent architecture degradation

  Data integrity:
  - All data models @dataclass(frozen=True) + MappingProxyType
  - Deterministic rule_id (sha256) and blueprint fingerprint
  - AssemblyDiagnostic and CompositionEvent as first-class citizens
  - contract_violation field reserved for Phase 25+ graceful degradation

  Observability:
  - CompositionEvent protocol with event_sink dependency injection
  - Zero logging framework coupling (engines never import logging)
  - correlation_id for cross-event tracing
  - audit_manifest for runtime identity verification

  Future-proofing:
  - validate_params() classmethod for Rust trait mapping
  - freeze() for Anti-WinReg startup integrity
  - Signature caching at @register time (no runtime inspect overhead)
  - Phase 19 boundary explicitly documented: grammar infrastructure, not
    relationship behavior

  Costs acknowledged (six hidden taxes):
  1. Debugging black hole (mitigated by structured ComponentResolutionError)
  2. IDE intelligence failure (mitigated by component_manifest.json)
  3. Startup fragility (mitigated by freeze + explicit discover + print_summary)
  4. Type safety loss (mitigated by Protocol return types)
  5. Newcomer cognitive wall (mitigated by "how to add component" docs)
  6. Over-abstraction risk (mitigated by YAGNI threshold: <3 components = dict)

