# ── 1. Context ───────────────────────────────────────────────────────

context: |
  Phase 8 established async-native DAG streaming with WAIT_ALL merge
  semantics and InternalStream/UserFacing isolation. The RAG engine
  operates correctly within a single process.

  Phase 9 asks: what happens when this engine needs to run in a cloud-native
  environment alongside future engine types (Planning, Reflection, Multi-Agent)?

  The key insight: RAG is ONE engine type among many. The architecture must
  accommodate other engine types without RAG-specific concepts leaking into
  the transport layer. This chain documents the boundary between the RAG
  engine and the cloud-native adaptation layer that will serve ALL engine types.

# ── 2. Decision ──────────────────────────────────────────────────────

decision: |
  Five interconnected decisions for Phase 9:

  1. AsyncDataStreamAdapter as transport-agnostic bridge:
     Named AsyncDataStreamAdapter (NOT JsonRpcStreamAdapter) because
     JSON-RPC is just ONE serialization option. The adapter accepts
     pluggable SerializationFormat and TransportBackend — JSON-RPC 2.0
     + gRPC is one combination; msgpack + Redis Streams is another.

  2. Pace shaping parameterized as item_throughput (NOT token_rate):
     The RAG engine primarily streams text tokens today, but other engine
     types may stream structured data items, images, or intermediate
     results. item_throughput is generic across all item types.

  3. Transport adapters ONLY in core/adapters/:
     The engine core (pipeline/engine.py) remains transport-agnostic.
     PaceShapingWrapper lives in adapters/ as a transport QoS concern.
     pace_stream() convenience in pipeline/streaming.py delegates to it.

  4. StreamItem as the single data model for both memory and wire:
     No intermediate DataStreamMessage type. SerializationFormat converts
     StreamItem ↔ bytes directly. This keeps the data model surface minimal.

  5. De-RAG-specialization:
     No "agent state", "conversation history", or "user identity" concepts
     enter the RAG engine. These belong to a separate Agent engine that
     would call the RAG engine as a service via AsyncDataStreamAdapter.
     Guardrails rules are named by behavior (internal_stream_only,
     transport_adapter_boundary), not by domain.

# ── 3. Rationale ─────────────────────────────────────────────────────

rationale: |
  Why transport-agnostic:
  - Hardcoding JSON-RPC into the adapter name bakes a serialization choice
    into the architecture. If we later need protobuf for performance or
    msgpack for binary efficiency, the name AsyncDataStreamAdapter stays
    correct — only the constructor's serializer parameter changes.
  - Transport backends (gRPC, Redis, Kafka) have different trade-offs
    (latency vs throughput vs ordering guarantees). The Protocol boundary
    lets us switch without touching engine code.

  Why item_throughput over token_rate:
  - RAG text streams measure in tokens, but a future Planning engine might
    stream structured steps, a Batch engine might stream data chunks, and
    a Multi-Agent engine might stream inter-agent messages. None of these
    have "tokens."
  - Naming the parameter by what it controls (items per second) rather
    than what the items happen to be (tokens) prevents domain leakage.

  Why pace shaping in adapters/ not pipeline/:
  - PaceShapingWrapper may need to consult transport-level backpressure
    signals (K8s Metrics API, consumer lag, queue depth). These are
    transport-layer concerns. Putting pace shaping in pipeline/ would
    create an implicit dependency on transport concepts.
  - The thin pace_stream() in pipeline/streaming.py is pure delegation —
    it imports from adapters/ only at call time, not module load time.

  Why NOT to introduce Agent concepts into RAG engine:
  - Each engine type should have clear boundaries. The RAG engine handles
    retrieval-augmented generation. An Agent engine handles planning,
    tool orchestration, and conversation state. Blurring these boundaries
    creates coupling that makes both engines harder to evolve.
  - The AsyncDataStreamAdapter IS the boundary — Agent engines call RAG
    as a service through it, with StreamItem as the universal data unit.

# ── 4. Alternatives ──────────────────────────────────────────────────

alternatives:
  - option: "Name it JsonRpcStreamAdapter"
    pros: "Self-documenting; clear what wire format is used"
    cons: "Bakes JSON-RPC into the name; cannot switch to msgpack/protobuf
      without renaming. Violates transport-agnostic principle."

  - option: "Parameterize as token_rate"
    pros: "Familiar to LLM developers; maps to tokens-per-second"
    cons: "RAG/Reranker/Chunker streams may not be token-based. Non-text
      streams have no 'tokens'. Leaks RAG-domain concepts into generic layer."

  - option: "Put pace shaping in pipeline/streaming.py"
    pros: "Co-located with merge_streams(); symmetric with stream utilities"
    cons: "Pace shaping involves transport backpressure signals which are
      transport-layer concerns. Putting it in pipeline/ creates an implicit
      dependency on transport concepts."

  - option: "Add Agent state, conversation history to RAG engine"
    pros: "Unified engine handles both simple RAG and conversational chains"
    cons: "Bloats the RAG engine with agent-specific semantics. Each engine
      type should have clear boundaries. Agents call RAG as a service."

  - option: "Create intermediate DataStreamMessage dataclass for wire format"
    pros: "Clean separation between in-memory and wire representations"
    cons: "Adds a type that mirrors StreamItem field-for-field. The
      serialization boundary (bytes) is already a clean separation point.
      An intermediate type is ceremony without value."

