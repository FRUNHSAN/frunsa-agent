# ── 6. Anti-Patterns ─────────────────────────────────────────────────

anti_patterns:
  - "Hardcoding token_rate instead of item_throughput. This bakes LLM text-stream assumptions into a generic streaming protocol."
  - "Putting transport-specific imports (grpc, redis) in pipeline/engine.py. The engine core must stay transport-agnostic."
  - "Introducing agent state (conversation_history, user_identity) into RAG engine's StepOutput or state dict."
  - "Naming adapters by serialization format (JsonRpcAdapter) instead of behavior (AsyncDataStreamAdapter)."
  - "Making PaceShapingWrapper modify StreamItem data content. Pace shaping only controls timing — the frozen dataclass must stay immutable."
  - "Creating intermediate data types between StreamItem and bytes. The serialization boundary (bytes) is sufficient separation."

# ── 7. Future Guidance ───────────────────────────────────────────────

future_guidance: |
  1. When adding a new transport backend:
     - Implement TransportBackend Protocol in core/adapters/transports/
     - Must pass the transport backpressure test matrix
     - Must implement health_check() returning bool
     - Must NOT import from core/pipeline/

  2. When adding a new engine type (Agent, Batch, Event-driven):
     - Define its own StepOutput variant or use the existing one
     - Register its steps via @register_component with a new component_type
     - Its transport through AsyncDataStreamAdapter should use the SAME
       SerializationFormat and TransportBackend — no engine-specific wire format
     - Do NOT add engine-type-specific fields to StreamItem

  3. When extending PaceConfig:
     - All new fields must have backward-compatible defaults
     - Frozen dataclass integrity must be preserved
     - Adaptive backpressure signals must be pluggable (Callable, not hardcoded)

  4. When adding a new serialization format:
     - Implement SerializationFormat Protocol
     - Must cover ALL 4 StreamItem state combinations
     - Must raise ValueError on illegal state (is_terminal=False, error!=None)

  5. Guardrails extensibility:
     - transport_adapter_boundary's _TRANSPORT_MODULES set should be extended
       when new cloud-native libraries are adopted
     - internal_stream_only follows the same AST pattern as stream_isolation —
       new stream-related rules should reuse _get_import_nodes helper
