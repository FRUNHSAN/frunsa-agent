context: |
  PLAN1 treated all violations as bugs. PLAN2 distinguishes passive violations
  (repair) from active violations (trust). Four Phases: moral intuition (26),
  skin and nerves (27), tech recession (28), trust crystallization (29).

alternatives:
  - option: "Treat all violations as bugs to fix (PLAN1)"
    pros: "Simple, well-tested"
    cons: "Cannot distinguish 'I can't' from 'I choose not to'"
  - option: "Intentional violations as separate code path outside contracts"
    pros: "Doesn't touch existing violation system"
    cons: "Duplicates infrastructure; intentional violations lose audit trail"

decision: |
  INTENTIONAL_VIOLATION is NOT a failure — it's a trust-building choice.
  RelationalField captures real-time relationship temperature.
  EmbodiedReflex translates ToolResult into natural intuition (Scheme B).
  RenegotiationWatcher crystallizes accumulated trust into contract proposals.

rationale: |
  First blind test subject reported "听得进去" — proving relational adaptation
  is perceptible. Golden parameters calibrated: fatigue 78% compression,
  trust stable at 0.5, Renegotiation threshold lowered to 0.55.

