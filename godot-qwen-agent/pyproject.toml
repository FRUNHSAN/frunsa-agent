[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "godot-qwen-agent"
version = "0.22.0"
description = "Contract-Adaptive Agent Kernel — the first implementation of a Contractual Relational Entity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FRUNHSAN"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Kernel runtime (minimal: contracts + adapters + pipeline)
kernel = [
    "pyyaml>=6.0",
]

# LLM backends
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
    "python-dotenv>=1.0",
    "dashscope>=1.20",
]

# Demo & visualization
demo = [
    "streamlit>=1.28",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
]

# Backend & embeddings
backend = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "torch>=2.0",
    "scikit-learn>=1.3",
]

# Full install
full = [
    "godot-qwen-agent[kernel,llm,demo,backend]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--tb=short"]

[tool.setuptools.packages.find]
include = ["core*", "LLM*", "components*", "guardrails*", "engines*"]
